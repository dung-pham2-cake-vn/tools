      summary: Truy vấn chi tiết đơn hàng đã chuyển đổi trả góp
      operationId: getInstallmentDetail
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ loan_code, phone_number, installment_id ]
              properties:
                loan_code:
                  type: string
                  description: Mã khoản vay từ API /loan-register
                  example: "u8123123Sjsdb"
                phone_number:
                  type: string
                  description: Số điện thoại KH (bắt đầu bằng số 0)
                  example: "0xxxxxxxxx"
                installment_id:
                  type: string
                  description: installment_id từ API /installment-request
                  example: "3b6c9a18-4c92-4c8a-9e6f-2e4b7e1c9f34"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallmentDetailResponse"

  /get-installment-transactions:
    post:
      tags: [ Installment ]
      summary: Truy vấn danh sách đơn hàng đã chuyển đổi trả góp
      description: |
        - status=ACTIVE: lấy full giao dịch
        - status=CLOSE: lấy giao dịch có end_date trong 3 tháng gần nhất
        Hỗ trợ phân trang bằng cursor.
      operationId: getInstallmentTransactions
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ loan_code, phone_number, status, limit_unit_page, cursor ]
              properties:
                loan_code:
                  type: string
                  description: Mã khoản vay từ API /loan-register
                  example: "u8123123Sjsdb"
                phone_number:
                  type: string
                  description: Số điện thoại KH (bắt đầu bằng số 0)
                  example: "0xxxxxxxxx"
                status:
                  type: string
                  enum: [ ACTIVE, CLOSE ]
                limit_unit_page:
                  type: integer
                  description: Giới hạn trên mỗi trang (tối đa 50)
                  maximum: 50
                  example: 20
                cursor:
                  type: string
                  description: Con trỏ dùng để lấy dữ liệu trang tiếp theo
                  default: ""
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          cursor:
                            type: string
                            description: Con trỏ dùng để lấy dữ liệu trang tiếp theo
                          total_records:
                            type: string
                          items:
                            type: array
                            items:
                              type: object
                              properties:
                                transaction:
                                  $ref: "#/components/schemas/InstallmentTransactionInfo"
                                installment:
                                  $ref: "#/components/schemas/InstallmentInfo"

  # ════════════════════
  # PARTNER CALLBACKS (Cake gọi Partner)
  # ════════════════════
  /partner-update-status:
    post:
      tags: [ Partner Callbacks ]
      summary: Cake cập nhật trạng thái hồ sơ sang đối tác
      description: |
        **Chiều: Cake → Partner**
        Cake chủ động gọi API này trên hệ thống của đối tác để thông báo thay đổi trạng thái hồ sơ.
        Partner cần expose endpoint này và trả về response chuẩn.
      operationId: partnerUpdateStatus
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerUpdateStatusRequest"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerCallbackResponse"

  /partner-disburse-request:
    post:
      tags: [ Partner Callbacks ]
      summary: Cake gửi yêu cầu giải ngân sang đối tác
      description: |
        **Chiều: Cake → Partner**
        Cake gửi yêu cầu giải ngân khoản vay tới đối tác.
        Partner thực hiện giải ngân và gọi lại API /disburse-update để xác nhận kết quả.
      operationId: partnerDisburseRequest
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerDisburseRequest"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerCallbackResponse"

  /partner-repayment-status:
    post:
      tags: [ Partner Callbacks ]
      summary: Cake cập nhật trạng thái thanh toán sang đối tác
      description: |
        **Chiều: Cake → Partner**
        Cake thông báo kết quả giao dịch thanh toán khoản vay cho đối tác.
      operationId: partnerRepaymentStatus
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerRepaymentStatusRequest"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerCallbackResponse"

  /partner-payment-status:
    post:
      tags: [ Partner Callbacks ]
      summary: Cake cập nhật trạng thái thanh toán dịch vụ sang đối tác
      description: |
        **Chiều: Cake → Partner**
        Cake thông báo kết quả giao dịch payment (và installment nếu có) cho đối tác.
      operationId: partnerPaymentStatus
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerPaymentStatusRequest"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerCallbackResponse"

# ─────────────────────────────────────────────
# TAGS
# ─────────────────────────────────────────────
tags:
  - name: Challenge
    description: |
      Nhóm API xác thực thêm (OTP/Facematch).
      Được gọi khi challenge_level = 2 hoặc 3 từ các API khác.

      **Challenge Levels:**
      - `1` - None: Không cần xác thực thêm
      - `2` - Facematch: Gọi API `challenge-facematch`
      - `3` - SMS OTP: Gọi `challenge-get-otp` rồi `challenge-verify-otp`
  - name: Onboarding
    description: |
      Luồng đăng ký khoản vay:
      check-profile → client-create → client-update → loan-register → (get-esign)
  - name: Contract
    description: |
      Luồng ký hợp đồng:
      get-esign → get-otp → verify-esign
      Hoặc: contract-cancel, disburse-update
  - name: Repayment
    description: Thanh toán kỳ hạn khoản vay (confirm, VAN QR, status)
  - name: Termination
    description: Tất toán hợp đồng vay trước hạn
  - name: Payment
    description: Thanh toán dịch vụ (Paylater payment feature)
  - name: Installment
    description: Chuyển đổi giao dịch sang trả góp
  - name: Partner Callbacks
    description: |
      API Cake gọi sang Partner (webhook/callback).
      Partner phải expose các endpoint này trên hệ thống của mình.
      Xác thực ngược chiều (Cake ký, Partner verify).

# ─────────────────────────────────────────────
# SEQUENCE DIAGRAMS - API FLOWS (x-extension)
# ─────────────────────────────────────────────
x-mermaid-flows:

  onboarding: |
    sequenceDiagram
      autonumber
      participant P as Partner
      participant C as Cake

      Note over P,C: BƯỚC 1 - PRE-CHECK
      P->>C: check-profile(phone, full_name, document_id, dob)
      alt reject_code != null
        C-->>P: REJECT - hiển thị thông báo từ chối
      else reject_code = null AND code = 1
        C-->>P: challenge_level=[4], challenge_id
        Note over P,C: BƯỚC 2 - CHALLENGE (DTN Cake OTP)
        P->>C: challenge-get-otp(challenge_id, phone)
        C-->>P: otp_reference_id, otp_expired_at
        P->>C: challenge-verify-otp(otp_reference_id, otp)
        C-->>P: success
        Note over P,C: BƯỚC 3 - TẠO HỒ SƠ KH
        P->>C: client-create(thông tin KH đầy đủ, metadata)
        C-->>P: request_id
        Note over P,C: BƯỚC 4 - eKYC UPLOAD ẢNH
        P->>C: client-update(request_id, selfie, front_nid, back_nid)
        C-->>P: status
        alt status = EKYC_PENDING
          Note over P: Poll get-status cho đến EKYC_SUCCESS
          P->>C: get-status(request_id, phone)
          C-->>P: status=EKYC_SUCCESS
        end
        Note over P,C: BƯỚC 5 - ĐĂNG KÝ KHOẢN VAY
        P->>C: loan-register(request_id, phone)
        C-->>P: status, loan_code
        alt status = LOAN_REVIEWING
          Note over P: Poll get-loan-detail cho đến LOAN_APPROVE
          P->>C: get-loan-detail(loan_code, phone)
          C-->>P: loan_account_status=LOAN_APPROVE
        end
        Note over P: Chuyển sang luồng Contract để ký hợp đồng
      end

  contract_signing: |
    sequenceDiagram
      autonumber
      participant P as Partner
      participant C as Cake

      Note over P,C: Điều kiện vào: loan_code có status=LOAN_APPROVE
      Note over P,C: BƯỚC 1 - LẤY URL HỢP ĐỒNG (gọi mỗi ngày 1 lần)
      P->>C: get-esign(loan_code, phone)
      C-->>P: url(HTML), url_pdf, expired_time
      Note over P: Hiển thị hợp đồng cho KH xem và ký

      Note over P,C: BƯỚC 2 - GỬI OTP KÝ HỢP ĐỒNG
      P->>C: get-otp(loan_code, phone)
      C-->>P: otp_count, blocked, otp_period

      Note over P,C: BƯỚC 3 - KH NHẬP OTP XÁC NHẬN KÝ
      P->>C: verify-esign(loan_code, phone, otp)
      alt is_correct_otp = true
        C-->>P: hợp đồng được ký thành công
        Note over C: Cake gửi partner-disburse-request sang Partner
      else OTP sai
        C-->>P: lỗi - còn remaining_attempts lần thử lại
      end

      Note over P,C: KH có thể hủy hợp đồng trước khi ký
      P->>C: contract-cancel(loan_code, phone)
      C-->>P: success

  disburse: |
    sequenceDiagram
      autonumber
      participant P as Partner
      participant C as Cake

      Note over P,C: Điều kiện vào: KH đã ký hợp đồng thành công
      C->>P: partner-disburse-request(loan_code, phone, approved_amount)
      Note over P: Partner thực hiện giải ngân cho KH
      alt Giải ngân thành công
        P->>C: disburse-update(loan_code, partner_disburse_status=1)
        C-->>P: success - loan chuyển sang LOAN_ACTIVE
      else Giải ngân thất bại
        P->>C: disburse-update(loan_code, partner_disburse_status=2)
        C-->>P: success - loan chuyển sang trạng thái lỗi
      end

      Note over P,C: Trường hợp disburse-update thất bại
      C->>P: partner-disburse-request(retry)
      Note over P: KHÔNG giải ngân lại - chỉ gọi lại disburse-update
      P->>C: disburse-update(loan_code, partner_disburse_status=1)

  repayment: |
    sequenceDiagram
      autonumber
      participant P as Partner
      participant C as Cake

      Note over P,C: Điều kiện vào: loan_code có status=LOAN_ACTIVE

      alt Thanh toán qua Partner (confirm flow)
        Note over P,C: BƯỚC 1 - TẠO YÊU CẦU THANH TOÁN
        P->>C: repayment-request(loan_code, phone, partner_reference_id, payment_amount)
        C-->>P: order_id
        Note over P: Partner xử lý thanh toán
        Note over P,C: BƯỚC 2 - XÁC NHẬN THANH TOÁN
        P->>C: repayment-confirm(loan_code, order_id, payment_amount)
        C-->>P: success
      else Thanh toán qua QR VAN
        Note over P,C: BƯỚC 1 - TẠO QR THANH TOÁN
        P->>C: repayment-van(loan_code, phone, partner_reference_id, payment_amount)
        C-->>P: order_id, qr_code, expired_time, bank_account_number
        Note over P: Hiển thị QR cho KH quét
        Note over P,C: BƯỚC 2 - POLL TRẠNG THÁI
        P->>C: repayment-status(loan_code, order_id)
        C-->>P: status(INIT/IN_PROCESS/SUCCESS/FAILED/HOLD)
      end

      Note over C: Cake callback sang Partner
      C->>P: partner-repayment-status(loan_code, order_id, status)

  termination: |
    sequenceDiagram
      autonumber
      participant P as Partner
      participant C as Cake

      Note over P,C: BƯỚC 1 - KIỂM TRA ĐIỀU KIỆN TẤT TOÁN
      P->>C: terminate-review(loan_code, phone)
      C-->>P: is_terminable, terminate_amount

      alt is_terminable = false
        Note over P: Không đủ điều kiện tất toán
      else is_terminable = true
        Note over P,C: BƯỚC 2 - TẠO YÊU CẦU TẤT TOÁN
        P->>C: terminate-request(loan_code, phone, partner_reference_id, payment_amount)
        C-->>P: order_id, challenge_level, challenge_id

        alt challenge_level = [1] None
          Note over P,C: BƯỚC 3 - XÁC NHẬN NGAY
          P->>C: terminate-confirm(loan_code, order_id, challenge_id)
          C-->>P: success
        else challenge_level = [2] Facematch
          P->>C: challenge-facematch(challenge_id, phone, selfie_image)
          C-->>P: success
          P->>C: terminate-confirm(loan_code, order_id, challenge_id)
          C-->>P: success
        else challenge_level = [3] SMS OTP
          P->>C: challenge-get-otp(challenge_id, phone)
          C-->>P: otp_reference_id
          P->>C: challenge-verify-otp(otp_reference_id, otp)
          C-->>P: success
          P->>C: terminate-confirm(loan_code, order_id, challenge_id)
          C-->>P: success
        end

        Note over P,C: HOẶC: Thanh toán qua QR VAN
        P->>C: terminate-van(loan_code, partner_reference_id, payment_amount)
        C-->>P: order_id, qr_code, bank_account_number
      end

  payment: |
    sequenceDiagram
      autonumber
      participant P as Partner
      participant C as Cake

      Note over P,C: Điều kiện vào: loan_code có status=LOAN_ACTIVE (Paylater)

      opt Lấy danh sách gói trả góp trước
        P->>C: get-installment-offers(loan_code, payment_amount, service_code)
        C-->>P: installment_offers[tenor, fee_rate]
      end

      Note over P,C: BƯỚC 1 - TẠO YÊU CẦU THANH TOÁN DỊCH VỤ
      P->>C: payment-request(loan_code, partner_reference_id, payment_amount, service_code, installment_tenor?)
      C-->>P: order_id, payment_fee, challenge_level, challenge_id

      alt challenge_level = [1] None
        P->>C: payment-confirm(loan_code, order_id, challenge_id)
        C-->>P: success
      else challenge_level = [2] Facematch
        P->>C: challenge-facematch(challenge_id, phone, selfie_image)
        C-->>P: success
        P->>C: payment-confirm(loan_code, order_id, challenge_id)
        C-->>P: success
      else challenge_level = [3] SMS OTP
        P->>C: challenge-get-otp(challenge_id, phone)
        C-->>P: otp_reference_id
        P->>C: challenge-verify-otp(otp_reference_id, otp)
        C-->>P: success
        P->>C: payment-confirm(loan_code, order_id, challenge_id)
        C-->>P: success
      end

      Note over P,C: BƯỚC 2 - KIỂM TRA TRẠNG THÁI
      P->>C: payment-status(loan_code, order_id)
      C-->>P: payment_status, installment_status

      opt Hoàn tiền
        P->>C: payment-revert(loan_code, order_id, payment_amount, revert_amount)
        C-->>P: success
      end

      Note over C: Cake callback sang Partner
      C->>P: partner-payment-status(loan_code, status, status_installment?)

  installment_conversion: |
    sequenceDiagram
      autonumber
      participant P as Partner
      participant C as Cake

      Note over P,C: Điều kiện vào: Đã có giao dịch payment thành công

      Note over P,C: BƯỚC 1 - TÌM ĐƠN HÀNG ĐỦ ĐIỀU KIỆN CHUYỂN ĐỔI
      P->>C: get-installment-eligible(loan_code, phone, limit, cursor)
      C-->>P: items[order_id, payment_amount, ...], cursor

      Note over P,C: BƯỚC 2 - LẤY DANH SÁCH GÓI TRẢ GÓP
      P->>C: get-installment-offering-list(loan_code, order_id)
      C-->>P: items[tenor, ins_fee_type, total_ins_fee_amount_vat, total_amount]

      Note over P: KH chọn gói trả góp

      Note over P,C: BƯỚC 3 - TẠO YÊU CẦU CHUYỂN ĐỔI
      P->>C: installment-request(loan_code, order_id, partner_reference_id, tenor)
      C-->>P: installment_id, challenge_level=[3], challenge_id

      Note over P,C: BƯỚC 4 - CHALLENGE (luôn là SMS OTP)
      P->>C: challenge-get-otp(challenge_id, phone)
      C-->>P: otp_reference_id
      P->>C: challenge-verify-otp(otp_reference_id, otp)
      C-->>P: success

      Note over P,C: BƯỚC 5 - XÁC NHẬN CHUYỂN ĐỔI
      P->>C: installment-confirm(loan_code, order_id, installment_id, challenge_id)
      C-->>P: installment_id confirmed

      Note over P,C: TRUY VẤN SAU KHI CHUYỂN ĐỔI
      P->>C: get-installment-detail(loan_code, installment_id)
      C-->>P: transaction, installment(tenor, schedule, amounts)
      P->>C: get-installment-transactions(loan_code, status=ACTIVE, cursor)
      C-->>P: total_records, items[]

  challenge_sub_flow: |
    sequenceDiagram
      autonumber
      participant P as Partner
      participant C as Cake

      Note over P,C: Sub-flow này được gọi từ nhiều luồng khác nhau
      Note over P,C: Tương ứng với challenge_level trả về từ API chính

      alt challenge_level = [1] None
        Note over P: Không cần xác thực thêm, gọi thẳng API confirm
      else challenge_level = [2] Facematch
        P->>C: challenge-facematch(challenge_id, phone, selfie_image)
        C-->>P: success
        Note over P: Gọi tiếp API confirm với challenge_id
      else challenge_level = [3] SMS OTP
        P->>C: challenge-get-otp(challenge_id, phone)
        C-->>P: otp_reference_id, otp_expired_at(2 phút)
        Note over P: KH nhập OTP nhận được qua SMS
        P->>C: challenge-verify-otp(otp_reference_id, challenge_id, otp)
        alt OTP đúng
          C-->>P: success, remaining_attempts
          Note over P: Gọi tiếp API confirm với challenge_id
        else OTP sai
          C-->>P: lỗi 170003, còn remaining_attempts lần
          Note over P: Thử lại hoặc get-otp mới
        end
      else challenge_level = [4] DTN Cake OTP
        Note over P: Chỉ dùng trong check-profile flow
        P->>C: challenge-get-otp(challenge_id, phone)
        C-->>P: otp_reference_id
        P->>C: challenge-verify-otp(otp_reference_id, otp)
        C-->>P: success
      end
