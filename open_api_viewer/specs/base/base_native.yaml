        phone_number:
          type: string
          description: Số điện thoại KH (bắt đầu bằng số 0)
          example: "0xxxxxxxxx"
        partner_reference_id:
          type: string
          description: ID tạo mới mỗi request
        payment_amount:
          type: integer
          description: Số tiền thanh toán (VNĐ)

    # ── Payment ──
    GetInstallmentOffersRequest:
      type: object
      required:
        - loan_code
        - phone_number
        - payment_amount
        - partner_service_code
        - partner_service_name
      properties:
        loan_code:
          type: string
          description: Mã khoản vay từ API /loan-register
          example: "u8123123Sjsdb"
        phone_number:
          type: string
          description: Số điện thoại KH (bắt đầu bằng số 0)
          example: "0xxxxxxxxx"
        payment_amount:
          type: integer
          description: Số tiền cần thanh toán
        partner_group_code:
          type: string
          nullable: true
          description: Mã nhóm dịch vụ
        partner_group_name:
          type: string
          nullable: true
          description: Tên nhóm dịch vụ
        partner_service_code:
          type: string
          description: Mã dịch vụ
        partner_service_name:
          type: string
          description: Tên dịch vụ

    GetInstallmentOffersResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                installment_offers:
                  type: array
                  nullable: true
                  items:
                    type: object
                    properties:
                      tenor:
                        type: number
                        description: Kỳ hạn trả góp (tháng)
                        example: 3
                      fee_rate:
                        type: number
                        description: Tỷ lệ phí theo tenor
                        example: 0.1

    PaymentRequestBody:
      type: object
      required:
        - loan_code
        - phone_number
        - partner_reference_id
        - payment_amount
        - partner_service_code
        - partner_service_name
      properties:
        loan_code:
          type: string
          description: Mã khoản vay từ API /loan-register
          example: "u8123123Sjsdb"
        phone_number:
          type: string
          description: Số điện thoại KH (bắt đầu bằng số 0)
          example: "0xxxxxxxxx"
        partner_reference_id:
          type: string
          description: ID tạo mới mỗi request
        payment_amount:
          type: integer
          description: Số tiền thanh toán dịch vụ
        partner_group_code:
          type: string
          nullable: true
          description: Mã nhóm dịch vụ
        partner_group_name:
          type: string
          nullable: true
          description: Tên nhóm dịch vụ
        partner_service_code:
          type: string
          description: Mã dịch vụ
        partner_service_name:
          type: string
          description: Tên dịch vụ
        installment_tenor:
          type: integer
          nullable: true
          description: Kỳ hạn trả góp (tháng), lấy từ danh sách gói trả góp. Không truyền / null = thanh toán 1 lần, không trả góp.
          example: 3

    PaymentRequestResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                order_id:
                  type: string
                  description: Mã tham chiếu giao dịch
                payment_fee:
                  type: number
                  description: Phí thanh toán đơn hàng
                challenge_level:
                  type: array
                  items:
                    type: integer
                  description: "1=None, 2=Facematch, 3=SMS OTP"
                  example: [ 3 ]
                challenge_id:
                  type: string
                  description: ID dùng cho API xác thực challenge
                  example: "a27f5d0e-8b43-4e3f-9bfa-0c6d7c5b2189"

    PaymentConfirmRequest:
      type: object
      required:
        - loan_code
        - phone_number
        - partner_reference_id
        - order_id
        - challenge_id
      properties:
        loan_code:
          type: string
          description: Mã khoản vay từ API /loan-register
          example: "u8123123Sjsdb"
        phone_number:
          type: string
          description: Số điện thoại KH (bắt đầu bằng số 0)
          example: "0xxxxxxxxx"
        partner_reference_id:
          type: string
          description: partner_reference_id từ API /payment-request
        order_id:
          type: string
          description: order_id từ API /payment-request
        challenge_id:
          type: string
          description: ID dùng cho API xác thực challenge
          example: "a27f5d0e-8b43-4e3f-9bfa-0c6d7c5b2189"

    PaymentStatusRequest:
      type: object
      required:
        - loan_code
        - phone_number
        - partner_reference_id
        - order_id
      properties:
        loan_code:
          type: string
          description: Mã khoản vay, nhận từ API /partner-update-status
          example: "u8123123Sjsdb"
        phone_number:
          type: string
          description: SĐT của KH (định dạng bắt đầu bằng số 0), dùng để đối chiếu với loan_code
          example: "0xxxxxxxxx"
        partner_reference_id:
          type: string
          description: partner_reference_id đã truyền ở API /generate-webview/payment-request
        order_id:
          type: string
          description: order_id từ response API /generate-webview/payment-request

    PaymentStatusResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              description: Trạng thái giao dịch thanh toán dịch vụ
              properties:
                loan_code:
                  type: string
                  description: Mã khoản vay (null nếu REJECTED)
                payment_status:
                  type: string
                  description: |-
                    Trạng thái giao dịch thanh toán:
                    - `INIT`: Đã tạo yêu cầu, KH chưa xác nhận trong webview
                    - `IN_PROCESS`: KH đã xác nhận, Cake đang xử lý ghi nợ
                    - `HOLD`: Đã ghi nhận giao dịch nhưng lỗi hạch toán, cần đối soát thủ công
                    - `SUCCESS`: Thanh toán thành công
                    - `FAILED`: Thanh toán thất bại, KH hủy hoặc yêu cầu hết hạn
                    - `REVERT`: Giao dịch đã được hoàn tiền qua API /payment-revert
                  enum:
                    - INIT
                    - IN_PROCESS
                    - HOLD
                    - SUCCESS
                    - FAILED
                    - REVERT
                installment_status:
                  type: string
                  enum:
                    - NONE
                    - INIT
                    - SUCCESS
                    - FAILED
                  description: Trạng thái trả góp (nếu có)

    PaymentRevertRequest:
      type: object
      required:
        - loan_code
        - phone_number
        - partner_reference_id
        - order_id
        - payment_amount
        - revert_amount
      properties:
        loan_code:
          type: string
          description: Mã khoản vay, nhận từ API /partner-update-status
          example: "u8123123Sjsdb"
        phone_number:
          type: string
          description: SĐT của KH (định dạng bắt đầu bằng số 0), dùng để đối chiếu với loan_code
          example: "0xxxxxxxxx"
        partner_reference_id:
          type: string
          description: partner_reference_id đã truyền ở API /generate-webview/payment-request
        order_id:
          type: string
          description: order_id từ response API /generate-webview/payment-request
        payment_amount:
          type: integer
          description: Số tiền đơn hàng gốc
        revert_amount:
          type: integer
          description: Số tiền cần revert (≤ payment_amount)

    # ── Installment ──
    GetInstallmentEligibleRequest:
      type: object
      required:
        - loan_code
        - phone_number
        - limit_unit_page
        - cursor
      properties:
        loan_code:
          type: string
          description: Mã khoản vay từ API /loan-register
          example: "u8123123Sjsdb"
        phone_number:
          type: string
          description: Số điện thoại KH (bắt đầu bằng số 0)
          example: "0xxxxxxxxx"
        limit_unit_page:
          type: integer
          description: Giới hạn trên mỗi trang (tối đa 50)
          maximum: 50
          example: 20
        cursor:
          type: string
          description: Cursor từ yêu cầu trước đó (mặc định rỗng)
          default: ""

    GetInstallmentEligibleResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                cursor:
                  type: string
                  description: Con trỏ dùng để lấy dữ liệu trang tiếp theo
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      order_id:
                        type: string
                        description: order_id từ API /payment-request
                      payment_amount:
                        type: string
                        description: Số tiền thanh toán (VNĐ)
                      created_at:
                        type: string
                        description: Timestamp tạo đơn
                      updated_at:
                        type: string
                        description: Timestamp cập nhật đơn
                      partner_service_code:
                        type: string
                        description: Mã dịch vụ
                      partner_service_name:
                        type: string
                        description: Tên dịch vụ
                      partner_group_code:
                        type: string
                        nullable: true
                        description: Mã nhóm dịch vụ
                      partner_group_name:
                        type: string
                        nullable: true
                        description: Tên nhóm dịch vụ
                      partner_branch_id:
                        type: string
                        nullable: true
                      partner_branch_name:
                        type: string
                        nullable: true

    GetInstallmentOfferingListRequest:
      type: object
      required:
        - loan_code
        - phone_number
        - order_id
      properties:
        loan_code:
          type: string
          description: Mã khoản vay từ API /loan-register
          example: "u8123123Sjsdb"
        phone_number:
          type: string
          description: Số điện thoại KH (bắt đầu bằng số 0)
          example: "0xxxxxxxxx"
        order_id:
          type: string
          description: order_id từ API /payment-request

    GetInstallmentOfferingListResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      tenor:
                        type: string
                        description: Kỳ hạn (tháng)
                        example: "3"
                      ins_fee_type:
                        type: string
                        enum: [ per_month, total ]
                        description: "per_month: phí theo tháng; total: phí kỳ đầu"
                      total_ins_fee_amount_vat:
                        type: string
                        description: "Tổng phí (bao gồm VAT) = payment_amount * ins_fee_rate_vat *
                          tenor"
                        example: "891000"
                      total_amount:
                        type: string
                        description: "Tổng tiền = payment_amount + total_ins_fee_amount_vat"
                        example: "9891000"

    InstallmentRequestBody:
      type: object
      required:
        - loan_code
        - phone_number
        - partner_reference_id
        - order_id
        - tenor
      properties:
        loan_code:
          type: string
          description: Mã khoản vay từ API /loan-register
          example: "u8123123Sjsdb"
        phone_number:
          type: string
          description: Số điện thoại KH (bắt đầu bằng số 0)
          example: "0xxxxxxxxx"
        partner_reference_id:
          type: string
          description: ID tạo mới mỗi request
          example: "7c3c4c3c-6c62-4c5f-9f83-2f8c4e4c9b6e"
        order_id:
          type: string
          description: order_id từ API /payment-request
          example: "f13b2e6b-9f0c-4f72-a3d4-6b1c89f0e2aa"
        tenor:
          type: string
          description: Kỳ hạn (tháng)
          example: "3"

    InstallmentRequestResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                installment_id:
                  type: string
                  description: Mã tham chiếu do CAKE tạo ra
                  example: "3b6c9a18-4c92-4c8a-9e6f-2e4b7e1c9f34"
                challenge_level:
                  type: array
                  items:
                    type: integer
                  description: "Sản phẩm này luôn là [3] (SMS OTP)"
                  example: [ 3 ]
                challenge_id:
                  type: string
                  description: ID dùng cho API xác thực challenge
                  example: "a27f5d0e-8b43-4e3f-9bfa-0c6d7c5b2189"

    InstallmentConfirmRequest:
      type: object
      required:
        - loan_code
        - phone_number
        - partner_reference_id
        - order_id
        - installment_id
        - challenge_id
      properties:
        loan_code:
          type: string
          description: Mã khoản vay từ API /loan-register
          example: "u8123123Sjsdb"
        phone_number:
          type: string
          description: Số điện thoại KH (bắt đầu bằng số 0)
          example: "0xxxxxxxxx"
        partner_reference_id:
          type: string
          description: partner_reference_id từ API /installment-request
        order_id:
          type: string
          description: order_id từ API /payment-request
        installment_id:
          type: string
          description: installment_id từ API /installment-request
        challenge_id:
          type: string
          description: ID dùng cho API xác thực challenge
          example: "a27f5d0e-8b43-4e3f-9bfa-0c6d7c5b2189"

    InstallmentDetailResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                transaction:
                  $ref: "#/components/schemas/InstallmentTransactionInfo"
                installment:
                  $ref: "#/components/schemas/InstallmentInfo"

    InstallmentTransactionInfo:
      type: object
      properties:
        order_id:
          type: string
          description: order_id từ API /payment-request
        payment_amount:
          type: string
          description: Số tiền đơn hàng gốc (bao gồm phí + VAT)
          example: "9000000"
        partner_service_code:
          type: string
          description: Mã dịch vụ
        partner_service_name:
          type: string
          description: Tên dịch vụ
        partner_group_code:
          type: string
          nullable: true
          description: Mã nhóm dịch vụ
        partner_group_name:
          type: string
          nullable: true
          description: Tên nhóm dịch vụ
        partner_branch_id:
          type: string
          nullable: true
        partner_branch_name:
          type: string
          nullable: true

    InstallmentInfo:
      type: object
      properties:
        installment_id:
          type: string
          description: installment_id từ API /installment-request
        status:
          type: string
          enum: [ ACTIVE, CLOSE ]
          description: "ACTIVE: đang hoạt động; CLOSE: đã tất toán"
        tenor:
          type: string
          description: Kỳ hạn (tháng)
          example: "3"
        ins_fee_type:
          type: string
          description: 'per_month: phí theo tháng; total: phí kỳ đầu'
          enum: [ per_month, total ]
        total_ins_fee_amount_vat:
          type: string
          description: Tổng phí (bao gồm VAT) = payment_amount * ins_fee_rate_vat * tenor
          example: "891000"
        total_amount:
          type: string
          description: Tổng tiền = payment_amount + total_ins_fee_amount_vat
          example: "9891000"
        start_date:
          type: string
          description: Ngày bắt đầu trả góp
        end_date:
          type: string
          nullable: true
          description: Ngày kết thúc trả góp (chỉ với khoản đã close)
        repayment_schedule:
          type: array
          nullable: true
          description: Lịch trả góp (chỉ với khoản đang active)
          items:
            type: object
            properties:
              installment_no:
                type: string
                description: Số thứ tự kỳ
              due_date:
                type: string
                format: date
                description: Ngày đến hạn thanh toán gần nhất, đã bao gồm holiday nếu có
              principal_amount:
                type: string
                description: Tiền gốc phải trả trong kỳ
              fee_amount:
                type: string
                description: Phí trong kỳ (chưa VAT)
              fee_amount_vat:
                type: string
                description: Phí đã bao gồm VAT
              total_amount:
                type: string
                description: Tổng tiền cần thanh toán trong kỳ (đã VAT)

    # ── Partner-side callback schemas ──
    PartnerUpdateStatusRequest:
      type: object
      required:
        - request_id
        - loan_code
        - phone_number
        - status
      properties:
        request_id:
          type: string
          description: ID được sinh ra mỗi request
        partner_reference_id:
          type: string
          nullable: true
          description: ID đối tác truyền ở API /client-create
        loan_code:
          type: string
          description: Mã khoản vay
          example: "u8123123Sjsdb"
        phone_number:
          type: string
          description: Số điện thoại KH (bắt đầu bằng số 0)
          example: "0xxxxxxxxx"
        status:
          type: string
          enum:
            - EKYC_REJECT
            - EKYC_SUCCESS
            - LOAN_APPROVE
            - LOAN_REJECT
            - LOAN_CANCEL
            - LOAN_EXPIRED
            - LOAN_SIGNED
            - LOAN_ACTIVE
            - LOAN_CLOSE
          description: Trạng thái hồ sơ khoản vay Cake

    PartnerDisburseRequest:
      type: object
      required:
        - request_id
        - loan_code
        - phone_number
      properties:
        request_id:
          type: string
          description: request_id được sinh ra ở API client-create
        partner_reference_id:
          type: string
          nullable: true
          description: partner_reference_id của đối tác truyền ở API client-create
        loan_code:
          type: string
          description: Mã khoản vay, chỉ truyền từ khi loan approve
          example: "u8123123Sjsdb"
        phone_number:
          type: string
          description: SĐT của KH (định dạng bắt đầu bằng số 0)
          example: "0xxxxxxxxx"
        approved_amount:
          type: string
          description: Số tiền được phê duyệt
          example: "12000000"

    PartnerRepaymentStatusRequest:
      type: object
      required:
        - request_id
        - loan_code
        - phone_number
        - order_id
        - status
      properties:
        request_id:
          type: string
        loan_code:
          type: string
          description: Mã khoản vay từ API /loan-register
          example: "u8123123Sjsdb"
        phone_number:
          type: string
          description: Số điện thoại KH (bắt đầu bằng số 0)
          example: "0xxxxxxxxx"
        order_id:
          type: string
          description: OrderId từ api repayment-van
        status:
          type: string
          enum: [ SUCCESS, FAILED ]

    PartnerPaymentStatusRequest:
      type: object
      required:
        - request_id
        - loan_code
        - phone_number
        - status
      properties:
        request_id:
          type: string
        loan_code:
          type: string
          description: Mã khoản vay từ API /loan-register
          example: "u8123123Sjsdb"
        phone_number:
          type: string
          description: Số điện thoại KH (bắt đầu bằng số 0)
          example: "0xxxxxxxxx"
        status:
          type: string
          enum: [ SUCCESS, FAILED, REVERT ]
        status_installment:
          type: string
          nullable: true
          enum: [ SUCCESS, FAILED ]
          description: Trạng thái trả góp (nếu có)

  # ── Reusable request headers ──
  requestBodies:
    CommonHeaders:
      description: Headers bắt buộc cho mọi request
      content:
        application/json:
          schema:
            type: object

# ─────────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────────
paths:
  # ════════════════════
  # CHALLENGE
  # ════════════════════
  /challenge-get-otp:
    post:
      tags: [ Challenge ]
      summary: Gửi lại OTP để xác thực challenge
      description: Gửi mã OTP cho KH để xác thực challenge. Mỗi OTP có hiệu lực 2 phút.
      operationId: challengeGetOtp
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeGetOtpRequest"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeGetOtpResponse"

  /challenge-verify-otp:
    post:
      tags: [ Challenge ]
      summary: Xác thực OTP để hoàn tất challenge
      description: |
        Xác thực mã OTP để hoàn tất challenge.
        **Giới hạn:** 3 lần/OTP, 6 lần/ngày. Sai 3 lần liên tiếp bị block 5 phút.
      operationId: challengeVerifyOtp
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeVerifyOtpRequest"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeVerifyOtpResponse"

  /challenge-facematch:
    post:
      tags: [ Challenge ]
      summary: Xác thực khuôn mặt để hoàn tất challenge
      operationId: challengeFacematch
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
