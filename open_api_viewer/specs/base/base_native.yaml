          properties:
            data:
              type: object
              properties:
                request_id:
                  type: string
                  description: ID dùng cho các API client-update, loan-register, get-status
                  example: "req-abc123"

    ClientUpdateRequest:
      type: object
      required:
        - request_id
        - phone_number
        - document_id
        - selfie_image
        - front_nid_image
        - back_nid_image
      properties:
        request_id:
          type: string
          description: Request ID từ API /client-create
        phone_number:
          type: string
          description: Số điện thoại KH (bắt đầu bằng số 0)
          example: "0xxxxxxxxx"
        document_id:
          type: string
          description: Số CCCD/CMND
          example: "xxxxxxxxxxxx"
        selfie_image:
          type: string
          format: byte
          description: Ảnh selfie (base64, size ≤ 1MB, ảnh dọc)
        front_nid_image:
          type: string
          format: byte
          description: Ảnh GTTT mặt trước (base64, size ≤ 1MB, ảnh ngang)
        back_nid_image:
          type: string
          format: byte
          description: Ảnh GTTT mặt sau (base64, size ≤ 1MB, ảnh ngang)
        nfc_data:
          type: object
          nullable: true
          description: Thông tin NFC data raw (nếu truyền, tất cả field bên trong đều required)
          required:
            - sod
            - dg1
            - dg2
            - dg13
            - dg14
            - dg15
            - com
          properties:
            sod:
              type: string
              description: NFC sod value
            dg1:
              type: string
              description: NFC data group 1
            dg2:
              type: string
              description: NFC data group 2
            dg13:
              type: string
              description: NFC data group 13
            dg14:
              type: string
              description: NFC data group 14
            dg15:
              type: string
              description: NFC data group 15
            com:
              type: string
              description: NFC com data

