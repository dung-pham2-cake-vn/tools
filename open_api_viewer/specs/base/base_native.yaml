      description: |
        Tạo hồ sơ KH mới.
        **Điều kiện tiếp tục:** response request_id != null → gọi client-update.
      operationId: clientCreate
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
