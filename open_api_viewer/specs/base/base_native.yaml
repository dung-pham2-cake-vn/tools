      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                status:
                  type: string
                  description: Trạng thái hồ sơ eKYC
                  enum:
                    - EKYC_PENDING
                    - EKYC_REJECT
                    - EKYC_SUCCESS
                  example: EKYC_SUCCESS

