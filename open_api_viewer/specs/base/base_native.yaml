openapi: 3.0.3
info:
  title: product_id - Native Lending APIs
  description: |
    > **⚠️ Lưu ý bản quyền:** Tài liệu này thuộc bản quyền của **Cake by VPBank**.
    > Mọi hình thức sao chép, chỉnh sửa, hoặc phát tán phải được sự đồng ý bằng văn bản của Cake by VPBank.

    ## Mô tả
    API tích hợp giữa đối tác (Partner) và hệ thống Cake Digital Bank cho các sản phẩm vay.

    ## Changelog

    | Thời gian | Email title | Cập nhật |
    |-----------|-------|-------|
    | 2026-0x-0x | email_title | Khởi tạo tài liệu |

    ## Cơ chế xác thực (Signature)
    Tất cả request từ Partner gọi Cake đều phải ký signature:
    ```
    rawBody = {{body}} + {{partner_key}}
    hash = sha256(rawBody)
    signature = base64_encode(rsa.SignPKCS1v15(rand.Reader, privKey, crypto.SHA256, hash))
    ```
    Partner cần tạo cặp khóa RSA 1024 bit: private key (PKCS#8) và public key (X.509).
    Test chữ ký có thể dùng tool online như [https://emn178.github.io/online-tools/rsa/verify](https://emn178.github.io/online-tools/rsa/verify/?input=%7B%22req_id%22%3A%221%22%2C%22action%22%3A1%7DPartner&input_type=utf-8&algorithm=SHA256&public_key=-----BEGIN%20PUBLIC%20KEY-----%0AMIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQC0KTbcJmoAT1g%2FFEp7eWWzuATg%0AK%2F7Go01PKZUaVTsN80JiDdg%2FmgDIcE0D9w5fYsDBN2pgeQ7EW8qqB8wb84qqk7QX%0AzAFfAqGx10X5aRe0WPsL3x7SCnG9QDz%2Fsun7hvrELes2sBw1a63lk3ZHyU9xLAcs%0ASsOFirCfQDlq0sbvNQIDAQAB%0A-----END%20PUBLIC%20KEY-----&signature_input_type=base64&signature=LWRijuKu83sa%2BU2FMe%2BsrtP8ctIaPjNAZ68YBiOiZNhzl%2FBELWztAcnTaOxINjghrfepTRLjhjvQw5mfwZrUHue4hwWDRvCpTMvCSfv513vuKp4kIQFK5EAASMZuhjwTn6mBxeO1i55xWB2wHqXVJxXgFecSok6T8qqJyH4XUzc%3D).

    ## Môi trường

    ### SIT+UAT Environment

    | Key | Value | Description |
    |-----|-------|-------------|
    | CAKE_API_URL | `https://gw.stage.cakedigibank.tech/ext/loan/{group}/{product_id}` | |
    | CAKE_PARTNER_ID | *(Cake cấp)* | Gắn ở header khi gọi API Cake |
    | CAKE_PARTNER_KEY | *(Cake cấp)* | Gắn sau body khi ký api partner |
    | CAKE_IP_ADDRESS | `35.197.157.155/32`<br>`34.87.136.147/32`<br>`35.240.241.82/32`<br>`34.142.212.108/32`<br>`35.198.211.12/32`<br>`34.143.164.202/32`<br>`34.124.200.2/32` | Partner thêm các IP này vào Whitelist |
    | PARTNER_API_URL | *(Partner cấp)* | |
    | PARTNER_PUBLIC_KEY | *(Partner cấp)* | Gọi API Cake, Partner ký bằng private key, Cake verify |
    | PARTNER_IP_ADDRESS | *(Partner cấp)*<br>`34.87.136.147 (Cake auto)` | Cake thêm các IP này vào Whitelist |

    ### PROD Environment

    | Key | Value | Description |
    |-----|-------|-------------|
    | CAKE_API_URL | `https://gw.cake.vn/ext/loan/{group}/{product_id}` | |
    | CAKE_PARTNER_ID | *(Cake cấp)* | Gắn ở header khi gọi API Cake |
    | CAKE_PARTNER_KEY | *(Cake cấp)* | Gắn sau body khi ký api partner |
    | CAKE_IP_ADDRESS | `34.87.56.148/32`<br>`35.240.146.157/32`<br>`34.87.175.195/32`<br>`34.142.177.122/32`<br>`34.87.39.41/32`<br>`34.143.164.31/32`<br>`34.143.174.79/32` | Partner thêm các IP này vào Whitelist |
    | PARTNER_API_URL | *(Partner cấp)* | |
    | PARTNER_PUBLIC_KEY | *(Partner cấp)* | Gọi API Cake, Partner ký bằng private key, Cake verify |
    | PARTNER_IP_ADDRESS | *(Partner cấp)* | Cake thêm các IP này vào Whitelist |

    ## Error Codes

    ### General
    | Code | Message |
    |------|---------|
    | `1` | Thành công |
    | `900000` | Có lỗi xảy ra, vui lòng thử lại sau |
    | `900001` | Hệ thống đang bảo trì |
    | `900002` | Request is processing |
    | `200000` | Chữ ký không hợp lệ |
    | `200001` | Mã đối tác không hợp lệ |
    | `200003` | Request ID không hợp lệ (NID hoặc Phone không khớp) |
    | `400001` | Không có thông tin khoản vay |
    | `100100` | COB Time - không thể thực hiện giao dịch (23:50–4:00) |
    | `500013` | Trường dữ liệu không hợp lệ |

    ### Onboarding / Pre-check
    | Code | Message |
    |------|---------|
    | `100008` | Hồ sơ không đủ điều kiện |
    | `100009` | Thông tin GTTT đã tồn tại |
    | `100011` | Không đủ tuổi đăng ký |
    | `500010` | Hồ sơ mới bị từ chối gần đây (cần đợi 7 ngày) |
    | `500015` | Đang có khoản vay Active |
    | `500016` | GTTT không còn đủ hiệu lực |
    | `500017` | Chưa thực hiện xác thực NFC |
    | `500020` | Hồ sơ không trùng khớp với Cake |
    | `500024` | Tài khoản nhận giải ngân không hợp lệ |
    | `500029` | Đang mở khoản vay khác chưa hoàn tất |
    | `500030` | Tài khoản đang tạm khóa |
    | `500031` | Tài khoản giải ngân không hợp lệ |

    ### Contract
    | Code | Message |
    |------|---------|
    | `300001` | Hợp đồng hết hạn (quá 7 ngày) |
    | `300003` | OTP bị chặn 15 phút (sau 3 lần gửi) |
    | `300004` | Hợp đồng bị hủy (vượt 6 lần get-OTP) |
    | `300005` | Nhập sai OTP |
    | `300006` | Hồ sơ bị block 15 phút (sai OTP 3 lần liên tiếp) |
    | `300007` | Hợp đồng bị hủy (sai OTP 6 lần) |

    ### Challenge
    | Code | Message |
    |------|---------|
    | `170000` | OTP quá nhiều lần, block 15 phút |
    | `170006` | OTP quá 6 lần/ngày, block đến 24h |
    | `170002` | OTP đã hết hiệu lực (quá 2 phút) |
    | `170003` | OTP không chính xác |
    | `170004` | Sai OTP quá nhiều, block 5 phút |
    | `170005` | Sai OTP quá 6 lần/ngày, block đến 24h |
    | `500027` | challenge_id không hợp lệ hoặc hết hạn |

    ### Repayment
    | Code | Message |
    |------|---------|
    | `100103` | Số tiền vượt quá dư nợ có thể thanh toán |
    | `400000` | partner_reference_id đã được dùng trước đó |
    | `600000` | Thông tin thanh toán không hợp lệ |

    ### Termination
    | Code | Message |
    |------|---------|
    | `100102` | Có số dư thanh toán trước hạn, không thể tất toán |
    | `100104` | Khoản vay đã quá hạn, cần thanh toán toàn bộ dư nợ |
    | `100002` | Ảnh selfie không đúng (facematch thất bại) |

    ### Installment
    | Code | Message |
    |------|---------|
    | `500027` | challenge_id không hợp lệ hoặc chưa xác thực thành công |
    | `500028` | Giao dịch không đủ điều kiện chuyển đổi trả góp |

  version: "1.0.0"
  contact:
    name: Cake Digital Bank Support
    url: https://cake.vn

servers:
  - url: https://gw.cake.vn/ext/loan/{group}/{product_id}
    description: Production
    variables:
      group:
        description: "Nhóm API (ví dụ: cashloan, paylater)"
        default: cashloan
      product_id:
        description: Mã sản phẩm được cấu hình
        default: product_id
  - url: https://gw.stage.cakedigibank.tech/ext/loan/{group}/{product_id}
    description: SIT+UAT
    variables:
      group:
        default: cashloan
      product_id:
        default: product_id

# ─────────────────────────────────────────────
# COMMON COMPONENTS
# ─────────────────────────────────────────────
components:
  parameters:
    PartnerHeader:
      name: partner
      in: header
      required: true
      description: CAKE_PARTNER_ID được cấu hình trong môi trường
      schema:
        type: string
        example: CAKE_PARTNER_ID

    SignatureHeader:
      name: signature
      in: header
      required: true
      description: |
        Chữ ký RSA-SHA256 của request body.
        rawBody = body + partner_key → sha256 → RSA sign PKCS1v15 → base64
      schema:
        type: string

    ContentTypeHeader:
      name: Content-Type
      in: header
      required: true
      schema:
        type: string
        default: application/json; charset=utf-8

  schemas:
    # ── Common Response Wrapper ──
    BaseResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Kết quả xử lý yêu cầu (true/false)
          example: true
        code:
          type: integer
          description: Mã trạng thái hệ thống
          example: 1
        message:
          type: string
          description: Thông báo phản hồi từ hệ thống
          example: Thành công
        response_id:
          type: string
          description: Mã định danh duy nhất của mỗi phản hồi
          example: "849KTQG7SQWLWQW5"
        timestamp:
          type: string
          format: date-time
          description: Thời gian phản hồi (ISO 8601)
          example: "2025-11-03T07:00:00+07:00"

    PartnerCallbackResponse:
      type: object
      required:
        - success
        - code
        - message
      properties:
        success:
          type: boolean
          description: Kết quả xử lý yêu cầu (true/false)
          example: true
        code:
          type: integer
          description: "Mã trạng thái (1 = Thành công; khác 1 = lỗi)"
          example: 1
        message:
          type: string
          description: Thông báo phản hồi
          example: "Thành công"

    # ── Challenge ──
    ChallengeGetOtpRequest:
      type: object
      required:
        - challenge_id
        - phone_number
      properties:
        challenge_id:
          type: string
          description: ID dùng cho API xác thực challenge
          example: "a27f5d0e-8b43-4e3f-9bfa-0c6d7c5b2189"
        phone_number:
          type: string
          description: Số điện thoại KH (bắt đầu bằng số 0)
          example: "0xxxxxxxxx"

    ChallengeGetOtpResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                otp_reference_id:
                  type: string
                  description: Mã tham chiếu OTP do CAKE tạo ra
                  example: "7b9e0d4f-3c4a-4e7c-9b92-92e6d5dcd781"
                next_retry_time:
                  type: string
                  nullable: true
                  format: date-time
                  description: |
                    Thời gian có thể gọi lại get-otp.
                    null nếu không bị block; ISO 8601 nếu đang bị block.
                  example: "2025-11-03T07:00:00+07:00"
                otp_expired_at:
                  type: string
                  nullable: true
                  format: date-time
                  description: Thời gian OTP hết hạn (ISO 8601)
                  example: "2025-11-03T07:02:00+07:00"

    ChallengeVerifyOtpRequest:
      type: object
      required:
        - otp_reference_id
        - challenge_id
        - phone_number
        - otp
      properties:
        otp_reference_id:
          type: string
          description: Mã tham chiếu OTP từ challenge-get-otp
          example: "7b9e0d4f-3c4a-4e7c-9b92-92e6d5dcd781"
        challenge_id:
          type: string
          description: ID dùng cho API xác thực challenge
          example: "a27f5d0e-8b43-4e3f-9bfa-0c6d7c5b2189"
        phone_number:
          type: string
          description: Số điện thoại KH (bắt đầu bằng số 0)
          example: "0xxxxxxxxx"
        otp:
          type: string
          description: Mã OTP người dùng nhập vào
          example: "123456"

    ChallengeVerifyOtpResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                remaining_attempts:
                  type: string
                  nullable: true
                  description: Số lần nhập OTP còn lại (tổng 3 lần/otp, 6 lần/ngày)
                  example: "2"
                next_retry_time:
                  type: string
                  nullable: true
                  format: date-time
                  description: Thời gian có thể gọi lại get-otp
                  example: "2025-11-03T07:00:00+07:00"

    ChallengeFacematchRequest:
      type: object
      required:
        - challenge_id
        - phone_number
        - selfie_image
      properties:
        challenge_id:
          type: string
          description: ID dùng cho API xác thực challenge
          example: "a27f5d0e-8b43-4e3f-9bfa-0c6d7c5b2189"
        phone_number:
          type: string
          description: Số điện thoại KH (bắt đầu bằng số 0)
          example: "0xxxxxxxxx"
        selfie_image:
          type: string
          format: byte
          description: Ảnh selfie của KH (base64 encoded)

    ChallengeFacematchResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              nullable: true
              description: N/A

    # ── Onboarding ──
    DataConfigResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                city:
                  type: array
                  description: Danh sách tỉnh/thành phố
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        description: ID tỉnh/thành (dùng cho city_id / permanent_city_id)
                      name:
                        type: string
                        description: Tên tỉnh/thành (dùng cho city_name / permanent_city_name)
                      dist:
                        type: array
                        description: Danh sách quận/huyện (value=000 nếu mô hình 2 cấp)
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: 'ID quận/huyện. Mô hình 2 cấp: dùng "000"'
                            name:
                              type: string
                              description: 'Tên quận/huyện. Mô hình 2 cấp: gửi literal "Không"'
                            ward:
                              type: array
                              description: Danh sách phường/xã
                              items:
                                type: object
                gender:
                  type: array
                  description: "List of genders: 1=Male, 2=Female"
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Mã giới tính (dùng cho gender ở client-create)
                      name:
                        type: string
                        description: Tên hiển thị
                marital:
                  type: array
                  description: "1=Độc thân, 2=Đã kết hôn, 3=Khác"
                  items:
                    type: object
                occupation:
                  type: array
                  description: "1=Nhân viên văn phòng, 2=Lao động phổ thông, 3=Tự kinh doanh,
                    4=Sinh viên, 5=Không đi làm, 6=Khác"
                  items:
                    type: object
                job_title:
                  type: array
                  description: "1=Công nhân, 2=Nhân viên/Chuyên viên, 3=Quản lý, 4=Tự kinh doanh"
                  items:
                    type: object
                contact_relationship:
                  type: array
                  description: "1=Vợ, 2=Chồng, 3=Cha, 4=Mẹ, 5=Anh/Em trai, 6=Chị/Em gái, 7=Ông,
                    8=Bà, 9=Đồng nghiệp, 10=Bạn bè, 11=Con"
                  items:
                    type: object
                loan_purpose:
                  type: array
                  description: "1=Mua sắm đồ dùng, 2=Chi phí y tế, 3=Du lịch, 6=Tiêu dùng hợp pháp
                    khác, 7=Đóng học phí"
                  items:
                    type: object

    CheckProfileRequest:
      type: object
      required:
        - phone_number
        - partner_reference_id
        - full_name
        - document_id
        - date_of_birth
      properties:
        phone_number:
          type: string
          description: Số điện thoại KH (bắt đầu bằng số 0)
          example: "0xxxxxxxxx"
        partner_reference_id:
          type: string
          description: ID đối tác để định danh request
        full_name:
          type: string
          description: Họ và tên KH (không cần dấu)
          example: "TRAN MINH TIEN"
        document_id:
          type: string
          description: Số GTTT của KH
          example: "xxxxxxxxxxxx"
        date_of_birth:
          type: string
          format: date
          description: Ngày sinh (yyyy-mm-dd)
          example: "1999-12-02"
        metadata:
          type: object
          nullable: true
          description: Dữ liệu bổ sung (nếu có)

    CheckProfileResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                reject_code:
                  type: integer
                  nullable: true
                  description: Mã lý do từ chối hồ sơ
                reject_message:
                  type: string
                  nullable: true
                  description: Thông báo chi tiết tương ứng với reject_code
                challenge_level:
                  type: array
                  description: "1=None, 2=Facematch, 3=SMS OTP, 4=DTN Cake OTP. Sản phẩm này luôn
                    là [4]"
                  items:
                    type: integer
                  example: [ 4 ]
                challenge_id:
                  type: string
                  description: ID dùng cho API xác thực challenge
                  example: "7b9e0d4f-3c4a-4e7c-9b92-92e6d5dcd781"
                is_exists:
                  type: boolean
                  description: |
                    Hồ sơ KH đã tồn tại tại Cake hay chưa.
                    - `true`: KH đã có hồ sơ → client-update chỉ cần gửi ảnh selfie (face-auth), không cần ảnh CCCD/NFC.
                    - `false`: KH mới → client-update cần gửi đầy đủ ảnh CCCD mặt trước, mặt sau và NFC.
                  example: false

    ClientCreateRequest:
      type: object
      required:
        - phone_number
        - full_name
        - date_of_birth
        - gender
        - document_id
        - doc_issue_date
        - doc_issue_place
        - doc_exp_date
        - marital_id
        - nationality
        - permanent_city_id
        - permanent_dist_id
        - permanent_ward_id
        - permanent_address
        - permanent_city_name
        - permanent_dist_name
        - permanent_ward_name
        - city_id
        - dist_id
        - ward_id
        - city_name
        - dist_name
        - ward_name
        - occupation
        - monthly_income
        - contact_name_1
        - contact_number_1
        - contact_relationship_1
        - contact_name_2
        - contact_number_2
        - contact_relationship_2
        - proposed_amount
        - proposed_term
        - loan_insurance
        - loan_purpose
        - product_code
      properties:
        partner_reference_id:
          type: string
          description: ID đối tác để định danh hồ sơ (tạo mới mỗi request)
        phone_number:
          type: string
          description: Số điện thoại KH (bắt đầu bằng số 0)
          example: "0xxxxxxxxx"
        full_name:
          type: string
          description: Họ tên KH
          example: "Trần Minh Tiến"
        date_of_birth:
          type: string
          format: date
          description: Ngày sinh (yyyy-mm-dd)
          example: "1999-12-02"
        gender:
          type: string
          description: "1=Male, 2=Female"
          example: "2"
        email:
          type: string
          format: email
          nullable: true
          description: Email KH (không bắt buộc)
          example: "abc@gmail.com"
        document_id:
          type: string
          description: Số CCCD/CMND
          example: "xxxxxxxxxxxx"
        doc_issue_date:
          type: string
          format: date
          description: Ngày cấp GTTT
          example: "2021-11-01"
        doc_issue_place:
          type: string
          description: Nơi cấp GTTT
          example: "Cục CSQLHC về TTXH"
        doc_exp_date:
          type: string
          format: date
          description: Ngày hết hạn GTTT
          example: "2035-05-20"
        marital_id:
          type: string
          description: "1=Độc thân, 2=Đã kết hôn, 3=Khác"
          example: "1"
        nationality:
          type: string
          description: Quốc tịch
          default: "Việt Nam"
        permanent_city_id:
          type: string
          description: ID Tỉnh/Thành phố thường trú
          example: "79"
        permanent_dist_id:
          type: string
          description: ID Quận/Huyện thường trú (0 nếu mô hình 2 cấp)
          example: "0"
        permanent_ward_id:
          type: string
          description: ID Phường/Xã thường trú
          example: "001"
        permanent_address:
          type: string
          description: Số nhà, tên đường thường trú
          example: "54 Chu Văn An"
        permanent_city_name:
          type: string
          description: Tên Tỉnh/TP thường trú
          example: "Thành phố Hồ Chí Minh"
        permanent_dist_name:
          type: string
