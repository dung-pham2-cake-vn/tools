        order_id:
          type: string
          description: order_id từ API /terminate-request
        payment_amount:
          type: integer
          description: Số tiền thanh toán (VNĐ)
        challenge_id:
          type: string
          description: ID xác thực challenge
          example: "a27f5d0e-8b43-4e3f-9bfa-0c6d7c5b2189"

    TerminateVanRequest:
      type: object
      required:
        - loan_code
        - phone_number
        - partner_reference_id
        - payment_amount
      properties:
        loan_code:
          type: string
          description: Mã khoản vay từ API /loan-register
