openapi: 3.0.3
info:
  title: product_id - DOP Lending APIs
  description: |
    > **⚠️ Lưu ý bản quyền:** Tài liệu này thuộc bản quyền của **Cake by VPBank**.
    > Mọi hình thức sao chép, chỉnh sửa, hoặc phát tán phải được sự đồng ý bằng văn bản của Cake by VPBank.

    API tích hợp giữa đối tác (Partner) và hệ thống Cake Digital Bank theo mô hình **DOP**
    (Digital Onboarding Process).

    ## Cơ chế xác thực (Signature)
    Tất cả request từ Partner gọi Cake đều phải ký signature:
    ```
    rawBody = {{body}} + {{partner_key}}
    hash = sha256(rawBody)
    signature = base64_encode(rsa.SignPKCS1v15(rand.Reader, privKey, crypto.SHA256, hash))
    ```
    Partner cần tạo cặp khóa RSA 1024 bit: private key (PKCS#8) và public key (X.509),
    gửi public key cho Cake.
    Test chữ ký có thể dùng tool online như [https://emn178.github.io/online-tools/rsa/verify](https://emn178.github.io/online-tools/rsa/verify/?input=%7B%22req_id%22%3A%221%22%2C%22action%22%3A1%7DPartner&input_type=utf-8&algorithm=SHA256&public_key=-----BEGIN%20PUBLIC%20KEY-----%0AMIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQC0KTbcJmoAT1g%2FFEp7eWWzuATg%0AK%2F7Go01PKZUaVTsN80JiDdg%2FmgDIcE0D9w5fYsDBN2pgeQ7EW8qqB8wb84qqk7QX%0AzAFfAqGx10X5aRe0WPsL3x7SCnG9QDz%2Fsun7hvrELes2sBw1a63lk3ZHyU9xLAcs%0ASsOFirCfQDlq0sbvNQIDAQAB%0A-----END%20PUBLIC%20KEY-----&signature_input_type=base64&signature=LWRijuKu83sa%2BU2FMe%2BsrtP8ctIaPjNAZ68YBiOiZNhzl%2FBELWztAcnTaOxINjghrfepTRLjhjvQw5mfwZrUHue4hwWDRvCpTMvCSfv513vuKp4kIQFK5EAASMZuhjwTn6mBxeO1i55xWB2wHqXVJxXgFecSok6T8qqJyH4XUzc%3D).
    Other tools: [8gwifi RSA](https://8gwifi.org/RSAFunctionality?rsasignverifyfunctions=rsasignverifyfunctions&keysize=1024) (chọn `RSA Signature Algorithms: SHA256withRSA`).

    ## Môi trường

    ### SIT+UAT Environment

    | Key | Value | Description |
    |-----|-------|-------------|
    | CAKE_API_URL | `https://gw.stage.cakedigibank.tech/ext/loan/{group}/{product_id}/` | |
    | CAKE_PARTNER_ID | *(Cake cấp)* | Gắn ở header khi gọi API Cake |
    | CAKE_PARTNER_KEY | *(Cake cấp)* | Gắn sau body khi ký API Cake |
    | CAKE_IP_ADDRESS | `35.197.157.155/32`<br>`34.87.136.147/32`<br>`35.240.241.82/32`<br>`34.142.212.108/32`<br>`35.198.211.12/32`<br>`34.143.164.202/32`<br>`34.124.200.2/32` | Partner thêm các IP này vào Whitelist |
    | PARTNER_API_URL | *(Partner cấp)* | |
    | PARTNER_IP_ADDRESS | `34.87.136.147 (Cake auto)` | Cake thêm các IP này vào Whitelist |
    | PARTNER_REDIRECT_URL | *(Partner cấp)* | Cake whitelist các redirect_url này |

    ### PROD Environment

    | Key | Value | Description |
    |-----|-------|-------------|
    | CAKE_API_URL | `https://gw.cake.vn/ext/loan/{group}/{product_id}/` | |
    | CAKE_PARTNER_ID | *(Cake cấp)* | Gắn ở header khi gọi API Cake |
    | CAKE_PARTNER_KEY | *(Cake cấp)* | Gắn sau body khi ký api partner |
    | CAKE_IP_ADDRESS | `34.87.56.148/32`<br>`35.240.146.157/32`<br>`34.87.175.195/32`<br>`34.142.177.122/32`<br>`34.87.39.41/32`<br>`34.143.164.31/32`<br>`34.143.174.79/32` | Partner thêm các IP này vào Whitelist |
    | PARTNER_API_URL | *(Partner cấp)* | |
    | PARTNER_IP_ADDRESS | *(Partner cấp)* | Cake thêm các IP này vào Whitelist |
    | PARTNER_REDIRECT_URL | *(Partner cấp)* | Cake whitelist các redirect_url này |

    ## Định nghĩa Status

    ### partner-update-status (Cake callback → Partner)
    | Status | Description |
    |--------|-------------|
    | `LOAN_APPROVE` | Hồ sơ đăng ký khoản vay đã được phê duyệt |
    | `LOAN_REJECT` | Hồ sơ đăng ký khoản vay bị từ chối |
    | `LOAN_EXPIRED` | Hồ sơ đăng ký khoản vay bị hết hạn (7 ngày) |
    | `LOAN_CANCEL` | Hồ sơ đăng ký khoản vay bị hủy |
    | `LOAN_ACTIVE` | Khoản vay của KH đã được giải ngân thành công |
    | `LOAN_CLOSE` | Khoản vay đã tất toán |

    ### get-loan-detail (loan_account_status)
    | Status | Description |
    |--------|-------------|
    | `LOAN_APPROVE` | Hồ sơ đăng ký khoản vay đã được phê duyệt |
    | `LOAN_REJECT` | Hồ sơ đăng ký khoản vay bị từ chối |
    | `LOAN_EXPIRED` | Hồ sơ đăng ký khoản vay bị hết hạn (7 ngày) |
    | `LOAN_CANCEL` | Hồ sơ đăng ký khoản vay bị hủy |
    | `LOAN_SIGNED` | Khoản vay đã được ký, đang giải ngân |
    | `LOAN_ACTIVE` | Khoản vay của KH đã được giải ngân thành công |
    | `LOAN_CLOSE` | Khoản vay đã tất toán |

    ## Error Codes

    ### General
    | Code | Message |
    |------|---------|
    | `1` | Thành công |
    | `2` | Deadline exceeded |
    | `500` | Internal server error |
    | `501` | Not implement |
    | `502` | An invalid response was received from the upstream server |
    | `900000` | Có lỗi xảy ra, vui lòng thử lại sau! / Trường dữ liệu không hợp lệ: {{field_name}} - required |
    | `900001` | Hệ thống đang bảo trì |
    | `900002` | Request is processing |
    | `200000` | Chữ ký không hợp lệ |
    | `200001` | Mã đối tác không hợp lệ |
    | `200003` | Request ID không hợp lệ (NID hoặc Phone không khớp) |
    | `400001` | Không có thông tin khoản vay (Sản phẩm không tồn tại loan_code này) |
    | `100100` | COB Time - Yêu cầu thanh toán không được thực hiện |
    | `500013` | Trường dữ liệu không hợp lệ: {{field_name}} - {{field_type}} |
    | `500014` | Trạng thái khoản vay không hợp lệ (đang không hỗ trợ) |

    ### Repayments
    | Code | Message |
    |------|---------|
    | `100103` | Số tiền thanh toán vượt quá dư nợ có thể thanh toán |
    | `10003` | Yêu cầu hiện tại khác với yêu cầu trước đó (order_id đã được confirm trước đó) |

    ### Terminates
    | Code | Message |
    |------|---------|
    | `100102` | Đang có số dư thanh toán trước hạn, không thể tất toán |
    | `100104` | Khoản vay đã đến hạn thanh toán, cần thanh toán toàn bộ dư nợ để hủy hợp đồng |
    | `600000` | Thông tin thanh toán không hợp lệ (bộ dữ liệu thanh toán không khớp) |
    | `100002` | Hình selfie không đúng (facematch không thành công) |

  version: "1.0.0"
  contact:
    name: Cake Digital Bank Support
    url: https://cake.vn

servers:
  - url: https://gw.stage.cakedigibank.tech/ext/loan/{group}/{product_id}
    description: SIT+UAT
    variables:
      group:
        default: cashloan
      product_id:
        default: product_id
  - url: https://gw.cake.vn/ext/loan/{group}/{product_id}
    description: Production
    variables:
      group:
        description: "Nhóm API (ví dụ: cashloan, paylater)"
        default: cashloan
      product_id:
        description: Mã sản phẩm được cấu hình
        default: product_id

# ─────────────────────────────────────────────
# COMMON COMPONENTS
# ─────────────────────────────────────────────
components:
  parameters:
    PartnerHeader:
      name: partner
      in: header
      required: true
      description: CAKE_PARTNER_ID được cấu hình trong môi trường
      schema:
        type: string
        example: CAKE_PARTNER_ID

    SignatureHeader:
      name: signature
      in: header
      required: true
      description: |
        Chữ ký RSA-SHA256 của request body.
        rawBody = body + partner_key → sha256 → RSA sign PKCS1v15 → base64
      schema:
        type: string

    ContentTypeHeader:
      name: Content-Type
      in: header
      required: true
      schema:
        type: string
        default: application/json; charset=utf-8

  schemas:
    # ── Common Response Wrapper ──
    BaseResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Kết quả xử lý yêu cầu (true/false)
          example: true
        code:
          type: integer
          description: Mã trạng thái hệ thống
          example: 1
        message:
          type: string
          description: Thông báo phản hồi từ hệ thống
          example: Thành công
        response_id:
          type: string
          description: Mã định danh duy nhất của mỗi phản hồi
          example: "849KTQG7SQWLWQW5"
        timestamp:
          type: string
          format: date-time
          description: Thời gian phản hồi (ISO 8601)
          example: "2025-11-03T07:00:00+07:00"

    # ── generate-webview/onboarding ──
    GenerateWebviewOnboardingRequest:
      type: object
      required:
        - partner_reference_id
        - phone_number
        - full_name
        - date_of_birth
        - document_id
        - redirect_url
        - metadata
      properties:
        partner_reference_id:
          type: string
          description: ID của đối tác để định danh hồ sơ
          example: "bf133c7c-8e10-45a2-b9d2-4d04a352917a"
        phone_number:
          type: string
          description: SĐT của KH (định dạng bắt đầu bằng số 0)
          example: "0xxxxxxxxx"
        full_name:
          type: string
          description: Họ và tên KH, không cần có dấu
          example: "TRAN MINH TIEN"
        date_of_birth:
          type: string
          format: date
          description: Ngày sinh của KH (yyyy-mm-dd)
          example: "1999-12-02"
        document_id:
          type: string
          description: Số GTTT của KH
          example: "xxxxxxxxxxxx"
        redirect_url:
          type: string
          description: URL để đóng webview DOP, mặc định điền https://cake.vn/deeplink?home=app
          example: "https://cake.vn/deeplink?home=app"
        metadata:
          $ref: "#/components/schemas/OnboardingMetadata"
        nfc_data:
          $ref: "#/components/schemas/NfcData"

    OnboardingMetadata:
      type: object
      description: Dữ liệu bổ sung (nếu có)
      required:
        - partner_score
        - partner_onboarding_channel
      properties:
        partner_score:
          type: string
          description: Dạng range, lấy chặn dưới
          example: "800-800"
        partner_onboarding_channel:
          type: string
          description: Kênh KH truy cập, truyền mặc định `APP_DEFAULT`
          default: "APP_DEFAULT"
          example: "APP_DEFAULT"

    NfcData:
      type: object
      description: Dữ liệu NFC raw
      required:
        - sod
        - dg1
        - dg2
        - dg13
        - dg14
        - dg15
        - com
      properties:
        sod:
          type: string
          description: The raw NFC data
        dg1:
          type: string
          description: The raw NFC data
        dg2:
          type: string
          description: The raw NFC data
        dg13:
          type: string
          description: The raw NFC data
        dg14:
          type: string
          description: The raw NFC data
        dg15:
          type: string
          description: The raw NFC data
        com:
          type: string
          description: The raw NFC data

    GenerateWebviewResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                webview_url:
                  type: string
                  description: Webview DOP URL
                  example: "https://dop.cake.vn/...?token=..."

    # ── generate-webview/loan-detail ──
    GenerateWebviewLoanDetailRequest:
      type: object
      required:
        - loan_code
        - phone_number
        - redirect_url
      properties:
        loan_code:
          type: string
          description: Mã khoản vay, từ API /loan-register
          example: "u8123123Sjsdb"
        phone_number:
          type: string
          description: SĐT của KH (định dạng bắt đầu bằng số 0)
          example: "0xxxxxxxxx"
        redirect_url:
          type: string
          description: URL để đóng webview DOP, mặc định https://cake.vn/deeplink?home=app
          example: "https://cake.vn/deeplink?home=app"

    # ── get-loan-detail ──
    GetLoanDetailRequest:
      type: object
      required:
        - loan_code
        - phone_number
      properties:
        loan_code:
          type: string
          description: Mã khoản vay từ API /loan-register
          example: "u8123123Sjsdb"
        phone_number:
          type: string
          example: "0xxxxxxxxx"

    GetLoanDetailResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                loan_account_status:
                  type: string
                  enum:
                    - LOAN_UNKNOWN
                    - LOAN_INIT
                    - LOAN_REVIEWING
                    - LOAN_REJECT
                    - LOAN_APPROVE
                    - LOAN_EXPIRED
                    - LOAN_CANCEL
                    - LOAN_SIGNED
                    - LOAN_ACTIVE
                    - LOAN_LOCK
                    - LOAN_LOCKED
                    - LOAN_CLOSE
                  description: Trạng thái tài khoản vay
                contract_id:
                  type: string
                  description: Mã hợp đồng (dùng cho nhắc nợ, đối soát)
                  example: "1234567890"
                loan_alias:
                  type: string
                  description: Mã thanh toán
                  example: "G4JH5R"
                contract_url:
                  type: string
                  description: URL hợp đồng đã ký song phương (hết hạn trong 1h)
                  example: "https://storage.googleapis.com/..."
                full_name:
                  type: string
                  example: "Nguyễn Hoàng Sơn"
                document_id:
                  type: string
                  example: "xxxxxxxxxxxx"
                approved_amount:
                  type: string
                  description: Số tiền được phê duyệt (VNĐ)
                  example: "12000000"
                approved_term:
                  type: string
                  description: Thời hạn vay phê duyệt
                  example: "12"
                loan_insurance:
                  type: string
                  description: "[CL/PD] Số tiền bảo hiểm"
                  example: "840000"
                disburse_amount:
                  type: string
                  description: Số tiền đã giải ngân
                  example: "12840000"
                disburse_date:
                  type: string
                  format: date
                  description: Ngày giải ngân (yyyy-mm-dd)
                  example: "2025-06-03"
                interest_rate:
                  type: string
                  description: Lãi suất
                  example: "43"
                principle_balance:
                  type: string
                  description: Dư nợ gốc khả dụng còn lại
                  example: "12640000"
                interest_balance:
                  type: string
                  description: Dư nợ lãi phát sinh
                  example: "197494"
                penalty_principal_balance:
                  type: string
                  description: "[CL/PD] Lãi phạt gốc quá hạn"
                  example: "2494265"
                penalty_interest_balance:
                  type: string
                  description: "[CL/PD] Lãi phạt lãi quá hạn"
                  example: "0"
                payment_period:
                  type: string
                  description: "[CL/PL] Kỳ thanh toán số"
                  example: "12"
                due_date:
                  type: string
                  format: date
                  description: Ngày đến hạn thanh toán gần nhất, đã bao gồm holiday nếu có
                  example: "2025-06-27"
                day_arrears:
                  type: string
                  description: Số ngày quá hạn
                  example: "191"
                predue_payment_amount:
                  type: string
                  description: "[CL] Số tiền KH có thể thanh toán sớm"
                  example: "0"
                due_payment_amount:
                  type: string
                  description: "[CL] Số tiền KH buộc phải thanh toán"
                  example: "15331759"
                period_payment_amount:
                  type: string
                  description: "[PL] Số tiền KH phải thanh toán trong kỳ"
                  example: "15331759"
                total_payment_amount:
                  type: string
                  description: Tổng số tiền KH có thể thanh toán
                  example: "15331759"
                paid_amount:
                  type: string
                  description: "[CL/PD] Số tiền KH đã thanh toán"
                  example: "200000"
                prepayment_amount:
                  type: string
                  description: "[CL/PL] Số tiền KH đã thanh toán trước trong kỳ"
                  example: "0"

    # ── disburse-update ──
    DisburseUpdateRequest:
      type: object
      required:
        - loan_code
        - phone_number
        - partner_disburse_status
      properties:
        loan_code:
          type: string
          example: "u8123123Sjsdb"
        phone_number:
          type: string
          example: "0xxxxxxxxx"
        partner_disburse_status:
          type: integer
          description: "Trạng thái giải ngân: 1=Thành công, 2=Thất bại"
          enum: [ 1, 2 ]
          example: 1

    # ── repayment-request ──
    RepaymentRequestBody:
      type: object
      required:
        - loan_code
        - phone_number
        - partner_reference_id
        - payment_amount
      properties:
        loan_code:
          type: string
          example: "u8123123Sjsdb"
        phone_number:
          type: string
          example: "0xxxxxxxxx"
        partner_reference_id:
          type: string
          description: ID tạo mới mỗi request (idempotency key)
        payment_amount:
          type: integer
          description: Số tiền thanh toán (VNĐ)
          example: 5000000

    RepaymentRequestResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                order_id:
                  type: string
                  description: Mã tham chiếu giao dịch do CAKE tạo ra

    # ── repayment-confirm ──
    RepaymentConfirmRequest:
      type: object
      required:
        - loan_code
        - phone_number
        - partner_reference_id
        - order_id
        - payment_amount
      properties:
        loan_code:
          type: string
          example: "u8123123Sjsdb"
        phone_number:
          type: string
          example: "0xxxxxxxxx"
        partner_reference_id:
          type: string
          description: partner_reference_id từ API /repayment-request
        order_id:
          type: string
          description: order_id từ API /repayment-request
        payment_amount:
          type: integer
          example: 5000000

    # ── repayment-status ──
    RepaymentStatusRequest:
      type: object
      required:
        - loan_code
        - phone_number
        - order_id
      properties:
        loan_code:
          type: string
          example: "u8123123Sjsdb"
        phone_number:
          type: string
          example: "0xxxxxxxxx"
        order_id:
          type: string
          description: order_id từ API /repayment-request

    RepaymentStatusResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - INIT
                    - IN_PROCESS
                    - HOLD
                    - SUCCESS
                    - FAILED
                  description: |
                    - INIT: Chưa nhận tiền từ KH
                    - IN_PROCESS: Đã nhận tiền, đang gạch nợ
                    - HOLD: Nhận tiền nhưng lỗi gạch nợ, cần đối soát thủ công
                    - SUCCESS: Đã gạch nợ thành công
                    - FAILED: Chuyển khoản thất bại hoặc giao dịch hết hạn

    # ── partner-update-status (Cake → Partner) ──
    PartnerUpdateStatusRequest:
      type: object
      required:
        - request_id
        - partner_reference_id
        - status
      properties:
        request_id:
          type: string
          description: Mã định danh cho request
          example: "req-0001"
        partner_reference_id:
          type: string
          description: ID đối tác truyền ở API /generate-webview/onboarding
          example: "uuid-1234"
        loan_code:
          type: string
          description: Mã khoản vay, không truyền khi LOAN_REJECT
          example: "u8123123Sjsdb"
        status:
          type: string
          description: |
            Trạng thái hồ sơ khoản vay Cake:
            - LOAN_APPROVE: Hồ sơ đăng ký khoản vay đã được phê duyệt
            - LOAN_REJECT: Hồ sơ đăng ký khoản vay bị từ chối
            - LOAN_EXPIRED: Hồ sơ đăng ký khoản vay bị hết hạn (7 ngày)
            - LOAN_SIGNED: Hồ sơ đã ký hợp đồng vay
            - LOAN_CANCEL: Hồ sơ đăng ký khoản vay bị hủy
            - LOAN_ACTIVE: Hồ sơ đã giải ngân thành công
            - LOAN_CLOSE: Khoản vay đã tất toán
          enum:
            - LOAN_APPROVE
            - LOAN_REJECT
            - LOAN_EXPIRED
            - LOAN_SIGNED
            - LOAN_CANCEL
            - LOAN_ACTIVE
            - LOAN_CLOSE
          example: "LOAN_APPROVE"

    # ── partner-disburse-request (Cake → Partner) ──
    PartnerDisburseRequest:
      type: object
      required:
        - request_id
        - loan_code
      properties:
        request_id:
          type: string
          description: Mã định danh cho request
          example: "req-0001"
        loan_code:
          type: string
          description: Loan code của Cake
          example: "u8123123Sjsdb"

    # ── Partner callback response (code/message) ──
    PartnerCallbackResponse:
      type: object
      required:
        - success
        - code
        - message
      properties:
        success:
          type: boolean
          description: Kết quả xử lý yêu cầu (true/false)
          example: true
        code:
          type: integer
          description: "Mã trạng thái (1 = Thành công; khác 1 = lỗi)"
          example: 1
        message:
          type: string
          description: Thông báo phản hồi
          example: "Thành công"

# ─────────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────────
paths:
  # ════════════════════
  # ONBOARDING (Partner → Cake)
  # ════════════════════
  /generate-webview/onboarding:
    post:
      tags: [ Onboarding ]
      summary: Khởi tạo token & webview cho DOP onboarding
      description: |
        Khởi tạo token cho DOP. Response trả về `webview_url`
        để Partner hiển thị webview onboarding của Cake cho KH.
      operationId: generateWebviewOnboarding
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateWebviewOnboardingRequest"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateWebviewResponse"

  /generate-webview/loan-detail:
    post:
      tags: [ Onboarding ]
      summary: Khởi tạo token & webview cho màn hình chi tiết khoản vay
      description: Khởi tạo token cho Webview loan detail. Response `webview_url`.
      operationId: generateWebviewLoanDetail
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateWebviewLoanDetailRequest"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateWebviewResponse"

  # ════════════════════
  # LOAN INFO (Partner → Cake)
  # ════════════════════
  /disburse-update:
    post:
      tags: [ Loan Info ]
      summary: Partner cập nhật trạng thái giải ngân sang Cake
      description: |
        Partner cập nhật kết quả giải ngân sang Cake sau khi nhận
        `partner-disburse-request`.
      operationId: disburseUpdate
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisburseUpdateRequest"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"

  /get-loan-detail:
    post:
      tags: [ Loan Info ]
      summary: Truy vấn thông tin chi tiết khoản vay
      operationId: getLoanDetail
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetLoanDetailRequest"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetLoanDetailResponse"

  # ════════════════════
  # REPAYMENT (Partner → Cake)
  # ════════════════════
  /repayment-request:
    post:
      tags: [ Repayment ]
      summary: Tạo yêu cầu thanh toán khoản vay
      description: |
        Tạo yêu cầu thanh toán. partner_reference_id phải là duy nhất mỗi request.
        Không thể thực hiện trong giờ COB.
      operationId: repaymentRequest
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepaymentRequestBody"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepaymentRequestResponse"

  /repayment-confirm:
    post:
      tags: [ Repayment ]
      summary: Xác nhận yêu cầu thanh toán
      operationId: repaymentConfirm
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepaymentConfirmRequest"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"

  /repayment-status:
    post:
      tags: [ Repayment ]
      summary: Kiểm tra trạng thái thanh toán
      operationId: repaymentStatus
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepaymentStatusRequest"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepaymentStatusResponse"

  # ════════════════════
  # PARTNER CALLBACKS (Cake → Partner)
  # ════════════════════
  /partner-update-status:
    post:
      tags: [ Partner Callbacks ]
      summary: Cake cập nhật trạng thái hồ sơ sang Partner
      description: |
        **Chiều: Cake → Partner**
        Cake chủ động gọi API này trên hệ thống đối tác để thông báo thay đổi trạng thái hồ sơ.
        Partner cần expose endpoint này, yêu cầu path là */partner-update-status.
      operationId: partnerUpdateStatus
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerUpdateStatusRequest"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerCallbackResponse"

  /partner-disburse-request:
    post:
      tags: [ Partner Callbacks ]
      summary: Cake gửi yêu cầu giải ngân sang Partner
      description: |
        **Chiều: Cake → Partner**
        Cake gửi yêu cầu giải ngân vào ví của KH tới đối tác.
        Partner thực hiện giải ngân và gọi lại `/disburse-update` để xác nhận kết quả.
      operationId: partnerDisburseRequest
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerDisburseRequest"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerCallbackResponse"

# ─────────────────────────────────────────────
# TAGS
# ─────────────────────────────────────────────
tags:
  - name: Onboarding
    description: |
      Luồng onboarding qua DOP webview:
      generate-webview/onboarding → (KH onboarding trong webview Cake)
  - name: Loan Info
    description: |
      Thông tin & giải ngân khoản vay:
      disburse-update, get-loan-detail, generate-webview/loan-detail
  - name: Repayment
    description: Thanh toán kỳ hạn khoản vay (request → confirm → status)
  - name: Partner Callbacks
    description: |
      API Cake gọi sang Partner (webhook/callback). Partner phải expose các endpoint này.
      Xác thực ngược chiều (Cake ký, Partner verify).

# ─────────────────────────────────────────────
# SEQUENCE DIAGRAMS - API FLOWS (x-extension)
# ─────────────────────────────────────────────
x-mermaid-flows:

  onboarding: |
    sequenceDiagram
      autonumber
      participant Cl as Client
      participant P as Partner
      participant C as Cake

      Note over Cl,C: ONBOARDING
      Cl->>P: Access entry point
      P->>C: generate-webview/onboarding
      C-->>P: Response webview_url
      P-->>Cl: Display Cake DOP webview cho customer
      Cl->>C: Submit loan application (trong webview)

      Note over C,P: Cake callback cập nhật trạng thái
      C->>P: partner-update-status
      P-->>C: Response (code, message)

      Cl->>C: Sign application
      Note over C: Create-loan

      Note over C,P: GIẢI NGÂN
      C->>P: partner-disburse-request
      Note over P: Disburse vào ví KH
      P->>C: disburse-update
      C->>P: partner-update-status (LOAN_ACTIVE)
      P-->>C: Response

  loan_info: |
    sequenceDiagram
      autonumber
      participant Cl as Client
      participant P as Partner
      participant C as Cake

      Note over Cl,C: LOAN INFO
      Cl->>P: View loan info
      P->>C: get-loan-detail(loan_code)
      C-->>P: Response loan information
      P-->>Cl: Show loan information

  repayment: |
    sequenceDiagram
      autonumber
      participant Cl as Client
      participant P as Partner
      participant C as Cake

      Note over Cl,C: REPAYMENT
      Cl->>P: Repayment
      P->>C: repayment-request(loan_code, partner_reference_id, payment_amount)
      C-->>P: Response order_id, challenge_level
      P->>C: repayment-confirm(order_id, payment_amount, otp?)
      C-->>P: Response
      P->>C: repayment-status(loan_code, order_id)
      C-->>P: Response status
      P-->>Cl: Show status repayment
