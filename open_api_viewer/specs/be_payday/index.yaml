  # ════════════════════
  /get-loan-detail:
    post:
      tags: [ Loan Info ]
      summary: Truy vấn thông tin chi tiết khoản vay
      description: |
        ## Error Codes

        | Code | Message | Mô tả |
        |------|---------|-------|
        | `900000` | Trường dữ liệu không hợp lệ: {{field_name}} - required | Truyền thiếu field required |
        | `500013` | Trường dữ liệu không hợp lệ: {{field_name}} - {{field_type}} | Truyền field sai định dạng hoặc không thuộc list được phép truyền |
        | `400001` | Không có thông tin khoản vay | Sản phẩm không tồn tại loan_code này |
      operationId: getLoanDetail
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
