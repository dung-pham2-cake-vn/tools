# ─────────────────────────────────────────────
# COMMON COMPONENTS
# ─────────────────────────────────────────────
components:
  parameters:
    PartnerHeader:
      name: partner
      in: header
      required: true
      description: CAKE_PARTNER_ID được cấu hình trong môi trường
      schema:
        type: string
        example: CAKE_PARTNER_ID

    SignatureHeader:
      name: signature
      in: header
      required: true
      description: |
        Chữ ký RSA-SHA256 của request body.
        rawBody = body + partner_key → sha256 → RSA sign PKCS1v15 → base64
      schema:
        type: string

    ContentTypeHeader:
      name: Content-Type
      in: header
      required: true
      description: application/json; charset=utf-8
      schema:
        type: string
        default: application/json; charset=utf-8

  schemas:
    # ── Common Response Wrapper ──
    BaseResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Kết quả xử lý yêu cầu (true/false)
          example: true
        code:
          type: integer
          description: Mã trạng thái hệ thống
          example: 1
        message:
          type: string
          description: Thông báo phản hồi từ hệ thống
          example: Thành công
        response_id:
          type: string
          description: Mã định danh duy nhất của mỗi phản hồi
          example: "849KTQG7SQWLWQW5"
        timestamp:
          type: string
          format: date-time
          description: Thời gian phản hồi (ISO 8601)
          example: "2025-11-03T07:00:00+07:00"

    # ── generate-webview/onboarding ──
    GenerateWebviewOnboardingRequest:
      type: object
      required:
        - partner_reference_id
        - phone_number
      properties:
        partner_reference_id:
          type: string
          description: ID của đối tác để định danh hồ sơ
          example: "bf133c7c-8e10-45a2-b9d2-4d04a352917a"
        phone_number:
          type: string
          description: SĐT của KH (định dạng bắt đầu bằng số 0)
          example: "0xxxxxxxxx"

    GenerateWebviewResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                webview_url:
                  type: string
                  description: Webview DOP URL, thời gian hết hạn trong 30 phút
                  example: "https://dop.cake.vn/...?token=..."

    # ── get-loan-detail ──
    GetLoanDetailRequest:
      type: object
      required:
        - loan_code
        - phone_number
      properties:
        loan_code:
          type: string
          description: Mã khoản vay, partner nhận từ API callback /partner-update-status
          example: "u8123123Sjsdb"
        phone_number:
          type: string
          description: SĐT của KH (định dạng bắt đầu bằng số 0)
          example: "0xxxxxxxxx"

    GetLoanDetailResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                loan_account_status:
                  type: string
                  description: |
                    Trạng thái tài khoản vay:
                    - LOAN_UNKNOWN: Hồ sơ KH có trạng thái không xác định
                    - LOAN_APPROVE: Hồ sơ vay đã được phê duyệt
                    - LOAN_EXPIRED: Hồ sơ vay bị hết hạn (7 ngày)
                    - LOAN_CANCEL: KH hủy hợp đồng vay
                    - LOAN_SIGNED: KH ký hợp đồng vay thành công
                    - LOAN_ACTIVE: Khoản vay đã được giải ngân thành công
                    - LOAN_CLOSE: Khoản vay đã tất toán
                  example: "LOAN_ACTIVE"
                contract_id:
                  type: string
                  description: Mã hợp đồng. Dùng cho luồng nhắc nợ, đối soát
                  example: "1234567890"
                loan_alias:
                  type: string
                  description: Mã thanh toán
                  example: "G4JH5R"
                contract_url:
                  type: string
                  description: Url hợp đồng cuối (đã ký song phương). Link hết hạn trong 1h
                  example: "https://storage.googleapis.com/..."
                full_name:
                  type: string
                  description: Họ và tên KH
                  example: "Nguyễn Hoàng Sơn"
                document_id:
                  type: string
                  description: Số GTTT của KH
                  example: "xxxxxxxxxxxx"
                approved_amount:
                  type: string
                  description: Số tiền được phê duyệt
                  example: "12000000"
                approved_term:
                  type: string
                  description: Thời hạn vay phê duyệt (ngày)
                  example: "30"
                loan_insurance:
                  type: string
                  description: Số tiền bảo hiểm khoản vay
                  example: "840000"
                disburse_amount:
                  type: string
                  description: Số tiền đã giải ngân
                  example: "12840000"
                disburse_date:
                  type: string
                  format: date
                  description: Ngày giải ngân khoản vay (yyyy-mm-dd)
                  example: "2025-06-03"
                interest_rate:
                  type: string
                  description: Lãi suất
                  example: "43"
                principle_balance:
                  type: string
                  description: Dư nợ gốc khả dụng còn lại
                  example: "12640000"
                interest_balance:
                  type: string
                  description: Dư nợ lãi phát sinh (nếu có)
                  example: "197494"
                penalty_principal_balance:
                  type: string
                  description: Lãi phạt gốc quá hạn (nếu có)
                  example: "2494265"
                penalty_interest_balance:
                  type: string
                  description: Lãi phạt lãi quá hạn (nếu có)
                  example: "0"
                due_date:
                  type: string
                  format: date
                  description: Ngày đến hạn thanh toán gần nhất (yyyy-mm-dd), đã bao gồm holiday nếu có
                  example: "2025-06-27"
                day_arrears:
                  type: string
                  description: Số ngày quá hạn (nếu có)
                  example: "191"
                total_payment_amount:
                  type: string
                  description: Tổng tiền KH có thể thanh toán
                  example: "15331759"

    # ── partner-update-status (Cake → Partner) ──
    PartnerUpdateStatusRequest:
      type: object
      required:
        - partner_reference_id
        - loan_code
        - status
      properties:
        partner_reference_id:
          type: string
          description: ID của đối tác truyền khi gen link, gắn theo khoản vay khi được APPROVE
          example: "bf133c7c-8e10-45a2-b9d2-4d04a352917a"
        loan_code:
          type: string
          description: Mã khoản vay
          example: "u8123123Sjsdb"
        status:
          type: string
          description: |
            Trạng thái hồ sơ khoản vay Cake:
            - LOAN_APPROVE: Hồ sơ đăng ký khoản vay đã được phê duyệt
            - LOAN_REJECT: Hồ sơ đăng ký khoản vay bị từ chối
            - LOAN_EXPIRED: Hồ sơ đăng ký khoản vay bị hết hạn (7 ngày)
            - LOAN_SIGNED: Hồ sơ đã ký hợp đồng vay
            - LOAN_CANCEL: Hồ sơ đăng ký khoản vay bị hủy
            - LOAN_ACTIVE: Hồ sơ đã giải ngân thành công
            - LOAN_CLOSE: Khoản vay đã tất toán
          example: "LOAN_APPROVE"

    # ── Partner callback response (code/message) ──
    PartnerCallbackResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: "Mã trạng thái (1 = Thành công; khác 1 = lỗi)"
          example: 1
        message:
          type: string
          description: Thông báo phản hồi
          example: "Thành công"

# ─────────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────────
paths:
  # ════════════════════
  # ONBOARDING (Partner → Cake)
  # ════════════════════
  /generate-webview/onboarding:
    post:
      tags: [ Onboarding ]
      summary: Khởi tạo token & webview cho DOP onboarding
      description: |
        Khởi tạo token cho DOP. Response trả về `webview_url` (hết hạn trong 30 phút)
        để Partner hiển thị webview onboarding của Cake cho KH.

        ## Error Codes

        ### Validation Errors
        | Code | Message | Mô tả |
        |------|---------|-------|
        | `900000` | Trường dữ liệu không hợp lệ: {{field_name}} - required | Truyền thiếu field required |
        | `500013` | Trường dữ liệu không hợp lệ: {{field_name}} - {{field_type}} | Truyền field sai định dạng hoặc không thuộc list được phép truyền |

