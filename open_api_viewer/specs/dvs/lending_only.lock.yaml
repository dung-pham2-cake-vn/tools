        default: product_id
  - url: https://gw.cake.vn/ext/loan/{group}/{product_id}
    description: Production
    variables:
      group:
        description: "Nhóm API (ví dụ: cashloan, paylater)"
        default: group
      product_id:
        description: Mã sản phẩm được cấu hình
        default: product_id

# ─────────────────────────────────────────────
# COMMON COMPONENTS
# ─────────────────────────────────────────────
components:
  parameters:
    PartnerHeader:
      name: partner
      in: header
      required: true
      description: CAKE_PARTNER_ID được cấu hình trong môi trường
      schema:
        type: string
        example: CAKE_PARTNER_ID

    SignatureHeader:
      name: signature
      in: header
      required: true
      description: |
        Chữ ký RSA-SHA256 của request body.
        rawBody = body + partner_key → sha256 → RSA sign PKCS1v15 → base64
      schema:
        type: string

    ContentTypeHeader:
      name: Content-Type
      in: header
      required: true
      schema:
        type: string
        default: application/json; charset=utf-8

  schemas:
    # ── Common Response Wrapper ──
    BaseResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Kết quả xử lý yêu cầu (true/false)
          example: true
        code:
          type: integer
          description: Mã trạng thái hệ thống
          example: 1
        message:
          type: string
          description: Thông báo phản hồi từ hệ thống
          example: Thành công
        response_id:
          type: string
          description: Mã định danh duy nhất của mỗi phản hồi
          example: "849KTQG7SQWLWQW5"
        timestamp:
          type: string
          format: date-time
          description: Thời gian phản hồi (ISO 8601)
          example: "2025-11-03T07:00:00+07:00"

    # ── get-loan-detail ──
    GetLoanDetailRequest:
      type: object
      required:
        - document_id
        - loan_code
      properties:
        document_id:
          type: string
          description: CCCD của KH
          example: "xxxxxxxxxxxx"
        loan_code:
          type: string
          description: Mã khoản vay do Cake cấp, KH lấy trên app Partner
          example: "u8123123Sjsdb"

    GetLoanDetailResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                due_date:
                  type: string
                  format: date
                  description: Ngày đến hạn thanh toán gần nhất (yyyy-mm-dd)
                  example: "2026-06-27"
                monthly_payment_amount:
                  type: string
                  description: Số tiền KH có thể thanh toán sớm
                  example: "0"
                overdue_payment_amount:
                  type: string
                  description: Số tiền KH buộc phải thanh toán
                  example: "15331759"
                total_payment_amount:
                  type: string
                  description: Tổng số tiền KH có thể thanh toán (monthly + overdue)
                  example: "15331759"

    # ── repayment-request ──
    RepaymentRequestBody:
      type: object
      required:
        - document_id
        - loan_code
        - partner_reference_id
        - payment_amount
      properties:
        document_id:
          type: string
          description: CCCD của KH
          example: "xxxxxxxxxxxx"
        loan_code:
          type: string
          description: Mã khoản vay do Cake cấp, KH lấy trên app Partner
          example: "u8123123Sjsdb"
        partner_reference_id:
          type: string
          description: ID tham chiếu của giao dịch, tạo mới mỗi request (idempotency key)
          example: "PRF20260504000001"
        payment_amount:
          type: integer
          description: Số tiền KH thanh toán qua Partner (VNĐ)
          example: 5000000

    RepaymentRequestResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                order_id:
                  type: string
                  description: Mã tham chiếu giao dịch do Cake tạo ra
                  example: "ORD20260504000001"

    # ── repayment-confirm ──
    RepaymentConfirmRequest:
      type: object
      required:
        - partner_reference_id
        - order_id
        - payment_amount
      properties:
        partner_reference_id:
          type: string
          description: partner_reference_id từ API /repayment-request
          example: "PRF20260504000001"
        order_id:
          type: string
          description: order_id từ API /repayment-request
          example: "ORD20260504000001"
        payment_amount:
          type: integer
          description: Số tiền KH thanh toán qua Partner (VNĐ), phải khớp với /repayment-request
          example: 5000000

tags:
  - name: Loan Info
    description: Tra cứu thông tin khoản vay để thanh toán (get-loan-detail)
  - name: Repayment
    description: Thanh toán khoản vay (repayment-request → repayment-confirm)

# ─────────────────────────────────────────────
# SEQUENCE DIAGRAMS - API FLOWS (x-extension)
# ─────────────────────────────────────────────
x-mermaid-flows:

  repayment: |
    sequenceDiagram
      autonumber
      participant Cl as Client
      participant P as Partner
      participant C as Cake

      Note over Cl,C: XEM KHOẢN VAY
      Cl->>P: Nhập loan_code
      P->>C: get-loan-detail(document_id, loan_code)
      C-->>P: due_date, monthly/overdue/total_payment_amount
      P-->>Cl: Hiển thị thông tin khoản vay

      Note over Cl,C: THANH TOÁN
      Cl->>P: Nhập số tiền payment_amount
      P->>C: repayment-request(document_id, loan_code, partner_reference_id, payment_amount)
      C-->>P: order_id
      P->>C: repayment-confirm(partner_reference_id, order_id, payment_amount)
      C-->>P: success, code, message
      P-->>Cl: Hiển thị kết quả thanh toán

paths:
  # ════════════════════
  # LOAN INFO
  # ════════════════════
  /get-loan-detail:
    post:
      tags: [ Loan Info ]
      summary: Tra cứu thông tin khoản vay
      description: |
        Trả về kỳ hạn và số tiền KH có thể / phải thanh toán.
        Khoản vay được định danh bằng `document_id` + `loan_code`; hai giá trị phải khớp nhau,
        nếu không trả `400001`.
      operationId: getLoanDetail
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetLoanDetailRequest"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetLoanDetailResponse"

  # ════════════════════
  # REPAYMENT
  # ════════════════════
  /repayment-request:
    post:
      tags: [ Repayment ]
      summary: Tạo yêu cầu thanh toán khoản vay
      description: |
        Tạo yêu cầu thanh toán, trả về `order_id` để confirm.
        - Khoản vay định danh bằng `document_id` + `loan_code`; hai giá trị phải khớp nhau,
          nếu không trả `400001`.
        - `partner_reference_id` phải là duy nhất mỗi request; gọi lại giá trị cũ trả `400000`.
        - `payment_amount` phải > 0 (`600000`) và không vượt dư nợ có thể thanh toán (`100103`).
        - Không thực hiện được trong giờ COB 23:50–04:00 (`100100`).
      operationId: repaymentRequest
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepaymentRequestBody"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepaymentRequestResponse"

  /repayment-confirm:
    post:
      tags: [ Repayment ]
      summary: Xác nhận giao dịch thanh toán khoản vay hoàn tất
      description: |
        Xác nhận Partner đã thu tiền của KH, Cake tiến hành gạch nợ.
        `partner_reference_id`, `order_id`, `payment_amount` phải khớp với `/repayment-request`.
      operationId: repaymentConfirm
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepaymentConfirmRequest"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"
