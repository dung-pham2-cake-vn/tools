          type: string
          description: ID được Cake tạo cho mỗi request
          example: "cake-req-xyz"
        partner_reference_id:
          type: string
          description: ID đối tác từ API check-profile
          example: "bf133c7c-8e10-45a2-b9d2-4d04a352917a"
        loan_code:
          type: string
          description: Mã khoản vay
          example: "u8123123Sjsdb"
        phone_number:
