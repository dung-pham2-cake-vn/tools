openapi: 3.0.3
info:
  title: Fiza Payday - Native API
  description: |
    ## Mô tả
    API tích hợp giữa đối tác (Partner) và Cake Digital Bank cho sản phẩm **Payday**, theo mô hình Native API.

    ## Changelog

    | Thời gian | Email title | Cập nhật |
    |-----------|-------|-------|
    | 2026-07-06 | FIZA <> CAKE - Thông tin về system development | Khởi tạo tài liệu |
    | 2026-07-07 | FIZA <> CAKE - Thông tin về system development | Cập nhật tài liệu |
    | 2026-08-xx | FIZA <> CAKE - Thông tin về system development | API client-create đưa partner_bank_* vào trong metadata, thêm field partner_reference_id. API verify-esign đổi type cho field is_correct_otp và verify_count. API get-loan-detail bỏ field overdue_payment_amount. |

    ## Cơ chế xác thực (Signature)
    ```
    rawBody  = {{body}} + {{partner_key}}
    hash     = sha256(rawBody)
    signature = base64_encode(rsa.SignPKCS1v15(rand.Reader, privKey, crypto.SHA256, hash))
    ```
    Partner tạo cặp khóa RSA 1024 bit: private key (PKCS#8) và public key (X.509), gửi public key cho Cake.

    ## Môi trường

    ### SIT + UAT
    | Key | Value | Mô tả |
    |-----|-------|-------|
    | CAKE_API_URL | `https://gw.stage.cakedigibank.tech/ext/loan/{group}/{product_id}` | Endpoint API |
    | CAKE_PARTNER_ID | *(Cake cấp)* | Gắn ở header khi gọi API Cake |
    | CAKE_PARTNER_KEY | *(Cake cấp)* | Gắn sau body khi ký request |
    | CAKE_PUBLIC_KEY | `-----BEGIN PUBLIC KEY-----MIIBIjAN5cPn **** QQIDAQAB-----END PUBLIC KEY-----` | Partner dùng để verify Cake-signed payloads |
    | CAKE_IP_ADDRESS | `35.197.157.155/32` `34.87.136.147/32` `35.240.241.82/32` `34.142.212.108/32` `35.198.211.12/32` `34.143.164.202/32` `34.124.200.2/32` | Partner whitelist |
    | PARTNER_API_URL | *(Partner cấp)* | Endpoint callback |
    | PARTNER_IP_ADDRESS | `34.87.136.147` *(Cake auto)* | Cake whitelist |

    ### PROD
    | Key | Value | Mô tả |
    |-----|-------|-------|
    | CAKE_API_URL | `https://gw.cake.vn/ext/loan/{group}/{product_id}` | Endpoint API |
    | CAKE_PARTNER_ID | *(Cake cấp)* | Gắn ở header |
    | CAKE_PARTNER_KEY | *(Cake cấp)* | Gắn sau body khi ký |
    | CAKE_IP_ADDRESS | `34.87.56.148/32` `35.240.146.157/32` `34.87.175.195/32` `34.142.177.122/32` `34.87.39.41/32` `34.143.164.31/32` `34.143.174.79/32` | Partner whitelist |
    | PARTNER_API_URL | *(Partner cấp)* | Endpoint callback |
    | PARTNER_IP_ADDRESS | *(Partner cấp)* | Cake whitelist |

    ## Error Codes

    ### General
    | Code | Thông báo | Mô tả |
    |------|-----------|-------|
    | `1` | Thành công | API call thành công |
    | `2` | Deadline exceeded | Timeout |
    | `500` | Internal server error | Lỗi nội bộ Cake |
    | `501` | Not implemented | API chưa có trong môi trường này |
    | `502` | An invalid response was received from the upstream server | Upstream Cake service trả về response không hợp lệ |
    | `900000` | Có lỗi xảy ra, vui lòng thử lại sau! | Generic server error |
    | `900001` | Hệ thống đang bảo trì | Bảo trì |
    | `900002` | Request is processing | Request đang xử lý, chờ callback |
    | `200000` | Chữ ký không hợp lệ | Signature RSA-SHA256 sai |
    | `200001` | Mã đối tác không hợp lệ | partner_id sai hoặc chưa được cấp |
    | `200003` | Request ID không hợp lệ | NID hoặc phone không hợp lệ |
    | `400001` | Không có thông tin khoản vay | loan_code không tìm thấy |
    | `100100` | COB Time. Yêu cầu thanh toán không được thực hiện | Ngoài giờ giao dịch |
    | `500013` | Trường dữ liệu không hợp lệ | Field format sai |

    ### Precheck / Onboarding
    | Code | Thông báo | Mô tả |
    |------|-----------|-------|
    | `100008` | Hồ sơ của bạn không đủ điều kiện | Khách hàng không đủ điều kiện |
    | `100009` | Thông tin GTTT đã tồn tại | ID document đã tồn tại |
    | `100011` | Độ tuổi không đủ điều kiện | Dưới tuổi tối thiểu |
    | `500001` | Hồ sơ không đủ điều kiện đăng ký sản phẩm | Không đáp ứng Product Policy |
    | `500009` | Hồ sơ không đủ điều kiện đăng ký sản phẩm | Không đáp ứng Product Policy |
    | `500010` | Hồ sơ mới bị từ chối gần đây | Cần chờ 7 ngày sau khi bị từ chối |
    | `500015` | Đang có khoản vay tương tự đã giải ngân | KH đang có khoản vay active |
    | `500016` | Giấy tờ tùy thân không còn đủ hiệu lực | ID document hết hạn |
    | `500017` | Chưa thực hiện xác thực NFC | NFC chưa hoàn thành |
    | `500018` | Hồ sơ không đủ điều kiện | Không đáp ứng Product Policy |
    | `500019` | Giấy tờ tùy thân không còn đủ hiệu lực | ID document hết hạn |
    | `500020` | Hồ sơ không trùng khớp với hồ sơ tại Cake | NID/phone/tên không khớp |
    | `500021` | Hồ sơ không đủ điều kiện | Không đáp ứng Product Policy |
    | `500024` | Tài khoản nhận giải ngân không hợp lệ | Tài khoản CASA không hợp lệ |
    | `500029` | Đang có hồ sơ vay khác chưa hoàn tất | KH có application đang mở |
    | `500030` | Tài khoản đang tạm khóa | Tài khoản bị khóa tạm thời |

    ### eKYC
    | Code | Thông báo | Mô tả |
    |------|-----------|-------|
    | `180000` | Có lỗi xác thực | Generic eKYC error |
    | `180214` | Ảnh chưa đạt yêu cầu | Ảnh CCCD/selfie không đạt chất lượng |
    | `180411` | Không đọc được thông tin chip CCCD | NFC chip lỗi |
    | `180418` | Ảnh chụp chưa khớp với giấy tờ | Selfie không khớp CCCD |
    | `180417` | Không nhận diện được khuôn mặt | Không có mặt trong ảnh selfie |
    | `180215` | Vui lòng sử dụng CCCD gắn chip | Chỉ chấp nhận CCCD chip |
    | `500012` | Yêu cầu thiếu dữ liệu | KH mới nhưng thiếu ảnh CCCD |
    | `180203` | Giấy tờ đang xét duyệt | eKYC đang pending |

    ### Contract
    | Code | Thông báo | Mô tả |
    |------|-----------|-------|
    | `300001` | Hợp đồng hết hạn | Hồ sơ quá 7 ngày |
    | `300003` | Mã OTP đang bị chặn, thử lại sau 15 phút | Sau 3 lần gửi OTP liên tiếp |
    | `300004` | Hợp đồng bị hủy, do vượt quá số lần lấy OTP | Lần get-otp thứ 7 hủy hợp đồng |
    | `300005` | Nhập sai OTP | OTP sai, chưa bị block |
    | `300006` | Hồ sơ bị chặn, thử lại sau 15 phút | Sai OTP 3 lần liên tiếp |
    | `300007` | Hợp đồng bị hủy, do nhập sai số lần cho phép | OTP sai lần thứ 6 |
    | `300000` | Yêu cầu không hợp lệ | Request quá 7 ngày |

    ### Repayment VAN
    | Code | Thông báo | Mô tả |
    |------|-----------|-------|
    | `100100` | COB Time | Ngoài giờ giao dịch |
    | `100103` | Số tiền thanh toán vượt quá dư nợ | payment_amount > outstanding balance |
    | `400000` | Dữ liệu nhập không hợp lệ | partner_reference_id đã dùng |
    | `400001` | Không có thông tin khoản vay | loan_code không tìm thấy hoặc phone không khớp |
    | `600000` | Thông tin thanh toán không hợp lệ | loan_code và order_id không khớp, hoặc payment_amount = 0 |

  version: "1.0.0"
  contact:
    name: Cake Digital Bank
    url: https://cake.vn

servers:
  - url: https://gw.cake.vn/ext/loan/{group}/{product_id}
    description: Production
    variables:
      group:
        default: cashloan
        description: Nhóm API
      product_id:
        default: product_id
        description: Mã sản phẩm
  - url: https://gw.stage.cakedigibank.tech/ext/loan/{group}/{product_id}
    description: SIT + UAT
    variables:
      group:
        default: cashloan
      product_id:
        default: product_id

# ─────────────────────────────────────────────
# COMMON COMPONENTS
# ─────────────────────────────────────────────
components:
  parameters:
    PartnerHeader:
      name: partner
      in: header
      required: true
      description: CAKE_PARTNER_ID được cấu hình trong môi trường
      schema:
        type: string
        example: CAKE_PARTNER_ID

    SignatureHeader:
      name: signature
      in: header
      required: true
      description: |
        Chữ ký RSA-SHA256 của request body.
        rawBody = body + partner_key → sha256 → RSA sign PKCS1v15 → base64
      schema:
        type: string

    ContentTypeHeader:
      name: Content-Type
      in: header
      required: true
      schema:
        type: string
        default: application/json; charset=utf-8

  schemas:
    # ── Common Response Wrapper ──
    BaseResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Kết quả xử lý yêu cầu (true/false)
          example: true
        code:
          type: integer
          description: Mã trạng thái hệ thống
          example: 1
        message:
          type: string
          description: Thông báo phản hồi từ hệ thống
          example: "Thành công"
        response_id:
          type: string
          description: Mã định danh duy nhất của mỗi phản hồi
          example: "849KTQG7SQWLWQW5"
        timestamp:
          type: string
          format: date-time
          description: Thời gian phản hồi (ISO 8601)
          example: "2025-12-11T09:45:00+07:00"

    PartnerCallbackResponse:
      type: object
      required:
        - success
        - code
        - message
      properties:
        success:
          type: boolean
          description: Kết quả xử lý yêu cầu (true/false)
          example: true
        code:
          type: integer
          description: "Mã trạng thái (1 = Thành công; khác 1 = lỗi)"
          example: 1
        message:
          type: string
          description: Thông báo phản hồi
          example: "Thành công"

    # ── Onboarding ──
    DataConfigResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                city:
                  type: array
                  description: Danh sách tỉnh/thành phố
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        description: ID tỉnh/thành (dùng cho city_id / permanent_city_id)
                      name:
                        type: string
                        description: Tên tỉnh/thành (dùng cho city_name / permanent_city_name)
                      dist:
                        type: array
                        description: "Danh sách quận/huyện. Mô hình 2 cấp: value=000"
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: "ID quận/huyện. Mô hình 2 cấp: dùng \"000\""
                            name:
                              type: string
                              description: "Tên quận/huyện. Mô hình 2 cấp: gửi literal \"Không\""
                            ward:
                              type: array
                              description: Danh sách phường/xã
                              items:
                                type: object
                                properties:
                                  id:
                                    type: string
                                    description: ID phường/xã (dùng cho ward_id / permanent_ward_id)
                                  name:
                                    type: string
                                    description: Tên phường/xã (dùng cho ward_name / permanent_ward_name)
                gender:
                  type: array
                  description: "1=Nam, 2=Nữ"
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Mã giới tính (dùng cho gender ở client-create)
                      name:
                        type: string
                        description: Tên hiển thị
                marital:
                  type: array
                  description: "1=Độc thân, 2=Đã kết hôn, 3=Khác"
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Mã tình trạng hôn nhân (dùng cho marital_id ở client-create)
                      name:
                        type: string
                        description: Tên hiển thị
                occupation:
                  type: array
                  description: "1=Nhân viên VP/công chức, 2=Lao động phổ thông, 3=Tự kinh doanh, 4=Sinh viên, 5=Không đi làm, 6=Khác"
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Mã nghề nghiệp (dùng cho occupation ở client-create)
                      name:
                        type: string
                        description: Tên hiển thị
                job_title:
                  type: array
                  description: "1=Công nhân/Lao động phổ thông, 2=Cấp nhân viên/Chuyên viên, 3=Quản lý, 4=Tự kinh doanh"
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Mã chức vụ (dùng cho job_title ở client-create)
                      name:
                        type: string
                        description: Tên hiển thị
                contact_relationship:
                  type: array
                  description: "1=Vợ, 2=Chồng, 3=Cha, 4=Mẹ, 5=Anh/Em trai, 6=Chị/Em gái, 7=Ông, 8=Bà, 9=Đồng nghiệp, 10=Bạn bè, 11=Con"
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Mã mối quan hệ (dùng cho contact_relationship_1/2 ở client-create)
                      name:
                        type: string
                        description: Tên hiển thị
                loan_purpose:
                  type: array
                  description: "1=Mua sắm đồ dùng gia đình, 2=Chi phí khám chữa bệnh, 3=Thanh toán chi phí du lịch, 6=Các mục đích tiêu dùng hợp pháp khác, 7=Đóng học phí"
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Mã mục đích vay (dùng cho loan_purpose ở client-create)
                      name:
                        type: string
                        description: Tên hiển thị
                bank:
                  type: array
                  description: Danh sách ngân hàng (dùng cho tài khoản nhận giải ngân)
                  items:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Mã ngân hàng
                        example: "970425"
                      name:
                        type: string
                        description: Tên ngân hàng
                        example: "ABBANK"
                      short_name:
                        type: string
                        description: Tên viết tắt
                        example: "ABB"
                      img_url:
                        type: string
                        description: URL logo ngân hàng
                        example: "url/ABBANK.png"
                      full_name:
                        type: string
                        description: Tên đầy đủ
                        example: "NH TMCP An Bình"

    CheckProfileRequest:
      type: object
      required:
        - phone_number
        - partner_reference_id
        - full_name
        - document_id
        - date_of_birth
        - metadata
      properties:
        phone_number:
          type: string
          description: Số điện thoại KH (bắt đầu bằng số 0)
          example: "0xxxxxxxxx"
        partner_reference_id:
          type: string
          description: ID định danh request, tạo mới mỗi request, dùng chung với client-create
          example: "bf133c7c-8e10-45a2-b9d2-4d04a352917a"
        full_name:
          type: string
          description: Họ tên KH (không bắt buộc có dấu)
          example: "TRAN MINH TIEN"
        document_id:
          type: string
          description: Số CCCD/CMND
          example: "xxxxxxxxxxxx"
        date_of_birth:
          type: string
          format: date
          description: Ngày sinh (yyyy-mm-dd)
          example: "1999-12-02"
        metadata:
          type: object
          description: Dữ liệu bổ sung
          required:
            - partner_score
            - partner_client_id
          properties:
            partner_score:
              type: string
              description: Credit score của KH từ phía đối tác, dạng range (lấy chặn dưới)
              example: "350-399"
            partner_client_id:
              type: string
              description: Client ID của KH bên phía đối tác
              example: "user_abc123"
            sso_consent:
              type: string
              nullable: true
              description: Câu KH xác nhận đồng ý điều khoản và điều kiện (T&C)
              example: "Tôi đồng ý với các điều khoản và điều kiện"

    CheckProfileResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                reject_code:
                  type: integer
                  nullable: true
                  description: Mã lý do từ chối. null nếu đủ điều kiện
                reject_message:
                  type: string
                  nullable: true
                  description: Thông báo tương ứng với reject_code
                challenge_level:
                  type: array
                  description: "Mức độ xác thực yêu cầu. Sản phẩm này luôn là [1] (None). 1=None, 2=Facematch, 3=SMS OTP, 4=DTN Cake OTP"
                  items:
                    type: integer
                  example: [1]
                challenge_id:
                  type: string
                  description: ID dùng cho client-create (phải truyền kể cả challenge_level=[1])
                  example: "7b9e0d4f-3c4a-4e7c-9b92-92e6d5dcd781"
                is_exists:
                  type: boolean
                  description: |
                    Hồ sơ KH đã tồn tại tại Cake hay chưa.
                    - `true`: KH đã có hồ sơ → client-update chỉ cần gửi ảnh selfie (face-auth), không cần ảnh CCCD/NFC.
                    - `false`: KH mới → client-update cần gửi đầy đủ ảnh CCCD mặt trước, mặt sau và NFC.
                  example: false

    ClientCreateRequest:
      type: object
      required:
        - challenge_id
        - phone_number
        - full_name
        - date_of_birth
        - gender
        - document_id
        - doc_issue_date
        - doc_issue_place
        - doc_exp_date
        - marital_id
        - nationality
        - permanent_city_id
        - permanent_dist_id
        - permanent_ward_id
        - permanent_address
        - permanent_city_name
        - permanent_dist_name
        - permanent_ward_name
        - city_id
        - dist_id
        - ward_id
        - city_name
        - dist_name
        - ward_name
        - occupation
        - monthly_income
        - contact_name_1
        - contact_number_1
        - contact_relationship_1
        - contact_name_2
        - contact_number_2
        - contact_relationship_2
        - proposed_amount
        - proposed_term
        - loan_insurance
        - loan_purpose
        - product_code
        - metadata
      properties:
        challenge_id:
          type: string
          description: challenge_id trả về từ check-profile
          example: "7b9e0d4f-3c4a-4e7c-9b92-92e6d5dcd781"
        phone_number:
          type: string
          description: Số điện thoại KH (bắt đầu bằng số 0)
          example: "0xxxxxxxxx"
        full_name:
          type: string
          description: Họ tên KH
          example: "TRAN MINH TIEN"
        date_of_birth:
          type: string
          format: date
          description: Ngày sinh (yyyy-mm-dd)
          example: "1999-12-02"
        gender:
          type: string
          description: "1=Nam, 2=Nữ"
          example: "2"
        email:
          type: string
          format: email
          nullable: true
          description: Email KH (không bắt buộc)
          example: "abc@gmail.com"
        document_id:
          type: string
          description: Số CCCD/CMND
          example: "xxxxxxxxxxxx"
        doc_issue_date:
          type: string
          format: date
          description: Ngày cấp GTTT
          example: "2021-11-01"
        doc_issue_place:
          type: string
          description: Nơi cấp GTTT
          example: "Cục CSQLHC về TTXH"
        doc_exp_date:
          type: string
          format: date
          description: Ngày hết hạn GTTT
          example: "2035-05-20"
        marital_id:
          type: string
          description: "1=Độc thân, 2=Đã kết hôn, 3=Khác"
          example: "1"
        nationality:
          type: string
          description: Quốc tịch
          default: "Việt Nam"
        permanent_city_id:
          type: string
          description: ID Tỉnh/TP thường trú
          example: "79"
        permanent_dist_id:
          type: string
          description: "ID Quận/Huyện thường trú. Mô hình 2 cấp: dùng \"000\""
          example: "000"
        permanent_ward_id:
          type: string
          description: ID Phường/Xã thường trú
          example: "001"
        permanent_address:
          type: string
          description: Số nhà, tên đường thường trú
          example: "54 Chu Văn An"
        permanent_city_name:
          type: string
          description: Tên Tỉnh/TP thường trú
          example: "Thành phố Hồ Chí Minh"
        permanent_dist_name:
          type: string
          description: "Mô hình 2 cấp: gửi literal \"Không\""
          example: "Không"
        permanent_ward_name:
          type: string
