          example: "79"
        dist_id:
          type: string
          description: "ID Quận/Huyện hiện tại. Mô hình 2 cấp: dùng \"000\""
          example: "000"
        ward_id:
          type: string
          description: ID Phường/Xã hiện tại
          example: "001"
        address:
          type: string
          nullable: true
          description: Số nhà, tên đường hiện tại
          example: "54 Chu Văn An"
        city_name:
          type: string
          description: Tên Tỉnh/TP hiện tại
          example: "Thành phố Hồ Chí Minh"
        dist_name:
          type: string
          description: "Mô hình 2 cấp: gửi literal \"Không\""
          example: "Không"
        ward_name:
          type: string
