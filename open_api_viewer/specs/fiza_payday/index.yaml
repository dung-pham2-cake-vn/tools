          example: "2"
        company_name:
          type: string
          nullable: true
          description: Tên công ty
          example: "Cake"
        monthly_income:
          type: string
          description: Thu nhập hàng tháng (VNĐ)
          example: "5000000"
        contact_name_1:
          type: string
          description: Họ tên người tham chiếu 1 (Người thân)
          example: "Phan Thi A"
        contact_number_1:
          type: string
          description: SĐT người tham chiếu 1 (bắt đầu bằng số 0)
          example: "0345678901"
        contact_relationship_1:
          type: string
          description: Mối quan hệ người tham chiếu 1 (xem data-config và BRD)
          example: "1"
        contact_name_2:
          type: string
          description: Họ tên người tham chiếu 2 (Bạn bè)
          example: "Phạm Thị B"
        contact_number_2:
          type: string
          description: SĐT người tham chiếu 2 (bắt đầu bằng số 0)
          example: "0345678902"
        contact_relationship_2:
          type: string
          description: Mối quan hệ người tham chiếu 2 (xem data-config và BRD)
          example: "10"
        proposed_amount:
          type: string
          description: Số tiền đề nghị vay (không bao gồm bảo hiểm, VNĐ)
          example: "3000000"
        proposed_term:
          type: string
          description: Thời hạn đề nghị vay (ngày)
          example: "30"
        loan_insurance:
          type: string
          description: Có bảo hiểm khoản vay không
          enum: ["True", "False"]
          example: "True"
        loan_purpose:
          type: string
          description: Mục đích vay (xem data-config)
          example: "1"
        product_code:
          type: string
          description: Mã sản phẩm theo BRD
          example: "PD_01"
        metadata:
          type: object
          description: Dữ liệu bổ sung
          required:
