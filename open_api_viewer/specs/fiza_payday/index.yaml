          enum:
            - LOAN_APPROVE
            - LOAN_REJECT
            - LOAN_CANCEL
            - LOAN_EXPIRED
            - LOAN_SIGNED
            - LOAN_ACTIVE
            - LOAN_CLOSE

# ─────────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────────
paths:
  # ════════════════════
  # PHASE 1 — PRECHECK
  # ════════════════════
  /data-config:
    post:
      tags: [Phase 1 - Precheck]
      summary: API-1 - Lấy danh sách cấu hình form onboarding
      description: |
        Trả về value list dùng để render form onboarding: tỉnh/thành, quận/huyện, phường/xã,
        giới tính, hôn nhân, nghề nghiệp, chức vụ, mối quan hệ, mục đích vay, danh sách ngân hàng.

        Gọi sau khi KH nhập thông tin cơ bản và trước khi gọi client-create.
        **Không cần request body.**
      operationId: dataConfig
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Không cần body
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataConfigResponse"

  /check-profile:
    post:
      tags: [Phase 1 - Precheck]
      summary: API-2 - Kiểm tra điều kiện trước khi mở khoản vay
      description: |
        Kiểm tra điều kiện hợp lệ trước khi tạo hồ sơ.

        **Điều kiện tiếp tục:** `code=1` AND `reject_code=null`

        Field `is_exists` cho biết KH đã có hồ sơ tại Cake chưa:
        - `true`: KH đã tồn tại → client-update chỉ cần selfie (face-auth)
        - `false`: KH mới → client-update cần ảnh CCCD mặt trước, mặt sau và NFC
      operationId: checkProfile
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckProfileRequest"
            example:
              phone_number: "0345678900"
              partner_reference_id: "bf133c7c-8e10-45a2-b9d2-4d04a352917a"
              full_name: "TRAN MINH TIEN"
              document_id: "075099093845"
              date_of_birth: "1999-12-02"
              metadata: {}
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckProfileResponse"
              example:
                success: true
                code: 1
                message: "Thành công"
                response_id: "849KTQG7SQWLWQW5"
                timestamp: "2025-12-11T09:45:00+07:00"
                data:
                  reject_code: null
                  reject_message: null
                  challenge_level: [1]
                  challenge_id: "7b9e0d4f-3c4a-4e7c-9b92-92e6d5dcd781"
                  is_exists: false

  # ════════════════════════════════════════
  # PHASE 2 — ONBOARDING (eKYC & Loan)
  # ════════════════════════════════════════
  /client-create:
    post:
      tags: [Phase 2 - Onboarding]
      summary: API-3 - Tạo hồ sơ KH sau precheck
      description: |
        Tạo hồ sơ KH sau khi precheck thành công.

        **Điều kiện tiếp tục:** `request_id != null` → gọi client-update.

        Lưu ý: `job_title` chỉ required khi `occupation=1` (nhân viên VP/công chức).
      operationId: clientCreate
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientCreateRequest"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientCreateResponse"
              example:
                success: true
                code: 1
                message: "Thành công"
                response_id: "849KTQG7SQWLWQW5"
                timestamp: "2025-12-11T09:45:00+07:00"
                data:
                  request_id: "req-abc123"

  /client-update:
    post:
      tags: [Phase 2 - Onboarding]
      summary: API-4 - Cập nhật hồ sơ và upload ảnh eKYC
      description: |
        Upload ảnh selfie, CCCD mặt trước/sau và NFC data.

        **Điều kiện tiếp tục:** `status=EKYC_SUCCESS` → gọi loan-register.

        Nếu `status=EKYC_PENDING`: không có callback, chờ xử lý thủ công bởi Cake.

        **Lưu ý về ảnh:**
        - `selfie_image`: **Required** cho mọi KH (dùng để xác thực khuôn mặt)
        - `front_nid_image` và `back_nid_image`: **Required** khi `is_exists=false` (KH mới), optional khi KH đã có hồ sơ
        - `nfc_data`: Optional, nhưng nếu cung cấp thì tất cả các trường bên trong đều required
      operationId: clientUpdate
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdateRequest"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientUpdateResponse"
              example:
                success: true
                code: 1
                message: "Thành công"
                response_id: "849KTQG7SQWLWQW5"
                timestamp: "2025-12-11T09:45:00+07:00"
                data:
                  status: "EKYC_SUCCESS"

  /loan-register:
    post:
      tags: [Phase 2 - Onboarding]
      summary: API-5 - Đăng ký khoản vay mới
      description: |
        Đăng ký khoản vay sau khi eKYC thành công.

        **Điều kiện tiếp tục:**
        - Nếu `status=LOAN_APPROVE` → gọi get-esign ngay
        - Nếu `status=LOAN_REVIEWING` → chờ callback partner-update-status
      operationId: loanRegister
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanRegisterRequest"
            example:
              request_id: "req-abc123"
              phone_number: "0345678900"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanRegisterResponse"
              example:
                success: true
                code: 1
                message: "Thành công"
                response_id: "849KTQG7SQWLWQW5"
                timestamp: "2025-12-11T09:45:00+07:00"
                data:
                  status: "LOAN_REVIEWING"
                  loan_code: "u8123123Sjsdb"

  # ════════════════════
  # PHASE 3 — CONTRACT
  # ════════════════════
  /get-esign:
    post:
      tags: [Phase 3 - Contract]
      summary: API-6 - Lấy URL hợp đồng điện tử
      description: |
        Trả về URL hợp đồng để KH xem và ký.

        **Quan trọng:**
        - Phải gọi ít nhất 1 lần/ngày để tạo link mới (link hết hạn trong ngày)
        - Phải gọi trước get-otp trong mỗi phiên ký
      operationId: getEsign
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetEsignRequest"
            example:
              loan_code: "u8123123Sjsdb"
              phone_number: "0345678900"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetEsignResponse"

  /get-otp:
    post:
      tags: [Phase 3 - Contract]
      summary: API-7 - Gửi OTP để ký hợp đồng
      description: |
        Gửi SMS OTP dùng để xác thực ký hợp đồng.

        **get-esign phải được gọi ít nhất 1 lần trong ngày trước khi gọi API này.**

        **Giới hạn OTP:**
        | Quy tắc | Giới hạn | Hệ quả |
        |---------|----------|--------|
        | Hiệu lực OTP | 2 phút | Gọi get-otp trong 2 phút không tạo OTP mới |
        | get-otp liên tiếp (chưa verify) | 3 lần | Chặn 15 phút |
        | Tổng get-otp/hợp đồng | 6 lần | Hủy hợp đồng |
      operationId: getOtp
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetOtpRequest"
            example:
              loan_code: "u8123123Sjsdb"
              phone_number: "0345678900"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetOtpResponse"

  /verify-esign:
    post:
      tags: [Phase 3 - Contract]
      summary: API-8 - Xác thực OTP để ký hợp đồng
      description: |
        Xác thực OTP để hoàn tất ký hợp đồng điện tử.

        **Giới hạn verify OTP:**
        | Quy tắc | Giới hạn | Hệ quả |
        |---------|----------|--------|
        | verify-esign sai liên tiếp | 3 lần | Chặn 15 phút |
        | Tổng verify-esign sai/hợp đồng | 6 lần | Hủy hợp đồng |
        | Sai OTP cùng 1 lần | 3 lần | Cần get-otp mới |
      operationId: verifyEsign
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEsignRequest"
            example:
              loan_code: "u8123123Sjsdb"
              phone_number: "0345678900"
              otp: "123456"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyEsignResponse"

  /contract-cancel:
    post:
      tags: [Phase 3 - Contract]
      summary: API-9 - Hủy hợp đồng điện tử
      description: |
        Hủy hợp đồng theo yêu cầu của KH hoặc partner.
        Sau khi hủy, KH có thể đăng ký lại ngay lập tức.
      operationId: contractCancel
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractCancelRequest"
            example:
              loan_code: "u8123123Sjsdb"
              phone_number: "0345678900"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"

  # ══════════════════════════════════════════════════
  # PHASE 4 — LOAN MANAGEMENT & REPAYMENT
  # ══════════════════════════════════════════════════
  /get-loan-detail:
    post:
      tags: [Phase 4 - Loan Management & Repayment]
      summary: API-10 - Truy vấn thông tin chi tiết khoản vay
      description: Truy vấn thông tin khoản vay bao gồm số dư, lịch thanh toán và trạng thái.
      operationId: getLoanDetail
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetLoanDetailRequest"
            example:
              loan_code: "u8123123Sjsdb"
              phone_number: "0345678900"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetLoanDetailResponse"

  /repayment-van:
    post:
      tags: [Phase 4 - Loan Management & Repayment]
      summary: API-11 - Tạo QR code thanh toán khoản vay
      description: |
        Tạo QR code để KH thanh toán khoản vay.

        `partner_reference_id` phải unique mỗi request. Trùng → lỗi 400000.
      operationId: repaymentVan
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepaymentVanRequest"
            example:
              loan_code: "u8123123Sjsdb"
              phone_number: "0345678900"
              partner_reference_id: "pay-ref-001"
              payment_amount: 5000000
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepaymentVanResponse"

  /repayment-status:
    post:
      tags: [Phase 4 - Loan Management & Repayment]
      summary: API-12 - Truy vấn trạng thái thanh toán
      description: Truy vấn trạng thái giao dịch thanh toán theo order_id trả về từ /repayment-van.
      operationId: repaymentStatus
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepaymentStatusRequest"
            example:
              loan_code: "u8123123Sjsdb"
              phone_number: "0345678900"
              order_id: "ORD-20250603-001"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepaymentStatusResponse"

  # ════════════════════════════════════
  # ASYNC CALLBACK (Cake → Partner)
  # ════════════════════════════════════
  /partner-update-status:
    post:
      tags: [Callback - Cake → Partner]
      summary: Cake thông báo thay đổi trạng thái khoản vay
      description: |
        **Chiều: Cake → Partner**

        Cake gọi endpoint này trên hệ thống partner khi có thay đổi trạng thái.
        Partner phải expose endpoint tại path `/partner-update-status`.

        **Partner phải:**
        1. Trả về `{"success":true,"code":1,"message":"Thành công"}` khi xử lý thành công
        2. Dedupe bằng `request_id` (Cake retry khi nhận code != 1)

        **Cake gọi callback khi:**
        | Sự kiện | Status |
        |---------|--------|
        | Sau loan-register | LOAN_APPROVE hoặc LOAN_REJECT |
        | Sau verify-esign | LOAN_SIGNED |
        | Sau giải ngân | LOAN_ACTIVE |
        | KH tất toán | LOAN_CLOSE |
        | Sau 7 ngày chưa ký | LOAN_EXPIRED |

        **Signature:** Cake ký bằng private key của mình → Partner verify bằng CAKE_PUBLIC_KEY
      operationId: partnerUpdateStatus
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerUpdateStatusRequest"
            example:
              request_id: "cake-req-xyz"
              partner_reference_id: "bf133c7c-8e10-45a2-b9d2-4d04a352917a"
              loan_code: "u8123123Sjsdb"
              phone_number: "0345678900"
              status: "LOAN_APPROVE"
      responses:
        "200":
          description: Partner xác nhận nhận callback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerCallbackResponse"
              example:
                success: true
                code: 1
                message: "Success"

# ─────────────────────────────────────────────
# TAGS
# ─────────────────────────────────────────────
tags:
  - name: Phase 1 - Precheck
    description: |
      Kiểm tra điều kiện và lấy cấu hình trước khi tạo hồ sơ. Không có callback trong phase này.

      **Luồng:** `data-config` → `check-profile`
  - name: Phase 2 - Onboarding
    description: |
      Tạo hồ sơ KH, upload ảnh eKYC, đăng ký khoản vay.

      **Luồng:** `client-create` → `client-update` → `loan-register`

      Điều kiện vào phase 3: `loan_code` với status `LOAN_APPROVE`
  - name: Phase 3 - Contract
    description: |
      KH xem hợp đồng, nhận OTP SMS, ký. Hoặc hủy.

      **Luồng ký:** `get-esign` → `get-otp` → `verify-esign`

      **Luồng hủy:** `contract-cancel`

      Callback sau phase này: `LOAN_SIGNED` → `LOAN_ACTIVE`
  - name: Phase 4 - Loan Management & Repayment
    description: |
      Sau giải ngân: xem thông tin khoản vay, tạo QR thanh toán, poll trạng thái.

      **Luồng:** `get-loan-detail` → `repayment-van` → `repayment-status`

      Callback khi tất toán: `LOAN_CLOSE`
  - name: Callback - Cake → Partner
    description: |
      Cake gọi endpoint này trên hệ thống partner khi có thay đổi trạng thái.

      Partner phải expose endpoint `/partner-update-status` và trả về `{"success":true,"code":1,"message":"Thành công"}`.

      **Xác thực ngược:** Cake ký bằng private key → Partner verify bằng `CAKE_PUBLIC_KEY`.

# ─────────────────────────────────────────────
# SEQUENCE DIAGRAMS
# ─────────────────────────────────────────────
x-mermaid-flows:

  onboarding: |
    sequenceDiagram
      autonumber
      participant P as Partner
      participant C as Cake

      Note over P,C: PHASE 1 - PRECHECK
      P->>C: data-config()
      C-->>P: city, gender, occupation, bank, loan_purpose...
      P->>C: check-profile(phone, full_name, document_id, dob)
      alt reject_code != null
        C-->>P: REJECT - hiển thị thông báo từ chối
      else code=1 AND reject_code=null
        C-->>P: challenge_level=[1], challenge_id, is_exists

        Note over P,C: PHASE 2 - ONBOARDING (eKYC & Loan)
        P->>C: client-create(challenge_id, thông tin KH, bank account giải ngân)
        C-->>P: request_id

        alt is_exists = false (KH mới)
          P->>C: client-update(request_id, selfie + front_nid + back_nid + nfc?)
        else is_exists = true (KH đã có hồ sơ tại Cake)
          P->>C: client-update(request_id, selfie only)
        end

        alt status = EKYC_PENDING
          C-->>P: EKYC_PENDING (xử lý thủ công, không có callback)
        else status = EKYC_SUCCESS
          C-->>P: EKYC_SUCCESS

          P->>C: loan-register(request_id, phone)
          C-->>P: loan_code + status

          alt status = LOAN_REVIEWING
            Note over P: Chờ callback partner-update-status: LOAN_APPROVE
          else status = LOAN_APPROVE
            Note over P: Chuyển sang Phase 3 - Contract
          end
        end
      end

  contract_signing: |
    sequenceDiagram
      autonumber
      participant P as Partner
      participant C as Cake

      Note over P,C: Điều kiện vào: loan_code có status LOAN_APPROVE

      Note over P,C: PHASE 3 - CONTRACT
      P->>C: get-esign(loan_code, phone)
      C-->>P: url HTML, url_pdf, expired_time
      Note over P: Hiển thị hợp đồng cho KH xem

      alt KH đồng ý ký
        P->>C: get-otp(loan_code, phone)
        C-->>P: otp_count, blocked, otp_period
        Note over P: KH nhập OTP nhận qua SMS

        P->>C: verify-esign(loan_code, phone, otp)
        alt is_correct_otp = true
          C-->>P: is_correct_otp="true"
          Note over C: Callback: LOAN_SIGNED → LOAN_ACTIVE
        else OTP sai (tối đa 6 lần)
          C-->>P: is_correct_otp="false"
        end
      else KH từ chối ký
        P->>C: contract-cancel(loan_code, phone)
        C-->>P: success
        Note over P: KH có thể đăng ký lại ngay
      end

  repayment: |
    sequenceDiagram
      autonumber
      participant P as Partner
      participant C as Cake

      Note over P,C: Điều kiện vào: loan_code có status LOAN_ACTIVE

      Note over P,C: PHASE 4 - LOAN MANAGEMENT & REPAYMENT
      P->>C: get-loan-detail(loan_code, phone)
      C-->>P: balance, due_date, overdue_amount, total_payment_amount

      Note over P: KH chọn số tiền thanh toán
      P->>C: repayment-van(loan_code, phone, partner_reference_id, payment_amount)
      C-->>P: order_id, qr_code, expired_time, bank_name, bank_account_number

      Note over P: Hiển thị QR cho KH quét và chuyển khoản

      P->>C: repayment-status(loan_code, phone, order_id)
      C-->>P: status (INIT/IN_PROCESS/SUCCESS/FAILED/HOLD)

      alt Khoản vay tất toán
        C->>P: partner-update-status: LOAN_CLOSE
      end
