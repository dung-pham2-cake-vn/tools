openapi: 3.0.3
info:
  title: LCP_paylater - DOP Lending APIs
  description: |
    > **⚠️ Lưu ý bản quyền:** Tài liệu này thuộc bản quyền của **Cake by VPBank**.
    > Mọi hình thức sao chép, chỉnh sửa, hoặc phát tán phải được sự đồng ý bằng văn bản của Cake by VPBank.

    ## Mô tả
    API tích hợp giữa đối tác (Partner) và hệ thống Cake Digital Bank theo mô hình **DOP**
    (Digital Onboarding Process), sản phẩm **Paylater**.

    Phạm vi tài liệu:
    - **Onboarding & liên kết tài khoản**: `generate-webview/onboarding` → `partner-update-status`
    - **Thông tin khoản vay**: `get-loan-detail`, `generate-webview/loan-detail`
    - **Thanh toán dịch vụ**: `generate-webview/payment-request` → `payment-status` → `payment-revert`

    Việc chuyển đổi trả góp (installment) do KH thực hiện trực tiếp trong webview Cake,
    không có API riêng cho Partner.

    ## Changelog

    | Thời gian | Email title | Cập nhật |
    |-----------|-------|-------|
    | 2026-07-16 | Weekly meeting Cake x Long Châu | Khởi tạo tài liệu |
    | 2026-08-25 | N/A | `get-loan-detail`: bỏ `monthly_payment_amount`, đổi `overdue_payment_amount` → `period_payment_amount`. Chuyển luồng thanh toán sang webview: bổ sung `generate-webview/loan-detail`, `generate-webview/payment-request`. Bỏ `repayment-van`, `repayment-status`, `payment-request`, `payment-confirm`, các API installment, `partner-repayment-status`, `partner-payment-status` |
    | 2026-08-26 | Weekly meeting Cake x Long Châu | `generate-webview/payment-request`: bổ sung `installment_tenor` (kỳ hạn trả góp theo tháng) |

    ## Cơ chế xác thực (Signature)
    Tất cả request từ Partner gọi Cake đều phải ký signature:
    ```
    rawBody = {{body}} + {{partner_key}}
    hash = sha256(rawBody)
    signature = base64_encode(rsa.SignPKCS1v15(rand.Reader, privKey, crypto.SHA256, hash))
    ```
    Partner cần tạo cặp khóa RSA 1024 bit: private key (PKCS#8) và public key (X.509),
    gửi public key cho Cake.
    Test chữ ký có thể dùng tool online như [https://emn178.github.io/online-tools/rsa/verify](https://emn178.github.io/online-tools/rsa/verify/?input=%7B%22req_id%22%3A%221%22%2C%22action%22%3A1%7DPartner&input_type=utf-8&algorithm=SHA256&public_key=-----BEGIN%20PUBLIC%20KEY-----%0AMIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQC0KTbcJmoAT1g%2FFEp7eWWzuATg%0AK%2F7Go01PKZUaVTsN80JiDdg%2FmgDIcE0D9w5fYsDBN2pgeQ7EW8qqB8wb84qqk7QX%0AzAFfAqGx10X5aRe0WPsL3x7SCnG9QDz%2Fsun7hvrELes2sBw1a63lk3ZHyU9xLAcs%0ASsOFirCfQDlq0sbvNQIDAQAB%0A-----END%20PUBLIC%20KEY-----&signature_input_type=base64&signature=LWRijuKu83sa%2BU2FMe%2BsrtP8ctIaPjNAZ68YBiOiZNhzl%2FBELWztAcnTaOxINjghrfepTRLjhjvQw5mfwZrUHue4hwWDRvCpTMvCSfv513vuKp4kIQFK5EAASMZuhjwTn6mBxeO1i55xWB2wHqXVJxXgFecSok6T8qqJyH4XUzc%3D).
    Other tools: [8gwifi RSA](https://8gwifi.org/RSAFunctionality?rsasignverifyfunctions=rsasignverifyfunctions&keysize=1024) (chọn `RSA Signature Algorithms: SHA256withRSA`).

    ## Môi trường

    ### SIT+UAT Environment

    | Key | Value | Description |
    |-----|-------|-------------|
    | CAKE_API_URL | `https://gw.stage.cakedigibank.tech/ext/loan/{group}/{product_id}/` | |
    | CAKE_PARTNER_ID | *(Cake cấp)* | Gắn ở header khi gọi API Cake |
    | CAKE_PARTNER_KEY | *(Cake cấp)* | Gắn sau body khi ký API Cake |
    | CAKE_IP_ADDRESS | `35.197.157.155/32`<br>`34.87.136.147/32`<br>`35.240.241.82/32`<br>`34.142.212.108/32`<br>`35.198.211.12/32`<br>`34.143.164.202/32`<br>`34.124.200.2/32` | Partner thêm các IP này vào Whitelist |
    | PARTNER_API_URL | *(Partner cấp)* | |
    | PARTNER_IP_ADDRESS | `34.87.136.147 (Cake auto)` | Cake thêm các IP này vào Whitelist |
    | PARTNER_REDIRECT_URL | *(Partner cấp)* | Cake whitelist các redirect_url này |

    ### PROD Environment

    | Key | Value | Description |
    |-----|-------|-------------|
    | CAKE_API_URL | `https://gw.cake.vn/ext/loan/{group}/{product_id}/` | |
    | CAKE_PARTNER_ID | *(Cake cấp)* | Gắn ở header khi gọi API Cake |
    | CAKE_PARTNER_KEY | *(Cake cấp)* | Gắn sau body khi ký api partner |
    | CAKE_IP_ADDRESS | `34.87.56.148/32`<br>`35.240.146.157/32`<br>`34.87.175.195/32`<br>`34.142.177.122/32`<br>`34.87.39.41/32`<br>`34.143.164.31/32`<br>`34.143.174.79/32` | Partner thêm các IP này vào Whitelist |
    | PARTNER_API_URL | *(Partner cấp)* | |
    | PARTNER_IP_ADDRESS | *(Partner cấp)* | Cake thêm các IP này vào Whitelist |
    | PARTNER_REDIRECT_URL | *(Partner cấp)* | Cake whitelist các redirect_url này |

    ## Định nghĩa Status

    ### partner-update-status (Cake callback → Partner)
    | Status | Description |
    |--------|-------------|
    | `LOAN_APPROVE` | Hồ sơ đăng ký khoản vay đã được phê duyệt |
    | `LOAN_REJECT` | Hồ sơ đăng ký khoản vay bị từ chối |
    | `LOAN_EXPIRED` | Hồ sơ đăng ký khoản vay bị hết hạn (7 ngày) |
    | `LOAN_SIGNED` | Hồ sơ đã ký hợp đồng vay |
    | `LOAN_CANCEL` | Hồ sơ đăng ký khoản vay bị hủy |
    | `LOAN_ACTIVE` | Khoản vay của KH đã được giải ngân thành công |
    | `LOAN_CLOSE` | Khoản vay đã tất toán |

    ### get-loan-detail (loan_account_status)
    | Status | Description |
    |--------|-------------|
    | `LOAN_UNKNOWN` | Hồ sơ KH có trạng thái không xác định/lỗi |
    | `LOAN_APPROVE` | Hồ sơ đăng ký khoản vay đã được phê duyệt |
    | `LOAN_REJECT` | Hồ sơ đăng ký khoản vay bị từ chối |
    | `LOAN_EXPIRED` | Hồ sơ đăng ký khoản vay bị hết hạn (7 ngày) |
    | `LOAN_CANCEL` | Hồ sơ đăng ký khoản vay bị hủy |
    | `LOAN_SIGNED` | Khoản vay đã được ký, đang giải ngân |
    | `LOAN_ACTIVE` | Khoản vay của KH đã được giải ngân thành công |
    | `LOAN_LOCK` | Khoản vay bị tạm khóa, cần thanh toán để mở lại (chỉ Paylater) |
    | `LOAN_LOCKED` | Khoản vay bị khóa vĩnh viễn, cần tất toán và đăng ký lại (chỉ Paylater) |
    | `LOAN_CLOSE` | Khoản vay đã tất toán |

    ## Error Codes

    ### General
    | Code | Message |
    |------|---------|
    | `1` | Thành công |
    | `2` | Deadline exceeded |
    | `500` | Internal server error |
    | `501` | Not implement |
    | `502` | An invalid response was received from the upstream server |
    | `900000` | Có lỗi xảy ra, vui lòng thử lại sau! / Trường dữ liệu không hợp lệ: {{field_name}} - required |
    | `900001` | Hệ thống đang bảo trì |
    | `900002` | Request is processing |
    | `200000` | Chữ ký không hợp lệ |
    | `200001` | Mã đối tác không hợp lệ |
    | `200003` | Request ID không hợp lệ (NID hoặc Phone không khớp) |
    | `400001` | Không có thông tin khoản vay (Sản phẩm không tồn tại loan_code này) |
    | `100100` | COB Time - Yêu cầu thanh toán không được thực hiện |
    | `500013` | Trường dữ liệu không hợp lệ: {{field_name}} - {{field_type}} |
    | `500014` | Trạng thái khoản vay không hợp lệ (đang không hỗ trợ) |

    ### Repayments
    | Code | Message |
    |------|---------|
    | `100103` | Số tiền thanh toán vượt quá dư nợ có thể thanh toán |
    | `10003` | Yêu cầu hiện tại khác với yêu cầu trước đó (order_id đã được confirm trước đó) |

    ### Terminates
    | Code | Message |
    |------|---------|
    | `100102` | Đang có số dư thanh toán trước hạn, không thể tất toán |
    | `100104` | Khoản vay đã đến hạn thanh toán, cần thanh toán toàn bộ dư nợ để hủy hợp đồng |
    | `600000` | Thông tin thanh toán không hợp lệ (bộ dữ liệu thanh toán không khớp) |
    | `100002` | Hình selfie không đúng (facematch không thành công) |

  version: "1.0.0"
  contact:
    name: Cake Digital Bank Support
    url: https://cake.vn

servers:
  - url: https://gw.stage.cakedigibank.tech/ext/loan/{group}/{product_id}
    description: SIT+UAT
    variables:
      group:
        default: cashloan
      product_id:
        default: lcp_paylater
  - url: https://gw.cake.vn/ext/loan/{group}/{product_id}
    description: Production
    variables:
      group:
        description: "Nhóm API (ví dụ: cashloan, paylater)"
        default: cashloan
      product_id:
        description: Mã sản phẩm được cấu hình
        default: lcp_paylater

# ─────────────────────────────────────────────
# COMMON COMPONENTS
# ─────────────────────────────────────────────
components:
  parameters:
    PartnerHeader:
      name: partner
      in: header
      required: true
      description: CAKE_PARTNER_ID được cấu hình trong môi trường
      schema:
        type: string
        example: CAKE_PARTNER_ID

    SignatureHeader:
      name: signature
      in: header
      required: true
      description: |
        Chữ ký RSA-SHA256 của request body.
        rawBody = body + partner_key → sha256 → RSA sign PKCS1v15 → base64
      schema:
        type: string

    ContentTypeHeader:
      name: Content-Type
      in: header
      required: true
      schema:
        type: string
        default: application/json; charset=utf-8

  schemas:
    # ── Common Response Wrapper ──
    BaseResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Kết quả xử lý yêu cầu (true/false)
          example: true
        code:
          type: integer
          description: Mã trạng thái hệ thống
          example: 1
        message:
          type: string
          description: Thông báo phản hồi từ hệ thống
          example: Thành công
        response_id:
          type: string
          description: Mã định danh duy nhất của mỗi phản hồi
          example: "849KTQG7SQWLWQW5"
        timestamp:
          type: string
          format: date-time
          description: Thời gian phản hồi (ISO 8601)
          example: "2025-11-03T07:00:00+07:00"

    # ── generate-webview/onboarding ──
    GenerateWebviewOnboardingRequest:
      type: object
      required:
        - partner_reference_id
        - phone_number
        - redirect_url
        - metadata
      properties:
        partner_reference_id:
          type: string
          description: ID của đối tác để định danh hồ sơ
          example: "bf133c7c-8e10-45a2-b9d2-4d04a352917a"
        phone_number:
          type: string
          description: SĐT của KH (định dạng bắt đầu bằng số 0)
          example: "0xxxxxxxxx"
        redirect_url:
          type: string
          description: URL để đóng webview DOP, mặc định điền https://cake.vn/deeplink?home=app
          example: "https://cake.vn/deeplink?home=app"
        metadata:
          $ref: "#/components/schemas/OnboardingMetadata"
        nfc_data:
          $ref: "#/components/schemas/NfcData"

    OnboardingMetadata:
      type: object
      description: Dữ liệu bổ sung (nếu có)
      required:
        - partner_score
        - partner_onboarding_channel
      properties:
        partner_score:
          type: string
          description: Dạng range, lấy chặn dưới
          example: "800-800"
        partner_onboarding_channel:
          type: string
          description: Kênh KH truy cập, truyền mặc định `APP_DEFAULT`
          default: "APP_DEFAULT"
          example: "APP_DEFAULT"

    NfcData:
      type: object
      description: Dữ liệu NFC raw
      required:
        - sod
        - dg1
        - dg2
        - dg13
        - dg14
        - dg15
        - com
      properties:
        sod:
          type: string
          description: The raw NFC data
        dg1:
          type: string
          description: The raw NFC data
        dg2:
          type: string
          description: The raw NFC data
        dg13:
          type: string
          description: The raw NFC data
        dg14:
          type: string
          description: The raw NFC data
        dg15:
          type: string
          description: The raw NFC data
        com:
          type: string
          description: The raw NFC data

    GenerateWebviewResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              description: Dữ liệu trả về khi khởi tạo webview thành công
              properties:
                webview_url:
                  type: string
                  description: Webview DOP URL
                  example: "https://dop.cake.vn/...?token=..."


    # ── get-loan-detail ──
    GetLoanDetailRequest:
      type: object
      required:
        - loan_code
        - phone_number
      properties:
        loan_code:
          type: string
          description: Mã khoản vay, nhận từ API /partner-update-status
          example: "u8123123Sjsdb"
        phone_number:
          type: string
          description: SĐT của KH (định dạng bắt đầu bằng số 0), dùng để đối chiếu với loan_code
          example: "0xxxxxxxxx"

    GetLoanDetailResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              description: Thông tin chi tiết khoản vay
              properties:
                loan_account_status:
                  type: string
                  enum:
                    - LOAN_UNKNOWN
                    - LOAN_INIT
                    - LOAN_REVIEWING
                    - LOAN_REJECT
                    - LOAN_APPROVE
                    - LOAN_EXPIRED
                    - LOAN_CANCEL
                    - LOAN_SIGNED
                    - LOAN_ACTIVE
                    - LOAN_LOCK
                    - LOAN_LOCKED
                    - LOAN_CLOSE
                  description: Trạng thái tài khoản vay
                contract_id:
                  type: string
                  description: Mã hợp đồng (dùng cho nhắc nợ, đối soát)
                  example: "1234567890"
                loan_alias:
                  type: string
                  description: Mã thanh toán
                  example: "G4JH5R"
                contract_url:
                  type: string
                  description: URL hợp đồng đã ký song phương (hết hạn trong 1h)
                  example: "https://storage.googleapis.com/..."
                full_name:
                  type: string
                  description: Họ và tên đầy đủ của KH
                  example: "Nguyễn Hoàng Sơn"
                document_id:
                  type: string
                  description: Số CCCD của KH
                  example: "xxxxxxxxxxxx"
                approved_amount:
                  type: string
                  description: Số tiền được phê duyệt (VNĐ)
                  example: "12000000"
                approved_term:
                  type: string
                  description: Thời hạn vay phê duyệt
                  example: "12"
                disburse_amount:
                  type: string
                  description: Số tiền đã giải ngân
                  example: "12840000"
                interest_rate:
                  type: string
                  description: Lãi suất
                  example: "43"
                principle_balance:
                  type: string
                  description: Dư nợ gốc khả dụng còn lại
                  example: "12640000"
                interest_balance:
                  type: string
                  description: Dư nợ lãi phát sinh
                  example: "197494"
                payment_period:
                  type: string
                  description: "Kỳ thanh toán số"
                  example: "12"
                due_date:
                  type: string
                  format: date
                  description: Ngày đến hạn thanh toán gần nhất, đã bao gồm holiday nếu có
                  example: "2025-06-27"
                day_arrears:
                  type: string
                  description: Số ngày quá hạn
                  example: "191"
                period_payment_amount:
                  type: string
                  description: Số tiền KH phải thanh toán trong kỳ
                  example: "15331759"
                total_payment_amount:
                  type: string
                  description: Tổng số tiền KH có thể thanh toán
                  example: "15331759"
                prepayment_amount:
                  type: string
                  description: "Số tiền KH thanh toán dư"
                  example: "0"

    # ── partner-update-status (Cake → Partner) ──
    PartnerUpdateStatusRequest:
      type: object
      required:
        - request_id
        - partner_reference_id
        - status
      properties:
        request_id:
          type: string
          description: Mã định danh cho request
          example: "req-0001"
        partner_reference_id:
          type: string
          description: ID đối tác truyền ở API /generate-webview/onboarding
          example: "uuid-1234"
        loan_code:
          type: string
          description: Mã khoản vay, không truyền khi LOAN_REJECT
          example: "u8123123Sjsdb"
        status:
          type: string
          description: |
            Trạng thái hồ sơ khoản vay Cake:
            - LOAN_APPROVE: Hồ sơ đăng ký khoản vay đã được phê duyệt
            - LOAN_REJECT: Hồ sơ đăng ký khoản vay bị từ chối
            - LOAN_EXPIRED: Hồ sơ đăng ký khoản vay bị hết hạn (7 ngày)
            - LOAN_SIGNED: Hồ sơ đã ký hợp đồng vay
            - LOAN_CANCEL: Hồ sơ đăng ký khoản vay bị hủy
            - LOAN_ACTIVE: Hồ sơ đã giải ngân thành công
            - LOAN_CLOSE: Khoản vay đã tất toán
          enum:
            - LOAN_APPROVE
            - LOAN_REJECT
            - LOAN_EXPIRED
            - LOAN_SIGNED
            - LOAN_CANCEL
            - LOAN_ACTIVE
            - LOAN_CLOSE
          example: "LOAN_APPROVE"


    # ── Partner callback response (code/message) ──
    PartnerCallbackResponse:
      type: object
      required:
        - success
        - code
        - message
      properties:
        success:
          type: boolean
          description: Kết quả xử lý yêu cầu (true/false)
          example: true
        code:
          type: integer
          description: "Mã trạng thái (1 = Thành công; khác 1 = lỗi)"
          example: 1
        message:
          type: string
          description: Thông báo phản hồi
          example: "Thành công"

    # ── generate-webview/loan-detail ──
    GenerateWebviewLoanDetailRequest:
      type: object
      required:
        - loan_code
        - phone_number
        - redirect_url
      properties:
        loan_code:
          type: string
          description: Mã khoản vay, nhận từ API /partner-update-status
          example: "u8123123Sjsdb"
        phone_number:
          type: string
          description: SĐT của KH (định dạng bắt đầu bằng số 0)
          example: "0xxxxxxxxx"
        redirect_url:
          type: string
          description: URL để đóng webview DOP, mặc định điền https://cake.vn/deeplink?home=app
          example: "https://cake.vn/deeplink?home=app"

    # ── Payment ──
    GenerateWebviewPaymentRequestBody:
      type: object
      required:
        - loan_code
        - phone_number
        - redirect_url
        - partner_reference_id
        - payment_amount
        - metadata
      properties:
        loan_code:
          type: string
          description: Mã khoản vay, nhận từ API /partner-update-status
          example: "u8123123Sjsdb"
        phone_number:
          type: string
          description: SĐT của KH (định dạng bắt đầu bằng số 0)
          example: "0xxxxxxxxx"
        redirect_url:
          type: string
          description: URL để đóng webview DOP sau khi KH xác nhận / hủy thanh toán
          example: "https://cake.vn/deeplink?home=app"
        partner_reference_id:
          type: string
          description: ID đơn hàng phía Partner, tạo mới mỗi request (idempotency key)
          example: "bf133c7c-8e10-45a2-b9d2-4d04a352917a"
        payment_amount:
          type: integer
          description: Số tiền đơn hàng KH cần thanh toán (VNĐ)
          example: 5000000
        installment_tenor:
          type: integer
          nullable: true
          description: Kỳ hạn trả góp theo tháng
          example: 3
        metadata:
          $ref: "#/components/schemas/PaymentRequestMetadata"

    PaymentRequestMetadata:
      type: object
      description: Thông tin đơn hàng phía Partner
      required:
        - partner_service_code
        - partner_service_name
        - partner_created_time
        - partner_original_amount
      properties:
        partner_service_code:
          type: string
          description: Mã nhóm dịch vụ / danh mục hàng hóa do Partner cấp
          example: "ELECTRONIC"
        partner_service_name:
          type: string
          description: Tên nhóm dịch vụ / danh mục hàng hóa do Partner cấp
          example: "Điện tử"
        partner_created_time:
          type: string
          format: date-time
          description: Thời gian Partner tạo yêu cầu thanh toán (ISO 8601)
          example: "2026-01-02T09:45:00+07:00"
        partner_original_amount:
          type: integer
          description: Giá trị gốc của đơn hàng trước khuyến mãi (VNĐ)
          example: 5200000
        partner_store_id:
          type: string
          nullable: true
          description: Mã cửa hàng / điểm bán phát sinh giao dịch
          example: "907"
        partner_staff_id:
          type: string
          nullable: true
          description: Mã nhân viên xử lý yêu cầu thanh toán
          example: "87328"
        promotion_code:
          type: string
          nullable: true
          description: Mã khuyến mãi Partner áp dụng cho đơn hàng (chỉ để đối soát, Cake không tính toán)
          example: "SALE10"

    GenerateWebviewPaymentResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              description: Dữ liệu trả về khi khởi tạo yêu cầu thanh toán thành công
              properties:
                webview_url:
                  type: string
                  description: Webview DOP xác nhận thanh toán (token hết hạn sau 5 phút)
                  example: "https://dop.cake.vn/...?token=..."
                order_id:
                  type: string
                  description: Mã tham chiếu giao dịch do Cake tạo ra
                  example: "ORD20260102000001"

    PaymentStatusRequest:
      type: object
      required:
        - loan_code
        - phone_number
        - partner_reference_id
        - order_id
      properties:
        loan_code:
          type: string
          description: Mã khoản vay, nhận từ API /partner-update-status
          example: "u8123123Sjsdb"
        phone_number:
          type: string
          description: SĐT của KH (định dạng bắt đầu bằng số 0), dùng để đối chiếu với loan_code
          example: "0xxxxxxxxx"
        partner_reference_id:
          type: string
          description: partner_reference_id đã truyền ở API /generate-webview/payment-request
          example: "bf133c7c-8e10-45a2-b9d2-4d04a352917a"
        order_id:
          type: string
          description: order_id từ response API /generate-webview/payment-request
          example: "ORD20260102000001"

    PaymentStatusResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              description: Trạng thái giao dịch thanh toán dịch vụ
              properties:
                payment_status:
                  type: string
                  enum:
                    - INIT
                    - IN_PROCESS
                    - HOLD
                    - SUCCESS
                    - FAILED
                    - REVERT
                  description: |
                    Trạng thái giao dịch thanh toán:
                    - `INIT`: Đã tạo yêu cầu, KH chưa xác nhận trong webview
                    - `IN_PROCESS`: KH đã xác nhận, Cake đang xử lý ghi nợ
                    - `HOLD`: Đã ghi nhận giao dịch nhưng lỗi hạch toán, cần đối soát thủ công
                    - `SUCCESS`: Thanh toán thành công
                    - `FAILED`: Thanh toán thất bại, KH hủy hoặc yêu cầu hết hạn
                    - `REVERT`: Giao dịch đã được hoàn tiền qua API /payment-revert
                  example: "SUCCESS"
                installment_status:
                  type: string
                  enum:
                    - NONE
                    - INIT
                    - SUCCESS
                    - FAILED
                  description: |
                    Trạng thái chuyển đổi trả góp của giao dịch (KH chọn trong webview Cake):
                    - `NONE`: Giao dịch không chuyển đổi trả góp
                    - `INIT`: Đã tạo yêu cầu trả góp, đang xử lý
                    - `SUCCESS`: Chuyển đổi trả góp thành công
                    - `FAILED`: Chuyển đổi trả góp thất bại
                  example: "NONE"

    PaymentRevertRequest:
      type: object
      required:
        - loan_code
        - phone_number
        - partner_reference_id
        - order_id
        - revert_amount
      properties:
        loan_code:
          type: string
          description: Mã khoản vay, nhận từ API /partner-update-status
          example: "u8123123Sjsdb"
        phone_number:
          type: string
          description: SĐT của KH (định dạng bắt đầu bằng số 0), dùng để đối chiếu với loan_code
          example: "0xxxxxxxxx"
        partner_reference_id:
          type: string
          description: partner_reference_id đã truyền ở API /generate-webview/payment-request
          example: "bf133c7c-8e10-45a2-b9d2-4d04a352917a"
        order_id:
          type: string
          description: order_id từ response API /generate-webview/payment-request
          example: "ORD20260102000001"
        revert_amount:
          type: integer
          description: Số tiền cần hoàn (VNĐ), phải ≤ số tiền đơn hàng gốc của order_id
          example: 2000000


# ─────────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────────
paths:
  # ════════════════════
  # ONBOARDING (Partner → Cake)
  # ════════════════════
  /generate-webview/onboarding:
    post:
      tags: [ Onboarding ]
      summary: Khởi tạo token & webview cho DOP onboarding
      description: |
        Khởi tạo token cho DOP. Response trả về `webview_url`
        để Partner hiển thị webview onboarding của Cake cho KH.
      operationId: generateWebviewOnboarding
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateWebviewOnboardingRequest"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateWebviewResponse"

  /generate-webview/loan-detail:
    post:
      tags: [ Onboarding ]
      summary: Khởi tạo token & webview cho màn hình chi tiết khoản vay
      description: |
        Khởi tạo token cho Webview loan detail. Response `webview_url`, token hết hạn sau 30 phút.
        KH xem chi tiết khoản vay và chuyển đổi trả góp ngay trong webview Cake.
      operationId: generateWebviewLoanDetail
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateWebviewLoanDetailRequest"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateWebviewResponse"

  # ════════════════════
  # LOAN INFO (Partner → Cake)
  # ════════════════════
  /get-loan-detail:
    post:
      tags: [ Loan Info ]
      summary: Truy vấn thông tin chi tiết khoản vay
      description: |
        Trả về trạng thái hồ sơ, hạn mức được duyệt, dư nợ và kỳ thanh toán của khoản vay.
        Chỉ truy vấn được sau khi hồ sơ đã được phê duyệt (`LOAN_APPROVE` trở đi);
        `loan_code` và `phone_number` phải khớp nhau, nếu không trả `400001`.
      operationId: getLoanDetail
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetLoanDetailRequest"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetLoanDetailResponse"

  # ════════════════════
  # PAYMENT (Partner → Cake)
  # ════════════════════
  /generate-webview/payment-request:
    post:
      tags: [ Payment ]
      summary: Khởi tạo token & webview xác nhận thanh toán
      description: |
        Khởi tạo yêu cầu thanh toán dịch vụ và trả `webview_url` để KH xác nhận trong webview Cake
        (nhập OTP, chọn trả góp nếu có). Token hết hạn sau 5 phút.

        `partner_reference_id` phải là duy nhất mỗi đơn hàng.
        Sau khi webview redirect về `redirect_url`, Partner **phải** gọi `/payment-status`
        với `order_id` để lấy kết quả cuối cùng, không dựa vào redirect.
      operationId: generateWebviewPaymentRequest
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateWebviewPaymentRequestBody"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateWebviewPaymentResponse"

  /payment-status:
    post:
      tags: [ Payment ]
      summary: Truy vấn trạng thái giao dịch thanh toán dịch vụ
      description: |
        Lấy kết quả cuối cùng của giao dịch tạo bởi `/generate-webview/payment-request`.
        Partner **phải** gọi API này sau khi webview redirect để xác nhận kết quả,
        không dựa vào tham số trên redirect_url.

        Trạng thái `INIT` / `IN_PROCESS` là chưa kết thúc — Partner gọi lại đến khi ra
        `SUCCESS` / `FAILED`. Trạng thái `HOLD` cần đối soát thủ công với Cake.
      operationId: paymentStatus
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentStatusRequest"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentStatusResponse"

  /payment-revert:
    post:
      tags: [ Payment ]
      summary: Yêu cầu hoàn tiền giao dịch thanh toán dịch vụ
      description: |
        Hoàn tiền một phần hoặc toàn bộ giao dịch đã `SUCCESS`.
        `revert_amount` không vượt quá số tiền đơn hàng gốc của `order_id`.
        Giao dịch hoàn tất chuyển sang trạng thái `REVERT` khi tra qua `/payment-status`.

        Chỉ hoàn được giao dịch ở trạng thái `SUCCESS`; các trạng thái khác trả lỗi.
      operationId: paymentRevert
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentRevertRequest"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"

  # ════════════════════
  # PARTNER CALLBACKS (Cake → Partner)
  # ════════════════════
  /partner-update-status:
    post:
      tags: [ Partner Callbacks ]
      summary: Cake cập nhật trạng thái hồ sơ sang Partner
      description: |
        **Chiều: Cake → Partner**
        Cake chủ động gọi API này trên hệ thống đối tác để thông báo thay đổi trạng thái hồ sơ.
        Partner cần expose endpoint này, yêu cầu path là */partner-update-status.
      operationId: partnerUpdateStatus
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerUpdateStatusRequest"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerCallbackResponse"

tags:
  - name: Onboarding
    description: |
      Luồng onboarding & liên kết tài khoản qua DOP webview:
      generate-webview/onboarding → (KH onboarding trong webview Cake) → partner-update-status
      Bao gồm cả generate-webview/loan-detail (webview chi tiết khoản vay & trả góp).
  - name: Loan Info
    description: get-loan-detail
  - name: Payment
    description: |
      Thanh toán dịch vụ qua webview Cake:
      generate-webview/payment-request → (KH xác nhận trong webview) → payment-status → payment-revert (nếu cần)
  - name: Partner Callbacks
    description: |
      API Cake gọi sang Partner (webhook/callback). Partner phải expose các endpoint này.
      Xác thực ngược chiều (Cake ký, Partner verify).

# ─────────────────────────────────────────────
# SEQUENCE DIAGRAMS - API FLOWS (x-extension)
# ─────────────────────────────────────────────
x-mermaid-flows:

  onboarding: |
    sequenceDiagram
      autonumber
      participant Cl as Client
      participant P as Partner
      participant C as Cake

      Note over Cl,C: ONBOARDING & LINK ACCOUNT
      Cl->>P: Access entry point, confirm T&C
      Note over P: Tap NFC (SDK), thu nfc_data
      P->>C: generate-webview/onboarding(partner_reference_id, phone_number, metadata, nfc_data)
      C-->>P: Response webview_url
      P-->>Cl: Display Cake DOP webview cho customer
      Cl->>C: Submit loan application & sign contract (trong webview)

      Note over C,P: Cake callback cập nhật trạng thái
      C->>P: partner-update-status(request_id, partner_reference_id, loan_code, status)
      P-->>C: Response (success, code, message)
      P-->>Cl: Update link status to customer

      Note over C,P: GIẢI NGÂN
      C->>P: partner-update-status (LOAN_ACTIVE)
      P-->>C: Response

  loan_info: |
    sequenceDiagram
      autonumber
      participant Cl as Client
      participant P as Partner
      participant C as Cake

      Note over Cl,C: LOAN INFO (API)
      Cl->>P: View loan info
      P->>C: get-loan-detail(loan_code, phone_number)
      C-->>P: loan_account_status, approved_amount, balances, due_date...
      P-->>Cl: Show loan information

      Note over Cl,C: LOAN DETAIL (WEBVIEW)
      Cl->>P: Request view loan detail
      P->>C: generate-webview/loan-detail(loan_code, phone_number, redirect_url)
      C-->>P: Response webview_url
      P-->>Cl: Show webview chi tiết khoản vay
      Cl->>C: Access & submit Installment (trong webview Cake)
      C-->>Cl: Display kết quả trả góp

  payment: |
    sequenceDiagram
      autonumber
      participant Cl as Client
      participant P as Partner
      participant C as Cake

      Note over Cl,C: SPENDING
      Cl->>P: Service spending
      P->>C: generate-webview/payment-request(loan_code, partner_reference_id, payment_amount, installment_tenor, metadata)
      C-->>P: webview_url, order_id
      P-->>Cl: Show webview xác nhận thanh toán
      Cl->>C: Nhập OTP & confirm transaction (trong webview)
      Note over C: Validate & redirect
      C-->>P: Redirect về redirect_url
      Note over P: Catch redirect event, đóng webview

      Note over P,C: VERIFY KẾT QUẢ (bắt buộc)
      P->>C: payment-status(loan_code, phone_number, partner_reference_id, order_id)
      C-->>P: payment_status, installment_status
      P-->>Cl: Response transaction result

      Note over Cl,C: REVERT (nếu cần)
      Cl->>P: Request revert
      P->>C: payment-revert(loan_code, partner_reference_id, order_id, revert_amount)
      C-->>P: Response revert result
      P-->>Cl: Send notification to customer
