    ClientUpdateRequest:
      type: object
      required:
        - request_id
        - phone_number
        - document_id
        - selfie_image_url
      properties:
        request_id:
          type: string
          description: request_id trả về từ client-create
          example: "req-abc123"
        phone_number:
          type: string
          description: Số điện thoại KH (bắt đầu bằng số 0)
          example: "0xxxxxxxxx"
        document_id:
          type: string
          description: Số CCCD/CMND
          example: "xxxxxxxxxxxx"
        selfie_image_url:
          type: string
          format: uri
          description: "URL ảnh selfie (ảnh dọc, tối đa 1MB). Required cho cả KH mới và KH đã có hồ sơ (dùng để face-auth). Cake tải ảnh về từ URL này để xử lý"
          example: "https://cdn.partner.example/ekyc/selfie-abc123.jpg"
        front_nid_image_url:
          type: string
          format: uri
          nullable: true
          description: "URL ảnh CCCD mặt trước (ảnh ngang, tối đa 1MB). Required khi is_exists=false (KH mới)"
          example: "https://cdn.partner.example/ekyc/front-abc123.jpg"
        back_nid_image_url:
          type: string
          format: uri
          nullable: true
          description: "URL ảnh CCCD mặt sau (ảnh ngang, tối đa 1MB). Required khi is_exists=false (KH mới)"
          example: "https://cdn.partner.example/ekyc/back-abc123.jpg"
        nfc_data:
          type: object
          nullable: true
          description: |
            NFC data raw. Bản thân `nfc_data` là optional (required khi BRD của sản phẩm yêu cầu),
            nhưng khi đã truyền thì **tất cả field bên trong đều required**.
          required:
            - sod
            - dg1
            - dg2
            - dg13
            - dg14
            - dg15
            - com
          properties:
            sod:
              type: string
              description: NFC SOD value
            dg1:
              type: string
              description: NFC data group 1
            dg2:
              type: string
              description: NFC data group 2
            dg13:
              type: string
              description: NFC data group 13
            dg14:
              type: string
              description: NFC data group 14
            dg15:
              type: string
              description: NFC data group 15
            com:
              type: string
              description: NFC COM data

    ClientUpdateResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                status:
                  type: string
                  description: |
                    Trạng thái eKYC:
                    - EKYC_PENDING: Đang chờ duyệt thủ công (không có callback)
                    - EKYC_REJECT: Bị từ chối
                    - EKYC_SUCCESS: Thành công → gọi loan-register
                  enum:
                    - EKYC_PENDING
                    - EKYC_REJECT
                    - EKYC_SUCCESS
                  example: EKYC_SUCCESS

    GetOnboardingStatusRequest:
      type: object
      required:
        - request_id
        - phone_number
      properties:
        request_id:
          type: string
          description: request_id trả về từ client-create
          example: "req-abc123"
        phone_number:
          type: string
          description: Số điện thoại KH (bắt đầu bằng số 0)
          example: "0xxxxxxxxx"

    GetOnboardingStatusResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              required:
                - onboarding_status
              properties:
                onboarding_status:
                  type: string
                  description: |
                    Bước onboarding xa nhất mà hồ sơ đã hoàn tất:
                    - `ONBOARDING_CREATE`: đã gọi /client-create thành công
                    - `ONBOARDING_UPDATE`: đã gọi /client-update thành công và eKYC đạt (`ekyc_status=EKYC_SUCCESS`)
                    - `ONBOARDING_REGISTER`: đã gọi /loan-register thành công và khoản vay đã có kết quả duyệt hoặc từ chối

                    Hồ sơ đã gọi /client-update nhưng eKYC chưa đạt (`EKYC_PENDING`) hoặc trượt (`EKYC_REJECT`)
                    vẫn giữ `ONBOARDING_CREATE` — đọc `ekyc_status` để biết chi tiết.
                  enum:
                    - ONBOARDING_CREATE
                    - ONBOARDING_UPDATE
                    - ONBOARDING_REGISTER
                  example: ONBOARDING_UPDATE
                ekyc_status:
                  type: string
                  nullable: true
                  description: Trạng thái eKYC. Chỉ trả về khi đã gọi /client-update thành công, ngược lại là null.
                  enum:
                    - EKYC_PENDING
                    - EKYC_REJECT
                    - EKYC_SUCCESS
                  example: EKYC_SUCCESS
                loan_code:
                  type: string
                  nullable: true
                  description: Mã khoản vay. Chỉ trả về khi đã gọi /loan-register thành công, ngược lại là null.
                  example: "u8123123Sjsdb"
                loan_status:
                  type: string
                  nullable: true
                  description: Trạng thái khoản vay (giá trị như `loan_account_status` của /get-loan-detail).
                    Chỉ trả về khi đã gọi /loan-register thành công, ngược lại là null.
                  enum:
                    - LOAN_INIT
                    - LOAN_REVIEWING
                    - LOAN_REJECT
                    - LOAN_APPROVE
                    - LOAN_EXPIRED
                    - LOAN_CANCEL
                    - LOAN_SIGNED
                    - LOAN_ACTIVE
                    - LOAN_CLOSE
                  example: LOAN_APPROVE

    LoanRegisterRequest:
      type: object
      required:
        - request_id
        - phone_number
      properties:
        request_id:
          type: string
          description: request_id trả về từ client-create
          example: "req-abc123"
        phone_number:
          type: string
          description: Số điện thoại KH (bắt đầu bằng số 0)
          example: "0xxxxxxxxx"

    LoanRegisterResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                status:
                  type: string
                  description: |
                    - LOAN_REVIEWING: Đang chờ phê duyệt → chờ callback
                    - LOAN_REJECT: Bị từ chối (đăng ký lại sau 7 ngày)
                    - LOAN_CANCEL: Bị hủy (đăng ký lại ngay)
                    - LOAN_APPROVE: Đã phê duyệt → gọi get-esign
                  enum:
                    - LOAN_REVIEWING
                    - LOAN_REJECT
                    - LOAN_CANCEL
                    - LOAN_APPROVE
                loan_code:
                  type: string
                  nullable: true
                  description: Mã khoản vay. null nếu REJECT
                  example: "u8123123Sjsdb"

    GetEsignRequest:
      type: object
      required:
        - loan_code
        - phone_number
      properties:
        loan_code:
          type: string
          description: Mã khoản vay từ loan-register hoặc callback partner-update-status
          example: "u8123123Sjsdb"
        phone_number:
          type: string
          description: Số điện thoại KH (bắt đầu bằng số 0)
          example: "0xxxxxxxxx"

    GetEsignResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                url:
                  type: string
                  description: URL hợp đồng HTML (hết hạn trong ngày)
                  example: "https://esign.cake.vn/..."
                url_pdf:
                  type: string
                  description: URL hợp đồng PDF (hết hạn trong ngày)
                  example: "https://esign.cake.vn/....pdf"
                expired_time:
                  type: string
                  format: date
                  description: Ngày hết hạn hợp đồng (yyyy-mm-dd)
                  example: "2025-12-12"

    GetOtpRequest:
      type: object
      required:
        - loan_code
        - phone_number
      properties:
        loan_code:
          type: string
          description: Mã khoản vay từ loan-register hoặc callback partner-update-status
          example: "u8123123Sjsdb"
        phone_number:
          type: string
          description: Số điện thoại KH (bắt đầu bằng số 0)
          example: "0xxxxxxxxx"

    GetOtpResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                blocked:
                  type: boolean
                  description: true nếu OTP đang bị chặn (phải chờ 15 phút)
                  example: false
                contract_is_rejected:
                  type: boolean
                  description: true nếu hợp đồng bị từ chối → cần bắt đầu lại flow
                  example: false
                otp_count:
                  type: string
                  description: Số lần OTP đã gửi
                  example: "1"
                otp_period:
                  type: integer
                  description: Thời gian cooldown OTP (phút). Trả về 1 khi < 3
                  example: 2

    VerifyEsignRequest:
      type: object
      required:
        - loan_code
        - phone_number
        - otp
      properties:
        loan_code:
          type: string
          description: Mã khoản vay từ loan-register hoặc callback partner-update-status
          example: "u8123123Sjsdb"
        phone_number:
          type: string
          description: Số điện thoại KH (bắt đầu bằng số 0)
          example: "0xxxxxxxxx"
        otp:
          type: string
          description: OTP KH nhập vào
          example: "123456"

    VerifyEsignResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                is_correct_otp:
                  type: boolean
                  description: "true nếu OTP đúng, false nếu sai"
                  example: true
                verify_count:
                  type: integer
                  description: Số lần gọi verify-esign
                  example: 1

    ContractCancelRequest:
      type: object
      required:
        - loan_code
        - phone_number
      properties:
        loan_code:
          type: string
          description: Mã khoản vay từ loan-register hoặc callback partner-update-status
          example: "u8123123Sjsdb"
        phone_number:
          type: string
          description: Số điện thoại KH (bắt đầu bằng số 0)
          example: "0xxxxxxxxx"

    GetLoanDetailRequest:
      type: object
      required:
        - loan_code
        - phone_number
      properties:
        loan_code:
          type: string
          description: Mã khoản vay từ loan-register hoặc callback partner-update-status
          example: "u8123123Sjsdb"
        phone_number:
          type: string
          description: Số điện thoại KH (bắt đầu bằng số 0)
          example: "0xxxxxxxxx"

    GetLoanDetailResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              description: Thông tin chi tiết khoản vay
              properties:
                loan_account_status:
                  type: string
                  description: Trạng thái tài khoản vay
                  enum:
                    - LOAN_INIT
                    - LOAN_REVIEWING
                    - LOAN_REJECT
                    - LOAN_APPROVE
                    - LOAN_EXPIRED
                    - LOAN_CANCEL
                    - LOAN_SIGNED
                    - LOAN_ACTIVE
                    - LOAN_CLOSE
                contract_id:
                  type: string
                  description: Mã hợp đồng (dùng cho nhắc nợ, đối soát)
                  example: "1234567890"
                loan_alias:
                  type: string
                  description: Mã thanh toán
                  example: "G4JH5R"
                contract_url:
                  type: string
                  description: URL hợp đồng đã ký song phương (hết hạn trong 1 giờ)
                  example: "https://storage.googleapis.com/..."
                full_name:
                  type: string
                  description: Họ tên KH lưu tại Cake
                  example: "Nguyễn Hoàng Sơn"
                document_id:
                  type: string
                  description: Số CCCD/CMND
                  example: "xxxxxxxxxxxx"
                approved_amount:
                  type: string
                  description: Số tiền được phê duyệt (VNĐ)
                  example: "12000000"
                approved_term:
                  type: string
                  description: Thời hạn vay (ngày)
                  example: "30"
                loan_insurance:
                  type: string
                  description: Số tiền bảo hiểm (VNĐ)
                  example: "840000"
                disburse_amount:
                  type: string
                  description: Số tiền đã giải ngân (VNĐ)
                  example: "12840000"
                disburse_date:
                  type: string
                  format: date
                  description: Ngày giải ngân (yyyy-mm-dd)
                  example: "2025-06-03"
                interest_rate:
                  type: string
                  description: Lãi suất (%)
                  example: "43"
                principle_balance:
                  type: string
                  description: Dư nợ gốc còn lại (VNĐ)
                  example: "12640000"
                interest_balance:
                  type: string
                  description: Dư nợ lãi phát sinh (VNĐ)
                  example: "197494"
                penalty_principal_balance:
                  type: string
                  description: Lãi phạt gốc quá hạn (VNĐ)
                  example: "2494265"
                penalty_interest_balance:
                  type: string
                  description: Lãi phạt lãi quá hạn (VNĐ)
                  example: "0"
                due_date:
                  type: string
                  format: date
                  description: Ngày đến hạn thanh toán gần nhất (yyyy-mm-dd), đã bao gồm holiday nếu có
                  example: "2025-06-27"
                day_arrears:
                  type: string
                  description: Số ngày quá hạn
                  example: "191"
                total_payment_amount:
                  type: string
                  description: Tổng tiền KH có thể thanh toán (VNĐ)
                  example: "15331759"

    RepaymentRequestBody:
      type: object
      required:
        - loan_code
        - phone_number
        - partner_reference_id
        - payment_amount
      properties:
        loan_code:
          type: string
          description: Mã khoản vay
          example: "u8123123Sjsdb"
        phone_number:
          type: string
          description: Số điện thoại KH (bắt đầu bằng số 0)
          example: "0xxxxxxxxx"
        partner_reference_id:
          type: string
          description: ID tạo mới mỗi request (idempotency key). Trùng → lỗi 400000
          example: "pay-ref-001"
        payment_amount:
          type: integer
          description: Số tiền thanh toán (VNĐ)
          example: 5000000

    RepaymentRequestResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                order_id:
                  type: string
                  description: Mã tham chiếu giao dịch do Cake tạo ra
                  example: "ORD-20250603-001"

    RepaymentConfirmRequest:
      type: object
      required:
        - loan_code
        - phone_number
        - partner_reference_id
        - order_id
        - payment_amount
      properties:
        loan_code:
          type: string
          description: Mã khoản vay
          example: "u8123123Sjsdb"
        phone_number:
          type: string
          description: Số điện thoại KH (bắt đầu bằng số 0)
          example: "0xxxxxxxxx"
        partner_reference_id:
          type: string
          description: partner_reference_id từ API /repayment-request
          example: "pay-ref-001"
        order_id:
          type: string
          description: order_id từ API /repayment-request
          example: "ORD-20250603-001"
        payment_amount:
          type: integer
          description: Số tiền thanh toán (VNĐ)
          example: 5000000

    # ── Disburse ──
    DisburseUpdateRequest:
      type: object
      required:
        - loan_code
        - phone_number
        - partner_disburse_status
      properties:
        loan_code:
          type: string
          description: Mã khoản vay
          example: "u8123123Sjsdb"
        phone_number:
          type: string
          description: Số điện thoại KH (bắt đầu bằng số 0)
          example: "0xxxxxxxxx"
        partner_disburse_status:
          type: integer
          description: "Trạng thái giải ngân: 1=Thành công, 2=Thất bại"
          enum: [ 1, 2 ]
          example: 1

    # ── Cake → VDS: request ──
    VdsRequestEnvelope:
      type: object
      description: Phần bao chung của mọi request Cake gửi sang VDS
      required:
        - timestamp
        - requestId
        - data
      properties:
        timestamp:
          type: string
          description: |
            Thời điểm khởi tạo request, ISO-8601 `yyyy-MM-dd'T'HH:mm:ssXXX`, timezone +07:00.
            Hiệu lực 5 phút — lệch quá sẽ bị VDS từ chối với mã `416`.
          example: "2026-09-14T10:15:00+07:00"
        requestId:
          type: string
          description: UUID duy nhất cho mỗi request, VDS dùng để idempotency. Retry giữ nguyên giá trị cũ.
          example: "7b2e9a1f8c3d4b5a6e7f8d9c0b1a2e3f"

    PartnerDisburseRequest:
      allOf:
        - $ref: "#/components/schemas/VdsRequestEnvelope"
        - type: object
          properties:
            data:
              type: object
              required:
                - loanCode
                - identityNumber
                - disburseAmount
              properties:
                loanCode:
                  type: string
                  description: Mã khoản vay phía Cake, sinh từ API loan-register
                  example: "u8123123Sjsdb"
                fullName:
                  type: string
                  description: Họ tên khách hàng
                  example: "NGUYEN VAN A"
                identityNumber:
                  type: string
                  description: Số giấy tờ tùy thân
                  example: "001090012345"
                disburseAmount:
                  type: integer
                  description: Số tiền giải ngân thực tế (VND)
                  example: 9500000
                loanAmount:
                  type: integer
                  description: Số tiền được phê duyệt trên hợp đồng (VND)
                  example: 10000000
                bankCode:
                  type: string
                  description: Mã ngân hàng (Napas)
                  example: "970415"
                accountNumber:
                  type: string
                  description: Số tài khoản nhận tiền
                  example: "19034567890012"
                tenor:
                  type: integer
                  description: Kỳ hạn vay
                  example: 12

    PartnerDisburseRequestResponse:
      allOf:
        - $ref: "#/components/schemas/VdsBaseResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                transactionId:
                  type: string
                  description: ID giao dịch giải ngân trên hệ thống VDS
                  example: "0d68bc41-fa57-4d62-946e-1473fba6728c"
                vdsLoanId:
                  type: string
                  description: ID khoản vay trên hệ thống VDS
                  example: "01GXBSD72R12GF113GX8JS81D5"

    PartnerDisburseStatusRequest:
      allOf:
        - $ref: "#/components/schemas/VdsRequestEnvelope"
        - type: object
          properties:
            data:
              type: object
              required:
                - loanCode
              properties:
                loanCode:
                  type: string
                  description: Mã khoản vay phía Cake, sinh từ API loan-register
                  example: "u8123123Sjsdb"

    PartnerDisburseStatusResponse:
      allOf:
        - $ref: "#/components/schemas/VdsBaseResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                transactionId:
                  type: string
                  description: ID giao dịch giải ngân trên hệ thống VDS
                  example: "1234567890"
                vdsLoanId:
                  type: string
                  description: ID khoản vay trên hệ thống VDS
                  example: "01GXBSD72R12GF113GX8JS81D5"
                partnerTransactionId:
                  type: string
                  description: ID giao dịch giải ngân do hệ thống đối tác request
                status:
                  type: string
                  description: |
                    - `SUCCESS`: Đã giải ngân thành công
                    - `FAILED`: Giải ngân thất bại — xem `subStatus`
                    - `PROCESSING`: Đang xử lý, truy vấn lại sau 15 phút nếu chưa được thông báo kết quả
                    - `TIMEOUT`: Quá thời gian xử lý, chờ đối soát. VDS chủ động báo khi có kết quả cuối
                  enum:
                    - SUCCESS
                    - FAILED
                    - PROCESSING
                    - TIMEOUT
                  example: "SUCCESS"
                subStatus:
                  type: string
                  description: "Trạng thái chi tiết, chỉ trả khi `status = FAILED` (xem bảng sub-status `DIS00xx`)"
                  example: "DIS0004"
                disbursementAmount:
                  type: integer
                  description: Số tiền giải ngân
                  example: 5000000
                bankCode:
                  type: string
                  description: Mã ngân hàng
                  example: "MB"
                accountNumber:
                  type: string
                  description: Số tài khoản
                  example: "1234567890"
                accountName:
                  type: string
                  description: Tên tài khoản
                  example: "NGUYEN VAN A"

    PartnerGetStatusRequest:
      allOf:
        - $ref: "#/components/schemas/VdsRequestEnvelope"
        - type: object
          properties:
            data:
              type: object
              required:
                - loanCode
                - identityNumber
              properties:
                loanCode:
                  type: string
                  description: Mã khoản vay phía Cake, sinh từ API loan-register
                  example: "LOAN_123456789"
                identityNumber:
                  type: string
                  description: Số GTTT
                  example: "001090012345"

    PartnerGetStatusResponse:
      allOf:
        - $ref: "#/components/schemas/VdsBaseResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                vdsLoanId:
                  type: string
                  description: ID khoản vay trên hệ thống VDS
                  example: "VDS-99887766"
                status:
                  type: string
                  description: |
                    Trạng thái khoản vay trên hệ thống VDS (không map sang `LOAN_*` của Cake):
                    `INIT`, `SUBMIT`, `PENDING_UNDERWRITING`, `APPROVAL`, `REJECTED`, `PENDING_ESIGNING`,
                    `PENDING_DISBURSEMENT`, `DISBURSED`, `DISBURSE_FAIL`, `DISBURSE_TIMEOUT`,
                    `OVER_DUE`, `CLOSED`, `CANCELLED`
                  example: "APPROVAL"
                loanAmount:
                  type: integer
                  description: Số tiền vay (VND)
                  example: 20000000
                tenor:
                  type: integer
                  description: Kỳ hạn vay
                  example: 12

    # ── Callback ──
    PartnerUpdateStatusRequest:
      allOf:
        - $ref: "#/components/schemas/VdsRequestEnvelope"
        - type: object
          properties:
            data:
              type: object
              required:
                - partnerReferenceId
                - status
              properties:
                partnerReferenceId:
                  type: string
                  description: Reference ID VDS sinh, Cake nhận từ API check-profile
                  example: "01JAQ7Z8M4K2N5P6R7S8T9V0W1"
                loanCode:
                  type: string
                  description: |
                    Mã khoản vay phía Cake, sinh từ API loan-register.
                    **Bắt buộc** với mọi status trừ `LOAN_REJECT` (hồ sơ bị từ chối trước bước loan-register nên chưa có `loanCode`).
                  example: "u8123123Sjsdb"
                phoneNumber:
                  type: string
                  description: Số điện thoại KH, đầu số 0
                  example: "0987654321"
                status:
                  type: string
                  description: |
                    - `LOAN_APPROVE`: Đã phê duyệt
                    - `LOAN_REJECT`: Bị từ chối (đăng ký lại sau 7 ngày)
                    - `LOAN_CANCEL`: Bị hủy (đăng ký lại ngay)
                    - `LOAN_EXPIRED`: Hết hạn sau 7 ngày chưa ký
                    - `LOAN_SIGNED`: KH đã ký hợp đồng
                    - `LOAN_ACTIVE`: Giải ngân thành công
                    - `LOAN_CLOSE`: Khoản vay đã tất toán
                  enum:
                    - LOAN_APPROVE
                    - LOAN_REJECT
                    - LOAN_CANCEL
                    - LOAN_EXPIRED
                    - LOAN_SIGNED
                    - LOAN_ACTIVE
                    - LOAN_CLOSE
                statusReasonCode:
                  type: string
                  description: "Lý do thay đổi trạng thái. Không bắt buộc ở mọi status. Chuỗi tự do do Cake định nghĩa; VDS chỉ lưu để tra cứu, không kiểm tra giá trị"

    PartnerUpdateStatusResponse:
      allOf:
        - $ref: "#/components/schemas/VdsBaseResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                appId:
                  type: string
                  description: ID khoản vay trên hệ thống VDS
                  example: "xxxxxxx"
                status:
                  type: string
                  description: Trạng thái khoản vay trên hệ thống VDS
                  example: "REJECTED"

# ─────────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────────
paths:
  # ════════════════════
  # PHASE 1 — PRECHECK
  # ════════════════════
  /data-config:
    post:
      tags: [Phase 1 - Precheck]
      summary: Lấy danh sách cấu hình form onboarding
      description: |
        Trả về value list dùng để render form onboarding: tỉnh/thành, quận/huyện, phường/xã,
        giới tính, hôn nhân, nghề nghiệp, chức vụ, mối quan hệ, mục đích vay.

        Gọi sau khi KH nhập thông tin cơ bản và trước khi gọi client-create.
        **Không cần request body.**
      operationId: dataConfig
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Không cần body
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataConfigResponse"

  /check-profile:
    post:
      tags: [Phase 1 - Precheck]
      summary: Kiểm tra điều kiện trước khi mở khoản vay
      description: |
        Kiểm tra điều kiện hợp lệ trước khi tạo hồ sơ.

        **Điều kiện tiếp tục:** `code=1` AND `reject_code=null`

        Field `is_exists` cho biết KH đã có hồ sơ tại Cake chưa:
        - `true`: KH đã tồn tại → client-update chỉ cần selfie (face-auth)
        - `false`: KH mới → client-update cần ảnh CCCD mặt trước, mặt sau và NFC

        Request phải truyền `metadata.non_viettel` (`true` = ngoại mạng, `false` = nội mạng) — Cake dùng giá trị này
        để tính `is_repeated` trong response: KH mới (New) hay KH cũ (Repeat) của sản phẩm PD_Viettel,
        xét lịch sử khoản vay `status=CLOSE` **cùng giá trị `non_viettel`**.
        Chi tiết rule xem mô tả field trong response.
      operationId: checkProfile
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckProfileRequest"
            example:
              phone_number: "0345678900"
              partner_reference_id: "bf133c7c-8e10-45a2-b9d2-4d04a352917a"
              full_name: "TRAN MINH TIEN"
              document_id: "075099093845"
              date_of_birth: "1999-12-02"
              metadata:
                non_viettel: false
                partner_score: "350-399"
                partner_fraud_score: "300-350"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckProfileResponse"
              example:
                success: true
                code: 1
                message: "Thành công"
                response_id: "849KTQG7SQWLWQW5"
                timestamp: "2025-12-11T09:45:00+07:00"
                data:
                  reject_code: null
                  reject_message: null
                  challenge_level: [1]
                  challenge_id: "7b9e0d4f-3c4a-4e7c-9b92-92e6d5dcd781"
                  is_exists: false
                  is_repeated: false

  # ════════════════════════════════════════
  # PHASE 2 — ONBOARDING (eKYC & Loan)
  # ════════════════════════════════════════
  /client-create:
    post:
      tags: [Phase 2 - Onboarding]
      summary: Tạo hồ sơ KH sau precheck
      description: |
        Tạo hồ sơ KH sau khi precheck thành công.

        **Điều kiện tiếp tục:** `request_id != null` → gọi client-update.

        Lưu ý: `job_title` chỉ required khi `occupation=1` (nhân viên VP/công chức).
      operationId: clientCreate
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientCreateRequest"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientCreateResponse"
              example:
                success: true
                code: 1
                message: "Thành công"
                response_id: "849KTQG7SQWLWQW5"
                timestamp: "2025-12-11T09:45:00+07:00"
                data:
                  request_id: "req-abc123"

  /client-update:
    post:
      tags: [Phase 2 - Onboarding]
      summary: Cập nhật hồ sơ và upload ảnh eKYC
      description: |
        Gửi **URL ảnh** selfie, CCCD mặt trước/sau và NFC data.
        Đối tác host ảnh và truyền URL; Cake tải ảnh về từ URL đó rồi xử lý — không truyền base64.

        **Điều kiện tiếp tục:** `status=EKYC_SUCCESS` → gọi loan-register.

        Nếu `status=EKYC_PENDING`: không có callback, chờ xử lý thủ công bởi Cake.

        **Lưu ý về ảnh:**
        - `selfie_image_url`: **Required** cho mọi KH (dùng để xác thực khuôn mặt)
        - `front_nid_image_url` và `back_nid_image_url`: **Required** khi `is_exists=false` (KH mới), optional khi KH đã có hồ sơ
        - URL phải truy cập được từ hệ thống Cake (public hoặc pre-signed), còn hiệu lực tối thiểu 24h kể từ khi gọi API
        - `nfc_data`: Optional ở mức object (required khi BRD yêu cầu); khi đã truyền thì `sod`, `dg1`, `dg2`, `dg13`, `dg14`, `dg15`, `com` **đều required**
      operationId: clientUpdate
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdateRequest"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientUpdateResponse"
              example:
                success: true
                code: 1
                message: "Thành công"
                response_id: "849KTQG7SQWLWQW5"
                timestamp: "2025-12-11T09:45:00+07:00"
                data:
                  status: "EKYC_SUCCESS"

  /get-onboarding-status:
    post:
      tags: [Phase 2 - Onboarding]
      summary: Truy vấn tiến độ onboarding của hồ sơ
      description: |
        Trả về bước onboarding xa nhất hồ sơ đã hoàn tất (`onboarding_status`), kèm trạng thái eKYC
        và thông tin khoản vay nếu đã có.

        Dùng để poll khi `/client-update` trả `EKYC_PENDING`, hoặc khi partner mất trạng thái
        (app bị kill, mất mạng) và cần biết hồ sơ đang ở đâu để đi tiếp.
      operationId: getOnboardingStatus
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetOnboardingStatusRequest"
            example:
              request_id: "req-abc123"
              phone_number: "0345678900"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetOnboardingStatusResponse"
              example:
                success: true
                code: 1
                message: "Thành công"
                response_id: "849KTQG7SQWLWQW5"
                timestamp: "2025-12-11T09:45:00+07:00"
                data:
                  onboarding_status: "ONBOARDING_REGISTER"
                  ekyc_status: "EKYC_SUCCESS"
                  loan_code: "u8123123Sjsdb"
                  loan_status: "LOAN_APPROVE"

  /loan-register:
    post:
      tags: [Phase 2 - Onboarding]
      summary: Đăng ký khoản vay mới
      description: |
        Đăng ký khoản vay sau khi eKYC thành công.

        **Điều kiện tiếp tục:**
        - Nếu `status=LOAN_APPROVE` → gọi get-esign ngay
        - Nếu `status=LOAN_REVIEWING` → chờ callback partner-update-status
      operationId: loanRegister
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanRegisterRequest"
            example:
              request_id: "req-abc123"
              phone_number: "0345678900"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanRegisterResponse"
              example:
                success: true
                code: 1
                message: "Thành công"
                response_id: "849KTQG7SQWLWQW5"
                timestamp: "2025-12-11T09:45:00+07:00"
                data:
                  status: "LOAN_REVIEWING"
                  loan_code: "u8123123Sjsdb"

  # ════════════════════
