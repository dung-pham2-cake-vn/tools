info:
  title: Viettel Payday - Native API
  description: |
    ## Mô tả
    API tích hợp giữa đối tác (Partner) và Cake Digital Bank cho sản phẩm **Payday**, theo mô hình Native API.

    ## Changelog

    | Thời gian | Email title | Cập nhật |
    |-----------|-------|-------|
    | 2026-08-10 | [VDS-CAKE] API SPEC SẢN PHẨM PAYDAY NATIVE | Khởi tạo tài liệu |
    | 2026-08-19 | [VDS-CAKE] API SPEC SẢN PHẨM PAYDAY NATIVE | Bổ sung 3 API disburse |
    | 2026-09-16 | [VDS-CAKE] API SPEC SẢN PHẨM PAYDAY NATIVE | Bổ sung API `/get-onboarding-status`; `client-update` đổi 3 ảnh base64 sang `*_image_url` (đối tác host ảnh, Cake tải về); `check-profile` bổ sung input `metadata.non_viettel` và output `is_repeated`; `nfc_data` chốt required cho toàn bộ field bên trong |
    | 2026-09-17 | [VDS-CAKE] API SPEC SẢN PHẨM PAYDAY NATIVE | Bỏ API `/get-loan-code-from-loan-id` (tag `Legacy Support`); đổi cơ chế ký từ RSA 1024 bit sang **RSA 2048 bit**; `/partner-disburse-request` bỏ field `partner_disburse_status` |
    | 2026-09-18 | [VDS-CAKE] API SPEC SẢN PHẨM PAYDAY NATIVE | Đồng bộ nhóm API Cake → VDS theo tài liệu VDS-LP-PAYDAY-CAKE-001 v1.0: body bọc `timestamp` + `requestId` + `data{}` camelCase, response `code` dạng chuỗi (`000` = thành công), cơ chế ký riêng (sort key alphabet đệ quy, không nối `partner_key`), header `apikey`; `partner-disburse-request` bỏ `partner_reference_id`/`loan_insurance`, bổ sung `identityNumber`; `partner-disburse-status` bổ sung `PROCESSING`/`TIMEOUT` + `subStatus`; bổ sung API `/applications/status`, bảng mã lỗi VDS và sub-status `DIS00xx` |
    | 2026-09-22 | [VDS-CAKE] API SPEC SẢN PHẨM PAYDAY NATIVE | Đồng bộ theo VDS-LP-PAYDAY-CAKE-001 v1.1: đổi `/applications/status` thành `/partner-get-status`; `/partner-update-status` — `loanCode` không bắt buộc khi `LOAN_REJECT`, `statusReasonCode` là chuỗi tự do không bắt buộc; chốt quy tắc chuẩn hoá chuỗi ký Cake → VDS (compact, UTF-8 không escape, giữ `null`, giữ kiểu số, sort key đệ quy); sửa `PARTNER_IP_ADDRESS` thành IP VDS gọi sang Cake; ghi chú VDS chỉ gọi `/disburse-update` khi có kết quả cuối (kể cả sau `TIMEOUT`); ghi chú các mã `DIS0001`/`DIS0017`/`DIS0022`/`DIS0023` không trả cho đối tác |

    ## Cơ chế xác thực (Signature)

    Hai chiều dùng **hai cơ chế khác nhau** — không dùng lẫn.

    ### Partner → Cake (toàn bộ API Phase 1–4)
    ```
    rawBody  = {{body}} + {{partner_key}}
    hash     = sha256(rawBody)
    signature = base64_encode(rsa.SignPKCS1v15(rand.Reader, privKey, crypto.SHA256, hash))
    ```
    Partner tạo cặp khóa RSA 2048 bit: private key (PKCS#8) và public key (X.509), gửi public key cho Cake.

    ### Cake → VDS (nhóm `Cake → VDS` bên dưới)
    ```
    body      = toàn bộ body (timestamp, requestId, data), chuẩn hoá theo quy tắc dưới
    signature = base64(SHA256withRSA(body, cakePrivateKey))   // PKCS#1 v1.5, Base64 chuẩn
    ```
    **Không** nối `partner_key` vào body. Khóa RSA 2048 bit trở lên, private key PKCS#8 / public key X.509.
    VDS verify bằng `CAKE_API_KEY`.

    **Quy tắc chuẩn hoá chuỗi ký:**
    - Sắp xếp key của mọi object theo thứ tự ký tự, đệ quy ở mọi cấp; phần tử trong mảng giữ nguyên thứ tự.
    - JSON compact: không khoảng trắng, không xuống dòng.
    - UTF-8 nguyên dạng, **không** escape `\uXXXX`; chỉ escape theo chuẩn JSON: `"`, `\`, ký tự điều khiển.
    - Field `null` giữ nguyên trong chuỗi ký (`"bankCode":null`). Không muốn ký field nào thì không gửi field đó.
    - Số giữ nguyên kiểu như trong body: `9500000` là số, `"9500000"` là chuỗi. Số tiền truyền số nguyên, không dùng số thập phân/số mũ.
    - Body gửi đi có thể ở định dạng JSON bất kỳ — VDS tự chuẩn hoá body nhận được theo cùng quy tắc rồi mới kiểm tra chữ ký.

    Ví dụ đầy đủ (cặp khoá test, chuỗi ký, chữ ký): mục 7.3 tài liệu VDS-LP-PAYDAY-CAKE-001 v1.1.

    ## Môi trường

    ### SIT + UAT
    | Key | Value | Mô tả |
    |-----|-------|-------|
    | CAKE_API_URL | `https://gw.stage.cakedigibank.tech/ext/loan/payday/pd_viettel` | Endpoint API |
    | CAKE_PARTNER_ID | *(Cake cấp)* | Gắn ở header khi gọi API Cake |
    | CAKE_PARTNER_KEY | *(Cake cấp)* | Gắn sau body khi ký request |
    | CAKE_API_KEY | *(Cake cấp, file riêng)* | Partner dùng để verify Cake-signed payloads |
    | CAKE_IP_ADDRESS | `35.197.157.155/32` `34.87.136.147/32` `35.240.241.82/32` `34.142.212.108/32` `35.198.211.12/32` `34.143.164.202/32` `34.124.200.2/32` | Partner whitelist |
    | PARTNER_PUBLIC_KEY | *(Partner cấp, file riêng)* | Cake dùng để verify Partner-signed payloads |
    | PARTNER_API_URL | `https://staging1.viettelmoney.vn/lending/lender/public/v1/CAKE_PAYDAY/` | Base URL Cake gọi sang VDS (callback + truy vấn) |
    | PARTNER_API_KEY | *(VDS cấp)* | Header `apikey` khi Cake gọi VDS. Môi trường SIT không yêu cầu |
    | PARTNER_IP_ADDRESS | `34.87.136.147` *(Cake auto)* `171.255.192.33`| Cake whitelist |

    ### PROD
    | Key | Value | Mô tả |
    |-----|-------|-------|
    | CAKE_API_URL | `https://gw.cake.vn/ext/loan/payday/pd_viettel` | Endpoint API |
    | CAKE_PARTNER_ID | *(Cake cấp)* | Gắn ở header |
    | CAKE_PARTNER_KEY | *(Cake cấp)* | Gắn sau body khi ký |
    | CAKE_API_KEY | *(Cake cấp, file riêng)* | Partner dùng để verify Cake-signed payloads |
    | CAKE_IP_ADDRESS | `34.87.56.148/32` `35.240.146.157/32` `34.87.175.195/32` `34.142.177.122/32` `34.87.39.41/32` `34.143.164.31/32` `34.143.174.79/32` | Partner whitelist |
    | PARTNER_PUBLIC_KEY | *(Partner cấp, file riêng)* | Cake dùng để verify Partner-signed payloads |
    | PARTNER_API_URL | *(VDS cấp sau)* | Base URL Cake gọi sang VDS (callback + truy vấn) |
    | PARTNER_API_KEY | *(VDS cấp)* | Header `apikey` khi Cake gọi VDS |
    | PARTNER_IP_ADDRESS | *(Partner cấp)* | Cake whitelist |

    ## Error Codes

    ### General
    | Code | Thông báo | Mô tả |
    |------|-----------|-------|
    | `1` | Thành công | API call thành công |
    | `2` | Deadline exceeded | Timeout |
    | `500` | Internal server error | Lỗi nội bộ Cake |
    | `501` | Not implemented | API chưa có trong môi trường này |
    | `502` | An invalid response was received from the upstream server | Upstream Cake service trả về response không hợp lệ |
    | `900000` | Có lỗi xảy ra, vui lòng thử lại sau! | Generic server error |
    | `900001` | Hệ thống đang bảo trì | Bảo trì |
    | `900002` | Request is processing | Request đang xử lý, chờ callback |
    | `200000` | Chữ ký không hợp lệ | Signature RSA-SHA256 sai |
    | `200001` | Mã đối tác không hợp lệ | partner_id sai hoặc chưa được cấp |
    | `200003` | Request ID không hợp lệ | NID hoặc phone không hợp lệ |
    | `400001` | Không có thông tin khoản vay | loan_code không tìm thấy |
    | `100100` | COB Time. Yêu cầu thanh toán không được thực hiện | Ngoài giờ giao dịch |
    | `500013` | Trường dữ liệu không hợp lệ | Field format sai |

    ### Precheck / Onboarding
    | Code | Thông báo | Mô tả |
    |------|-----------|-------|
    | `100008` | Hồ sơ của bạn không đủ điều kiện | Khách hàng không đủ điều kiện |
    | `100009` | Thông tin GTTT đã tồn tại | ID document đã tồn tại |
    | `100011` | Độ tuổi không đủ điều kiện | Dưới tuổi tối thiểu |
    | `500001` | Hồ sơ không đủ điều kiện đăng ký sản phẩm | Không đáp ứng Product Policy |
    | `500009` | Hồ sơ không đủ điều kiện đăng ký sản phẩm | Không đáp ứng Product Policy |
    | `500010` | Hồ sơ mới bị từ chối gần đây | Cần chờ 7 ngày sau khi bị từ chối |
    | `500015` | Đang có khoản vay tương tự đã giải ngân | KH đang có khoản vay active |
    | `500016` | Giấy tờ tùy thân không còn đủ hiệu lực | ID document hết hạn |
    | `500017` | Chưa thực hiện xác thực NFC | NFC chưa hoàn thành |
    | `500018` | Hồ sơ không đủ điều kiện | Không đáp ứng Product Policy |
    | `500019` | Giấy tờ tùy thân không còn đủ hiệu lực | ID document hết hạn |
    | `500020` | Hồ sơ không trùng khớp với hồ sơ tại Cake | NID/phone/tên không khớp |
    | `500021` | Hồ sơ không đủ điều kiện | Không đáp ứng Product Policy |
    | `500024` | Tài khoản nhận giải ngân không hợp lệ | Tài khoản CASA không hợp lệ |
    | `500029` | Đang có hồ sơ vay khác chưa hoàn tất | KH có application đang mở |
    | `500030` | Tài khoản đang tạm khóa | Tài khoản bị khóa tạm thời |

    ### eKYC
    | Code | Thông báo | Mô tả |
    |------|-----------|-------|
    | `180000` | Có lỗi xác thực | Generic eKYC error |
    | `180214` | Ảnh chưa đạt yêu cầu | Ảnh CCCD/selfie không đạt chất lượng |
    | `180411` | Không đọc được thông tin chip CCCD | NFC chip lỗi |
    | `180418` | Ảnh chụp chưa khớp với giấy tờ | Selfie không khớp CCCD |
    | `180417` | Không nhận diện được khuôn mặt | Không có mặt trong ảnh selfie |
    | `180215` | Vui lòng sử dụng CCCD gắn chip | Chỉ chấp nhận CCCD chip |
    | `500012` | Yêu cầu thiếu dữ liệu | KH mới nhưng thiếu ảnh CCCD |
    | `180203` | Giấy tờ đang xét duyệt | eKYC đang pending |

    ### Contract
    | Code | Thông báo | Mô tả |
    |------|-----------|-------|
    | `300001` | Hợp đồng hết hạn | Hồ sơ quá 7 ngày |
    | `300003` | Mã OTP đang bị chặn, thử lại sau 15 phút | Sau 3 lần gửi OTP liên tiếp |
    | `300004` | Hợp đồng bị hủy, do vượt quá số lần lấy OTP | Lần get-otp thứ 7 hủy hợp đồng |
    | `300005` | Nhập sai OTP | OTP sai, chưa bị block |
    | `300006` | Hồ sơ bị chặn, thử lại sau 15 phút | Sai OTP 3 lần liên tiếp |
    | `300007` | Hợp đồng bị hủy, do nhập sai số lần cho phép | OTP sai lần thứ 6 |
    | `300000` | Yêu cầu không hợp lệ | Request quá 7 ngày |

    ### Repayment
    | Code | Thông báo | Mô tả |
    |------|-----------|-------|
    | `100100` | COB Time | Ngoài giờ giao dịch |
    | `100103` | Số tiền thanh toán vượt quá dư nợ | payment_amount > outstanding balance |
    | `400000` | Dữ liệu nhập không hợp lệ | partner_reference_id đã dùng |
    | `400001` | Không có thông tin khoản vay | loan_code không tìm thấy hoặc phone không khớp |
    | `600000` | Thông tin thanh toán không hợp lệ | loan_code và order_id không khớp, hoặc payment_amount = 0 |

    ### VDS (nhóm API Cake → VDS)
    Mã do hệ thống VDS trả về. HTTP status luôn là `200`.

    | Code | Mô tả | Xử lý |
    |------|-------|-------|
    | `000` | Thành công | — |
    | `403` | Xác thực chữ ký số thất bại | Kiểm tra lại request body |
    | `407` | Chữ ký số không hợp lệ | Kiểm tra lại chữ ký số và header chuẩn |
    | `404` | Không tìm thấy hồ sơ trên hệ thống | Kiểm tra lại thông tin khoản vay |
    | `406` | Dữ liệu không hợp lệ | Kiểm tra lại request body |
    | `413` | Dữ liệu không hợp lệ | Kiểm tra lại request body |
    | `411` | Giao dịch bị trùng lặp | VDS đã ghi nhận yêu cầu giải ngân, chờ kết quả cuối |
    | `416` | Timestamp không hợp lệ hoặc lệch quá 5 phút so với giờ VDS | Khởi tạo request với timestamp mới |

    ### VDS — sub-status giao dịch giải ngân thất bại/timeout
    Trả ở `data.subStatus` khi `data.status = FAILED`.
    Trạng thái phát sinh **không** nằm trong danh sách này: không gọi lại API giải ngân.
    Các mã `DIS0001`, `DIS0017`, `DIS0022`, `DIS0023` VDS không trả cho đối tác nên không liệt kê.

    | Code | Nội dung | Hành động |
    |------|----------|-----------|
    | `DIS0002` | Số tiền giải ngân không trùng khớp | Kiểm tra request, tạo yêu cầu giải ngân mới |
    | `DIS0003` | Họ tên KH nhận giải ngân không trùng khớp | Kiểm tra request, tạo yêu cầu giải ngân mới |
    | `DIS0004` | Số tài khoản nhận giải ngân không trùng khớp | Kiểm tra request, tạo yêu cầu giải ngân mới |
    | `DIS0005` | Thông tin ngân hàng nhận giải ngân không trùng khớp | Kiểm tra request, tạo yêu cầu giải ngân mới |
    | `DIS0006` | Thiếu thông tin bắt buộc | Kiểm tra request, tạo yêu cầu giải ngân mới |
    | `DIS0007` | Định dạng không hợp lệ | Kiểm tra request, tạo yêu cầu giải ngân mới |
    | `DIS0008` | Tài khoản nhận không ở trạng thái hoạt động | Cancel khoản vay |
    | `DIS0009` | Tài khoản nhận không cho phép nhận tiền | Cancel khoản vay |
    | `DIS0010` | Lỗi hệ thống | Tạo yêu cầu giải ngân mới |
    | `DIS0011` | Trạng thái khoản vay không hợp lệ | Phối hợp với VDS kiểm tra |
    | `DIS0012` | Chữ ký không hợp lệ | Phối hợp với VDS kiểm tra |
    | `DIS0013` | Ngân hàng nhận đang bảo trì | Liên hệ VDS, tạo yêu cầu mới khi đảm bảo |
    | `DIS0014` | Lỗi tại hệ thống ngân hàng nhận | Liên hệ VDS, tạo yêu cầu mới khi đảm bảo |
    | `DIS0015` | Tài khoản nhận giải ngân đã hủy | Cancel khoản vay |
    | `DIS0016` | Tài khoản người gửi không thực hiện được giao dịch | Kiểm tra lại thông tin TK, tạo yêu cầu mới |
    | `DIS0018` | Số dư tài khoản người gửi không đủ | Nạp tiền vào TK, tạo yêu cầu mới |
    | `DIS0019` | Trùng lặp giao dịch | Phối hợp với VDS kiểm tra |
    | `DIS0020` | Giao dịch thất bại sau đối soát | Cancel khoản vay |
    | `DIS0021` | Không tìm thấy giao dịch cần vấn tin | Phối hợp với VDS kiểm tra |
    | `DIS0024` | Hệ thống đang bảo trì | Liên hệ VDS, tạo yêu cầu mới khi đảm bảo |
    | `DIS1001` | Hệ thống chưa ghi nhận yêu cầu giải ngân | Tạo yêu cầu giải ngân mới |

  version: "1.0.0"
  contact:
    name: Cake Digital Bank
    url: https://cake.vn

servers:
  - url: https://gw.cake.vn/ext/loan/{group}/{product_id}
    description: Production
    variables:
      group:
        default: cashloan
        description: Nhóm API
      product_id:
        default: pd_viettel
        description: Mã sản phẩm
  - url: https://gw.stage.cakedigibank.tech/ext/loan/{group}/{product_id}
    description: SIT + UAT
    variables:
      group:
        default: cashloan
        description: Nhóm API
      product_id:
        default: pd_viettel
        description: Mã sản phẩm

# ─────────────────────────────────────────────
# COMMON COMPONENTS
# ─────────────────────────────────────────────
components:
  parameters:
    PartnerHeader:
      name: partner
      in: header
      required: true
      description: CAKE_PARTNER_ID được cấu hình trong môi trường
      schema:
        type: string
        example: CAKE_PARTNER_ID

    SignatureHeader:
      name: signature
      in: header
      required: true
      description: |
        Chữ ký RSA-SHA256 của request body.
        rawBody = body + partner_key → sha256 → RSA sign PKCS1v15 → base64
      schema:
        type: string

    VdsSignatureHeader:
      name: Signature
      in: header
      required: true
      description: |
        Chữ ký cho request **Cake → VDS** (khác cơ chế chiều Partner → Cake):
        chuẩn hoá body (sort key đệ quy, compact, UTF-8 không escape, giữ `null`, giữ kiểu số) →
        SHA256withRSA (PKCS#1 v1.5) bằng private key của Cake → base64 chuẩn.
        Không nối `partner_key` vào body. VDS verify bằng `CAKE_API_KEY`.
        Chi tiết quy tắc: mục *Cơ chế xác thực (Signature)*.
      schema:
        type: string

    ApiKeyHeader:
      name: apikey
      in: header
      required: false
      description: |
        `PARTNER_API_KEY` do VDS cấp, định danh hệ thống Cake.
        Bắt buộc ở PreProduction/Production; môi trường SIT không yêu cầu.
      schema:
        type: string

    ContentTypeHeader:
      name: Content-Type
      in: header
      required: true
      description: Loại nội dung request
      schema:
        type: string
        default: application/json; charset=utf-8

  schemas:
    # ── Common Response Wrapper ──
    BaseResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Kết quả xử lý yêu cầu (true/false)
          example: true
        code:
          type: integer
          description: Mã trạng thái hệ thống (xem Error Codes)
          example: 1
        message:
          type: string
          description: Thông báo phản hồi từ hệ thống
          example: "Thành công"
        response_id:
          type: string
          description: Mã định danh duy nhất của mỗi phản hồi
          example: "849KTQG7SQWLWQW5"
        timestamp:
          type: string
          format: date-time
          description: Thời gian phản hồi (ISO 8601)
          example: "2025-12-11T09:45:00+07:00"

    # ── Wrapper response của VDS (nhóm API Cake → VDS) ──
    VdsBaseResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: "Mã kết quả phía VDS. `000` = thành công (xem bảng Error Codes → VDS)"
          example: "000"
        message:
          type: string
          description: Mô tả kết quả
          example: "Thành công"
        data:
          type: object
          nullable: true
          description: Dữ liệu chi tiết, `null` khi lỗi

    # ── Onboarding ──
    DataConfigResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                city:
                  type: array
                  description: Danh sách tỉnh/thành phố
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        description: ID tỉnh/thành (dùng cho city_id / permanent_city_id)
                      name:
                        type: string
                        description: Tên tỉnh/thành (dùng cho city_name / permanent_city_name)
                      dist:
                        type: array
