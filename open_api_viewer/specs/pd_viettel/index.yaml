    CheckProfileRequest:
      type: object
      required:
        - phone_number
        - partner_reference_id
        - full_name
        - document_id
        - date_of_birth
        - metadata
      properties:
        phone_number:
          type: string
          description: Số điện thoại KH (bắt đầu bằng số 0)
          example: "0xxxxxxxxx"
        partner_reference_id:
          type: string
          description: ID định danh request, dùng xuyên suốt flow
          example: "bf133c7c-8e10-45a2-b9d2-4d04a352917a"
        full_name:
          type: string
          description: Họ tên KH (không bắt buộc có dấu)
          example: "TRAN MINH TIEN"
        document_id:
          type: string
          description: Số CCCD/CMND
          example: "xxxxxxxxxxxx"
        date_of_birth:
          type: string
          format: date
          description: Ngày sinh (yyyy-mm-dd)
          example: "1999-12-02"
        metadata:
          type: object
          description: Dữ liệu bổ sung
          required:
            - partner_score
            - partner_fraud_score
            - partner_cake_score
            - partner_non_viettel_score
            - non_viettel
          properties:
            non_viettel:
              type: boolean
              description: |
                Thuê bao của KH là ngoại mạng hay nội mạng Viettel.
                - `true`: ngoại mạng
                - `false`: nội mạng

                Cake dùng giá trị này để tính `is_repeated` trong response — lịch sử khoản vay
                ngoại mạng và nội mạng được xét tách nhau.
              example: false
            partner_score:
              type: string
              description: Credit score của KH từ phía đối tác, dạng range (lấy chặn dưới)
              example: "350-399"
            partner_fraud_score:
              type: string
              description: Fraud score của KH từ phía đối tác, dạng range (lấy chặn trên)
              example: "300-350"
            partner_cake_score:
              type: string
              description: Điểm Cake score từ phía đối tác, dạng range (lấy chặn dưới)
              example: "400-499"
            partner_non_viettel_score:
              type: string
              description: Điểm sim ngoại mạng Viettel
              example: "850"

    CheckProfileResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                reject_code:
                  type: integer
                  nullable: true
                  description: Mã lý do từ chối. null nếu đủ điều kiện
                reject_message:
                  type: string
                  nullable: true
                  description: Thông báo tương ứng với reject_code
                challenge_level:
                  type: array
                  description: "Mức độ xác thực yêu cầu. Sản phẩm này luôn là [1] (None). 1=None, 2=Facematch, 3=SMS OTP, 4=DTN Cake OTP"
                  items:
                    type: integer
                  example: [1]
                challenge_id:
                  type: string
                  description: ID dùng cho client-create (phải truyền kể cả challenge_level=[1])
                  example: "7b9e0d4f-3c4a-4e7c-9b92-92e6d5dcd781"
                is_exists:
                  type: boolean
                  description: |
                    Hồ sơ KH đã tồn tại tại Cake hay chưa.
                    - `true`: KH đã có hồ sơ → client-update chỉ cần gửi ảnh selfie (face-auth), không cần ảnh CCCD/NFC.
                    - `false`: KH mới → client-update cần gửi đầy đủ ảnh CCCD mặt trước, mặt sau và NFC.
                  example: false
                is_repeated:
                  type: boolean
                  description: |
                    KH cũ (đã từng vay xong) hay KH mới của sản phẩm PD_Viettel.
                    Cake xét lịch sử khoản vay có `status = CLOSE`, `product_id = PD_Viettel`
                    và **cùng giá trị `metadata.non_viettel` mà đối tác truyền lên trong request**:

                    | `non_viettel` | Điều kiện | `is_repeated` |
                    |---|---|---|
                    | `true` (ngoại mạng) | Chưa từng có khoản vay nào `status=CLOSE`, `product_id=PD_Viettel`, `non_viettel=true` | `false` (New) |
                    | `true` (ngoại mạng) | Đã có ít nhất 1 khoản vay `status=CLOSE`, `product_id=PD_Viettel`, `non_viettel=true` | `true` (Repeat) |
                    | `false` (nội mạng) | Chưa từng có khoản vay nào `status=CLOSE`, `product_id=PD_Viettel`, `non_viettel=false` | `false` (New) |
                    | `false` (nội mạng) | Đã có ít nhất 1 khoản vay `status=CLOSE`, `product_id=PD_Viettel`, `non_viettel=false` | `true` (Repeat) |

                    Lịch sử ngoại mạng và nội mạng **xét tách nhau**: KH đã tất toán khoản vay nội mạng
                    nhưng lần này mở hồ sơ ngoại mạng vẫn là `is_repeated=false`.
                  example: false

