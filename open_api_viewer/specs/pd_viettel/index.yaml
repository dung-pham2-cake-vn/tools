      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"

  # ════════════════════════════════════
  # ASYNC CALLBACK (Cake → Partner)
  # ════════════════════════════════════
  /partner-update-status:
    post:
      tags: [ Cake → VDS ]
      summary: Cake thông báo thay đổi trạng thái khoản vay
      description: |
        **Chiều: Cake → VDS**

        Cake gọi endpoint này trên hệ thống VDS khi trạng thái khoản vay thay đổi.
        Full URL: `{PARTNER_API_URL}partner-update-status`

        **Cake gọi khi:**
        | Sự kiện | Status |
        |---------|--------|
        | Sau loan-register | LOAN_APPROVE hoặc LOAN_REJECT |
        | Sau verify-esign | LOAN_SIGNED |
        | Sau giải ngân | LOAN_ACTIVE |
        | KH tất toán | LOAN_CLOSE |
        | Sau 7 ngày chưa ký | LOAN_EXPIRED |

        **Thành công:** VDS trả `code = "000"`. Mã khác → Cake retry (rule retry chốt sau).
        Dedupe phía VDS theo `requestId`, nên Cake giữ nguyên `requestId` khi retry.

        **Signature:** chuẩn hoá body rồi SHA256withRSA bằng private key Cake → VDS verify bằng `CAKE_API_KEY` (quy tắc ở mục *Cơ chế xác thực*).
      operationId: partnerUpdateStatus
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/VdsSignatureHeader"
        - $ref: "#/components/parameters/ApiKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerUpdateStatusRequest"
            example:
              timestamp: "2026-09-14T10:15:00+07:00"
              requestId: "7b2e9a1f8c3d4b5a6e7f8d9c0b1a2e3f"
              data:
                partnerReferenceId: "01JAQ7Z8M4K2N5P6R7S8T9V0W1"
                loanCode: "u8123123Sjsdb"
                phoneNumber: "0987654321"
                status: "LOAN_ACTIVE"
      responses:
        "200":
          description: VDS xác nhận đã nhận
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerUpdateStatusResponse"
              examples:
                success:
                  summary: Thành công
                  value:
                    code: "000"
                    message: "Thành công"
                    data:
                      appId: "xxxxxxx"
                      status: "REJECTED"
                signature_failed:
                  summary: Sai chữ ký
                  value:
                    code: "403"
                    message: "Xác thực chữ ký số thất bại"
                    data: null

  /partner-get-status:
    post:
      tags: [ Cake → VDS ]
      summary: Cake truy vấn trạng thái khoản vay trên hệ thống VDS
      description: |
        **Chiều: Cake → VDS**

        Truy vấn trạng thái khoản vay phía VDS.
        Full URL: `{PARTNER_API_URL}applications/status`

        `data.status` trả về là trạng thái nội bộ của VDS, **chưa** map sang `LOAN_*` của Cake.
      operationId: partnerGetStatus
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/VdsSignatureHeader"
        - $ref: "#/components/parameters/ApiKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerGetStatusRequest"
            example:
              timestamp: "2026-09-14T10:16:30+07:00"
              requestId: "a8f3e2d1c0b9a8f7e6d5c4b3a2f1e0d9"
              data:
                loanCode: "LOAN_123456789"
                identityNumber: "001090012345"
      responses:
        "200":
          description: Trạng thái khoản vay phía VDS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerGetStatusResponse"
              example:
                code: "000"
                message: "Thành công"
                data:
                  vdsLoanId: "VDS-99887766"
                  status: "APPROVAL"
                  loanAmount: 20000000
                  tenor: 12

  /partner-disburse-request:
    post:
      tags: [ Cake → VDS ]
      summary: Cake gửi yêu cầu giải ngân sang VDS
      description: |
        **Chiều: Cake → VDS**

        Cake yêu cầu VDS giải ngân cho khoản vay. VDS kiểm tra trạng thái khoản vay và
        giao dịch giải ngân đã tồn tại trước khi ghi nhận yêu cầu.
        Full URL: `{PARTNER_API_URL}partner-disburse-request`

        VDS giải ngân xong gọi lại API `/disburse-update` của Cake để xác nhận kết quả.
        Yêu cầu trùng lặp → VDS trả `411`, nghĩa là đã ghi nhận, chờ kết quả cuối.
      operationId: partnerDisburseRequest
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/VdsSignatureHeader"
        - $ref: "#/components/parameters/ApiKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerDisburseRequest"
            example:
              timestamp: "2026-09-14T10:20:00+07:00"
              requestId: "e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6"
              data:
                loanCode: "u8123123Sjsdb"
                fullName: "NGUYEN VAN A"
                identityNumber: "001090012345"
                disburseAmount: 9500000
                loanAmount: 10000000
                bankCode: "970415"
                accountNumber: "19034567890012"
                tenor: 12
      responses:
        "200":
          description: VDS ghi nhận yêu cầu giải ngân
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerDisburseRequestResponse"
              example:
                code: "000"
                message: "Thành công"
                data:
                  transactionId: "0d68bc41-fa57-4d62-946e-1473fba6728c"
                  vdsLoanId: "01GXBSD72R12GF113GX8JS81D5"

  /partner-disburse-status:
    post:
      tags: [ Cake → VDS ]
      summary: Cake truy vấn trạng thái giao dịch giải ngân
      description: |
        **Chiều: Cake → VDS**

        Lấy trạng thái giao dịch giải ngân hiện tại phía VDS.
        Full URL: `{PARTNER_API_URL}partner-disburse-status`

        **Xử lý theo `data.status`:**
        | Status | Ý nghĩa | Cake xử lý |
        |--------|---------|-----------|
        | `SUCCESS` | Đã giải ngân thành công | Chuyển khoản vay sang LOAN_ACTIVE |
        | `FAILED` | Giải ngân thất bại | Xem `subStatus` để quyết định (bảng `DIS00xx`) |
        | `PROCESSING` | Đang xử lý | Truy vấn lại sau 15 phút nếu chưa nhận kết quả |
        | `TIMEOUT` | Quá thời gian, chờ đối soát | Không tạo yêu cầu mới. Khi có kết quả cuối, VDS gọi `/disburse-update` của Cake (`partner_disburse_status` = 1/2) |
      operationId: partnerDisburseStatus
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/VdsSignatureHeader"
        - $ref: "#/components/parameters/ApiKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerDisburseStatusRequest"
            example:
              timestamp: "2026-09-14T10:25:00+07:00"
              requestId: "f1e2d3c4b5a67890abcdef1234567890"
              data:
                loanCode: "u8123123Sjsdb"
      responses:
        "200":
          description: Trạng thái giao dịch giải ngân
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerDisburseStatusResponse"
              examples:
                success:
                  summary: Giải ngân thành công
                  value:
