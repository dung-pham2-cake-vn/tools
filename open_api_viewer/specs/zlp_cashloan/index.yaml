info:
  title: ZaloPay Cashloan - Native Lending APIs
  description: |
    > **⚠️ Lưu ý bản quyền:** Tài liệu này thuộc bản quyền của **Cake by VPBank**.
    > Mọi hình thức sao chép, chỉnh sửa, hoặc phát tán phải được sự đồng ý bằng văn bản của Cake by VPBank.

    ## Mô tả
    API tích hợp giữa **ZaloPay (ZLP)** và hệ thống **Cake Digital Bank** cho sản phẩm **ZaloPay Cashloan**.

    Tài liệu được chuyển đổi từ file `ZLP Cashloan - API spec` (bản Excel/PDF). Tên field giữ nguyên
    theo bản spec đã đàm phán với ZLP (`loan_id`, `ref_id`, `dob`...), **không** đổi sang tên chuẩn
    của base Native (`loan_code`, `partner_reference_id`, `date_of_birth`).

    **Danh sách API:**

    | Endpoint | PIC | Bước |
    |----------|-----|------|
    | `/check-profile` | CAKE | Onboarding |
    | `/data-config` | CAKE | Onboarding |
    | `/client-create` | CAKE | Onboarding |
    | `/client-update` | CAKE | Onboarding |
    | `/loan-register` | CAKE | Onboarding |
    | `/get-status` | CAKE | Onboarding |
    | `/partner-update-status` | ZLP | Onboarding (callback) |
    | `/get-esign` | CAKE | Sign Contract |
    | `/contract-cancel` | CAKE | Sign Contract |
    | `/get-otp` | CAKE | Sign Contract |
    | `/verify-esign` | CAKE | Sign Contract |
    | `/partner-disburse-request` | ZLP | Disbursement (callback) |
    | `/disburse-update` | CAKE | Disbursement |
    | `/get-loan-detail` | CAKE | Repayment |
    | `/repayment-request` | CAKE | Repayment |
    | `/repayment-confirm` | CAKE | Repayment |
    | `/terminate-review` | CAKE | Termination |
    | `/terminate-request` | CAKE | Termination |
    | `/terminate-confirm` | CAKE | Termination |
    | `/partner-disburse-status` | ZLP | Disbursement (query, `fnc = QueryStatus`) |

    **Ba API chiều Cake → ZLP** (ZLP expose):
    - `status-update` → tài liệu này đặt tên theo chuẩn Cake là **`/partner-update-status`**;
      path phía ZLP: `POST /cash-loan/cake/contract/callback`.
      Header: `Content-Type`, `x-client-key`, `x-sign`. Response: `return_message`, `return_code`,
      `sub_return_code`.
    - `top-up` → tài liệu này đặt tên theo chuẩn Cake là **`/partner-disburse-request`**;
      path ZaloPay bankconnector `POST /banks/v1/zpcake`, phân biệt bằng `fnc = BankCashIn`.
    - `QueryStatus` → tài liệu này đặt tên theo chuẩn Cake là **`/partner-disburse-status`**;
      cùng path bankconnector, `fnc = QueryStatus`.

    Hai API `/partner-disburse-*` theo tài liệu `Zalopay-IB_Mobile_Banking_Integration` v1.5
    (§2.2.4, §2.2.5) — hợp đồng bankconnector (`fnc`, `partnerId`, `bankTransId`, `data` string-json),
    **không** theo chuẩn `partner-*` của Cake.

    ## Changelog

    | Thời gian | Email title | Cập nhật |
    |-----------|-------|-------|
    | 2026-08-31 | email_title | Khởi tạo tài liệu từ bản spec `ZLP Cashloan - API spec` |
    | 2026-09-04 | email_title | `/partner-update-status` theo hợp đồng ZLP (`x-client-key`/`x-sign`, `return_code`); bỏ `is_exists`/`is_valid_user`/`is_duplicate_loan` ở check-profile, bỏ `education` ở data-config |
    | 2026-09-04 | email_title | Chuyển `/partner-disburse-request` sang hợp đồng bankconnector ZLP (`fnc = BankCashIn`); bổ sung `/partner-disburse-status` (`fnc = QueryStatus`) và bảng error code bankconnector (`resultCode` = `00` là đã giải ngân), theo `Zalopay-IB_Mobile_Banking_Integration` v1.5 |

    ## Cơ chế xác thực (Signature)
    Tất cả request từ Partner gọi Cake đều phải ký signature:
    ```
    rawBody = {{body}} + {{partner_key}}
    hash = sha256(rawBody)
    signature = base64_encode(rsa.SignPKCS1v15(rand.Reader, privKey, crypto.SHA256, hash))
    ```
    Partner cần tạo cặp khóa RSA 1024 bit: private key (PKCS#8) và public key (X.509).
    Test chữ ký có thể dùng tool online như [https://emn178.github.io/online-tools/rsa/verify](https://emn178.github.io/online-tools/rsa/verify/?input=%7B%22req_id%22%3A%221%22%2C%22action%22%3A1%7DPartner&input_type=utf-8&algorithm=SHA256&public_key=-----BEGIN%20PUBLIC%20KEY-----%0AMIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQC0KTbcJmoAT1g%2FFEp7eWWzuATg%0AK%2F7Go01PKZUaVTsN80JiDdg%2FmgDIcE0D9w5fYsDBN2pgeQ7EW8qqB8wb84qqk7QX%0AzAFfAqGx10X5aRe0WPsL3x7SCnG9QDz%2Fsun7hvrELes2sBw1a63lk3ZHyU9xLAcs%0ASsOFirCfQDlq0sbvNQIDAQAB%0A-----END%20PUBLIC%20KEY-----&signature_input_type=base64&signature=LWRijuKu83sa%2BU2FMe%2BsrtP8ctIaPjNAZ68YBiOiZNhzl%2FBELWztAcnTaOxINjghrfepTRLjhjvQw5mfwZrUHue4hwWDRvCpTMvCSfv513vuKp4kIQFK5EAASMZuhjwTn6mBxeO1i55xWB2wHqXVJxXgFecSok6T8qqJyH4XUzc%3D).

    Chiều ngược lại — `/partner-update-status`: header `x-client-key` + `x-sign`.
    `rawData = request_body + "|" + client_key`,
    `x-sign = base64(RSA-SHA256 PKCS#1 v1.5 sign(rawData, private_key))`.

    Chiều ngược lại — `/partner-disburse-request`, `/partner-disburse-status` (bankconnector):
    field `signature` trong body, ký RSA 2048.
    Request (Cake ký): `signedData = fnc + partnerId + bankTransId + requestTime + data`.
    Response (ZLP ký): `signedData = resultCode + message + responseTime + data`.

