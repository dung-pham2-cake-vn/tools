                    - LOAN_INIT
                    - LOAN_REVIEWING
                    - LOAN_REJECT
                    - LOAN_APPROVE
                    - LOAN_EXPIRED
                    - LOAN_CANCEL
                    - LOAN_SIGNED
                    - LOAN_ACTIVE
                    - LOAN_CLOSE
                  description: Trạng thái tài khoản vay
                  example: LOAN_ACTIVE
                contract_url:
                  type: string
                  description: URL hợp đồng đã ký song phương (signed)
                  example: "https://storage.googleapis.com/..."
                disburse_date:
                  type: string
                  format: date
                  description: Ngày giải ngân khoản vay (yyyy-mm-dd)
                  example: "2026-06-03"
                paid_amount:
                  type: string
                  description: Số tiền KH đã thanh toán
                  example: "2360000"
                prepayment_amount:
                  type: string
                  description: Số tiền KH đã thanh toán trước trong kỳ
