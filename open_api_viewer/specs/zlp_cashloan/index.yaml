# ─────────────────────────────────────────────
# COMMON COMPONENTS
# ─────────────────────────────────────────────
components:
  parameters:
    PartnerHeader:
      name: partner
      in: header
      required: true
      description: CAKE_PARTNER_ID được cấu hình trong môi trường
      schema:
        type: string
        example: zalopay

    SignatureHeader:
      name: signature
      in: header
      required: true
      description: |
        Chữ ký RSA-SHA256 của request body.
        rawBody = body + partner_key → sha256 → RSA sign PKCS1v15 → base64
      schema:
        type: string

    ContentTypeHeader:
      name: Content-Type
      in: header
      required: true
      schema:
        type: string
        default: application/json; charset=utf-8

    ClientKeyHeader:
      name: x-client-key
      in: header
      required: true
      description: client_key do ZLP cấp cho Cake (chỉ dùng ở /partner-update-status)
      schema:
        type: string

    XSignHeader:
      name: x-sign
      in: header
      required: true
      description: |
        Chữ ký của Cake cho request gọi sang ZLP (chỉ dùng ở /partner-update-status).
        rawData = request_body + "|" + client_key
        x-sign = base64(SHA256withRSA, PKCS#1 v1.5, sign(rawData, private_key))
      schema:
        type: string

  schemas:
    # ── Common Response Wrapper ──
    BaseResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Kết quả xử lý yêu cầu (true/false)
          example: true
        code:
          type: integer
          description: Mã trạng thái hệ thống
          example: 1
        message:
          type: string
          description: Thông báo phản hồi từ hệ thống
          example: Thành công
        response_id:
          type: string
          description: Mã định danh duy nhất của mỗi phản hồi
          example: "849KTQG7SQWLWQW5"
        timestamp:
          type: string
          format: date-time
          description: Thời gian phản hồi (ISO 8601)
          example: "2025-11-03T07:00:00+07:00"

    # ── Onboarding ──
    DataConfigResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                city:
                  type: array
                  description: Danh sách tỉnh/thành phố
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        description: ID tỉnh/thành (dùng cho city_id / permanent_city_id)
                      name:
                        type: string
                        description: Tên tỉnh/thành (dùng cho city_name / permanent_city_name)
                      dist:
                        type: array
                        description: Danh sách quận/huyện (value=000 nếu mô hình 2 cấp)
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: 'ID quận/huyện. Mô hình 2 cấp: dùng "000"'
                            name:
                              type: string
                              description: 'Tên quận/huyện. Mô hình 2 cấp: gửi literal "Không"'
                            ward:
                              type: array
                              description: Danh sách phường/xã
                              items:
                                type: object
                district:
                  type: array
                  description: Danh sách quận/huyện theo tỉnh/thành (theo data library)
                  items:
                    type: object
                ward:
                  type: array
                  description: Danh sách phường/xã theo tỉnh/thành + quận/huyện (theo data library)
                  items:
                    type: object
                gender:
                  type: array
                  description: "1=Nam, 2=Nữ"
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Mã giới tính (dùng cho gender ở client-create)
                      name:
                        type: string
                        description: Tên hiển thị
                marital:
                  type: array
                  description: "1=Độc thân, 2=Đã kết hôn, 3=Khác"
                  items:
                    type: object
                occupation:
                  type: array
                  description: "1=Nhân viên văn phòng/công chức, 2=Lao động phổ thông,
                    3=Tự kinh doanh, 4=Sinh viên/học sinh, 5=Không đi làm, 6=Khác"
                  items:
                    type: object
                job_title:
                  type: array
                  description: "1=Công nhân/Lao động phổ thông, 2=Cấp nhân viên/Chuyên viên,
                    3=Quản lý, 4=Tự kinh doanh"
                  items:
                    type: object
                contact_relationship:
                  type: array
                  description: "1=Vợ, 2=Chồng, 3=Cha, 4=Mẹ, 5=Anh/Em trai, 6=Chị/Em gái,
                    7=Ông, 8=Bà, 9=Đồng nghiệp, 10=Bạn bè"
                  items:
                    type: object
                loan_purpose:
                  type: array
                  description: "1=Mua sắm đồ dùng gia đình, 2=Chi phí khám/chữa bệnh,
                    3=Thanh toán chi phí du lịch, 6=Các mục đích tiêu dùng hợp pháp khác,
                    7=Đóng học phí"
                  items:
                    type: object
                proposed_term:
                  type: array
                  description: Danh sách khoảng thời gian đề nghị vay
                  items:
                    type: object

    CheckProfileRequest:
      type: object
      required:
        - full_name
        - phone_number
        - document_id
        - dob
      properties:
        full_name:
          type: string
          description: Họ và tên KH (không cần dấu)
          example: "TRAN MINH TIEN"
        phone_number:
          type: string
          description: Số điện thoại KH (bắt đầu bằng số 0)
          example: "0xxxxxxxxx"
        document_id:
          type: string
          description: Số GTTT của KH (CMND/CCCD)
          example: "xxxxxxxxxxxx"
        dob:
          type: string
          format: date
          description: Ngày sinh (yyyy-mm-dd)
          example: "1999-12-02"
        extra_data:
          type: object
          nullable: true
          properties:
            sso:
              type: boolean
              description: Trạng thái SSO
              example: true
            consent_content:
              type: string
              description: Câu KH xác nhận đồng ý T&C
            partner_client_id:
              type: string
              description: Client ID của đối tác

    CheckProfileResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                reject_code:
                  type: integer
                  nullable: true
                  description: Reject code của phần Precheck (xem bảng Bộ mã Precheck)
                reject_message:
                  type: string
                  nullable: true
                  description: Reject message của phần Precheck
                offer_segment:
                  type: string
                  description: Phân khúc offer
                  enum:
                    - NEW
                    - REPEAT
                    - UPSELL
                    - XSELL
                  example: "NEW"
                offer_limit_amount:
                  type: integer
                  description: Số tiền offer (nếu có)
                  example: 12000000
                challenge_level:
                  type: array
                  description: |
                    1=None, 2=Facematch, 3=SMS OTP, 4=DTN Cake OTP.
                    Sản phẩm này **luôn là `[1]`** — không cần challenge.
                  items:
                    type: integer
                  example: [ 1 ]
                challenge_id:
                  type: string
                  description: ID dùng cho API xác thực challenge, truyền tiếp vào /client-create
                  example: "7b9e0d4f-3c4a-4e7c-9b92-92e6d5dcd781"

    ClientCreateRequest:
      type: object
      required:
        - challenge_id
        - full_name
        - date_of_birth
        - gender
        - document_id
