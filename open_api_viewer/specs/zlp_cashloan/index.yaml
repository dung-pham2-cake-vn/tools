        city_id:
          type: string
          description: ID Tỉnh/Thành phố (địa chỉ hiện tại)
          example: "79"
        dist_id:
          type: string
          description: ID Quận/Huyện (địa chỉ hiện tại). Mô hình 2 cấp dùng "000"
          example: "000"
        ward_id:
          type: string
          description: ID Phường/Xã (địa chỉ hiện tại)
          example: "001"
        address:
          type: string
          nullable: true
          description: Số nhà, tên đường (địa chỉ hiện tại)
          example: "54 Chu Văn An"
        city_name:
          type: string
          description: Tỉnh/Thành phố (địa chỉ hiện tại)
          example: "Thành phố Hồ Chí Minh"
        dist_name:
          type: string
          description: 'Quận/Huyện (địa chỉ hiện tại). Mô hình 2 cấp: gửi literal "Không"'
          example: "Không"
        ward_name:
          type: string
          description: Phường/Xã (địa chỉ hiện tại)
          example: "Phường Hải Châu"
        internet_address:
          type: string
          nullable: true
          description: Số nhà, tên đường, thành phố …
          example: "54 Chu Văn An, Thành phố Hồ Chí Minh"
        occupation:
          type: string
          description: "1=Nhân viên văn phòng/công chức, 2=Lao động phổ thông, 3=Tự kinh doanh,
            4=Sinh viên/học sinh, 5=Không đi làm, 6=Khác"
          example: "1"
        job_title:
          type: string
          nullable: true
          description: "Chức vụ. 1=Công nhân/Lao động phổ thông, 2=Cấp nhân viên/Chuyên viên,
            3=Quản lý, 4=Tự kinh doanh"
          example: "2"
        company_name:
          type: string
          nullable: true
          description: Tên công ty
          example: "Cake"
        monthly_income:
          type: string
          description: Thu nhập tháng (VNĐ)
          example: "15000000"
        contact_name_1:
          type: string
          description: Họ và tên tham chiếu 1 (Người thân)
          example: "Phan Thi A"
        contact_number_1:
          type: string
          description: Số điện thoại tham chiếu 1 (bắt đầu bằng số 0)
          example: "0xxxxxxxxx"
        contact_relationship_1:
          type: string
          description: |
            Quan hệ với người tham chiếu 1.
            **Bắt buộc** nằm trong {Bố (3), Mẹ (4), Vợ (1), Chồng (2)}.
          example: "3"
        contact_name_2:
          type: string
          description: Họ và tên tham chiếu 2 (Bạn bè)
          example: "Pham Thi B"
        contact_number_2:
          type: string
          description: |
            Số điện thoại tham chiếu 2 (bắt đầu bằng số 0).
            Không được trùng với `contact_number_1`.
          example: "0xxxxxxxxx"
        contact_relationship_2:
          type: string
          description: |
            Quan hệ với người tham chiếu 2.
            Không được trùng `contact_relationship_1`.
          example: "10"
        proposed_amount:
          type: string
          description: Số tiền đề nghị vay (không bao gồm bảo hiểm, VNĐ)
          example: "12000000"
        proposed_term:
          type: string
          description: Thời gian đề nghị vay
          example: "12"
        loan_insurance:
          type: string
          description: Bảo hiểm khoản vay
          enum: [ "True", "False" ]
          example: "True"
        interest_rate:
          type: string
          description: Lãi suất (theo BRD)
          example: "43"
        loan_purpose:
          type: string
          description: "1=Mua sắm đồ dùng gia đình, 2=Chi phí khám/chữa bệnh,
            3=Thanh toán chi phí du lịch, 6=Tiêu dùng hợp pháp khác, 7=Đóng học phí"
          example: "1"
        product_code:
          type: string
          description: Product code theo BRD
          example: "ZLP_CL_01"
        metadata:
          type: object
          nullable: true
          description: Dữ liệu bổ sung (nếu có)
          properties:
            zalopay_score:
              type: string
              description: Credit score nhóm score cao, dạng range, lấy chặn dưới
              example: "350-399"
            partner_score_2:
              type: string
              description: Credit score nhóm score thấp, dạng range, lấy chặn dưới
              example: "350-399"
            partner_onboarding_channel:
              type: string
              description: "Channel onboarding: (null) / zalo / zalopay"
              nullable: true
              enum:
                - zalo
                - zalopay
              example: "zalopay"

    ClientCreateResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                request_id:
                  type: string
                  description: |
                    Request ID. Dùng cho các API /client-update, /loan-register, /get-status.
                  example: "req-abc123"

    ClientUpdateRequest:
      type: object
      required:
        - request_id
        - phone_number
        - document_id
        - selfie_image
        - nfc_data
      properties:
        request_id:
          type: string
          description: Request ID từ API /client-create
          example: "req-abc123"
        phone_number:
          type: string
          description: Số điện thoại KH (bắt đầu bằng số 0)
          example: "0xxxxxxxxx"
        document_id:
          type: string
          description: Số CMND/CCCD (ZLP gửi sang)
          example: "xxxxxxxxxxxx"
        selfie_image:
          type: string
          format: byte
          description: Ảnh selfie (base64, size ≤ 1MB, ảnh dọc)
        front_nid_image:
          type: string
          format: byte
          nullable: true
          description: |
            Ảnh GTTT mặt trước (base64, size ≤ 1MB, ảnh ngang).
            **Required** nếu KH chưa eKYC NFC thành công tại Cake.
        back_nid_image:
          type: string
          format: byte
          nullable: true
          description: |
            Ảnh GTTT mặt sau (base64, size ≤ 1MB, ảnh ngang).
            **Required** nếu KH chưa eKYC NFC thành công tại Cake.
        nfc_data:
          type: object
          description: Thông tin NFC data của KH
          required:
            - sod
            - dg1
            - dg2
            - dg13
            - dg14
            - dg15
          properties:
            sod:
              type: string
              description: NFC sod value
            dg1:
              type: string
              description: NFC data group 1
            dg2:
              type: string
              description: NFC data group 2
            dg13:
              type: string
              description: NFC data group 13
            dg14:
              type: string
              description: NFC data group 14
            dg15:
              type: string
              description: NFC data group 15
            com:
              type: string
              nullable: true
              description: NFC com data (optional)

    ClientUpdateResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                document_id:
                  type: string
                  description: Số CMND/CCCD
                  example: "xxxxxxxxxxxx"
                user_id:
                  type: string
                  description: |
                    User_id của tài khoản Cake.
                    Nếu là KH cũ (existing customer) thì dùng lại user_id hiện có.
                  example: "usr-abc123"
                full_name:
                  type: string
                  description: Họ và tên
                  example: "Trần Minh Tiến"
                phone_number:
                  type: string
                  description: Số điện thoại
                  example: "0xxxxxxxxx"
                email:
                  type: string
                  nullable: true
                  description: Email
                  example: "abc@gmail.com"
                status:
                  type: string
                  description: Trạng thái hồ sơ eKYC
                  enum:
                    - EKYC_UNKNOWN
                    - EKYC_INIT
                    - EKYC_PENDING
                    - EKYC_REJECT
                    - EKYC_SUCCESS
                  example: EKYC_SUCCESS
                is_new_user:
                  type: boolean
                  description: true nếu hồ sơ vừa được tạo mới (mỗi hồ sơ có 1 user_id)
                  example: true

    LoanRegisterRequest:
      type: object
      required:
        - request_id
        - phone_number
        - document_id
      properties:
        request_id:
          type: string
          description: Request ID từ API /client-create
          example: "req-abc123"
        phone_number:
          type: string
          description: Số điện thoại KH (bắt đầu bằng số 0)
          example: "0xxxxxxxxx"
        document_id:
          type: string
          description: Số CMND/CCCD (ZLP gửi sang)
          example: "xxxxxxxxxxxx"

    LoanRegisterResponse:
