        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                loan_id:
                  type: string
                  nullable: true
                  description: Mã khoản vay. **NULL** nếu hồ sơ bị REJECTED
                  example: "u8123123Sjsdb"
                status:
                  type: string
                  enum:
                    - LOAN_INIT
                    - LOAN_REVIEWING
                    - LOAN_REJECT
                    - LOAN_APPROVE
                  description: |
                    - LOAN_INIT: Hồ sơ khoản vay đã khởi tạo
                    - LOAN_REVIEWING: Đang chờ phê duyệt
                    - LOAN_REJECT: Bị từ chối
                    - LOAN_APPROVE: Đã phê duyệt
                  example: LOAN_REVIEWING

    GetStatusRequest:
      type: object
      required:
        - request_id
        - phone_number
        - document_id
      properties:
        request_id:
          type: string
          description: Request ID từ API /client-create
          example: "req-abc123"
        phone_number:
          type: string
          description: Số điện thoại KH (bắt đầu bằng số 0)
          example: "0xxxxxxxxx"
        document_id:
          type: string
          description: Số CMND/CCCD
          example: "xxxxxxxxxxxx"

    GetStatusResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - EKYC_UNKNOWN
                    - EKYC_INIT
                    - EKYC_PENDING
                    - EKYC_REJECT
                    - EKYC_SUCCESS
                  description: Trạng thái hồ sơ eKYC của KH
                  example: EKYC_SUCCESS

    GetLoanDetailRequest:
      type: object
      required:
        - loan_id
      properties:
        loan_id:
          type: string
          description: Mã khoản vay từ /loan-register hoặc /get-status
          example: "u8123123Sjsdb"

    GetLoanDetailResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              description: Thông tin chi tiết khoản vay
              properties:
                loan_id:
                  type: string
                  description: Mã khoản vay Cake trả sang ZLP
                  example: "u8123123Sjsdb"
                contract_id:
                  type: string
                  description: Mã hợp đồng
                  example: "1234567890"
                full_name:
                  type: string
                  description: Họ và tên
                  example: "Trần Minh Tiến"
                document_id:
                  type: string
                  description: Số CMND/CCCD
                  example: "xxxxxxxxxxxx"
                loan_insurance:
                  type: string
                  description: "% Bảo hiểm khoản vay"
                  example: "7"
                approved_term:
                  type: string
                  description: Kỳ hạn khoản vay được phê duyệt
                  example: "12"
                approved_amount:
                  type: string
                  description: Số tiền phê duyệt (VNĐ)
                  example: "12000000"
                due_date:
                  type: string
                  format: date
                  description: Ngày đến hạn thanh toán gần nhất (yyyy-mm-dd)
                  example: "2026-09-27"
                disburse_amount:
                  type: string
                  description: Số tiền giải ngân (approved_amount + phí bảo hiểm)
                  example: "12840000"
                interest_rate:
                  type: string
                  description: Lãi suất
                  example: "43"
                monthly_payment_amount:
                  type: string
                  description: Số tiền KH cần thanh toán (tháng)
                  example: "1250000"
                payment_period:
                  type: string
                  description: Kỳ thanh toán theo kỳ hạn khoản vay của KH
                  example: "3"
                principle_balance:
                  type: string
                  description: Dư nợ gốc còn lại của khoản vay
                  example: "9640000"
                interest_balance:
                  type: string
                  description: Dư nợ lãi phát sinh theo từng kỳ
                  example: "197494"
                penalty_principal_balance:
                  type: string
                  description: Lãi phạt gốc quá hạn (nếu có)
                  example: "0"
                penalty_interest_balance:
                  type: string
                  description: Lãi phạt lãi quá hạn (nếu có)
                  example: "0"
                total_payment_amount:
                  type: string
                  description: Tổng số tiền cần thanh toán trong kỳ (gồm gốc, lãi, phạt nếu có)
                  example: "1447494"
                day_arrears:
                  type: string
                  description: Số ngày quá hạn (nếu có)
                  example: "0"
                loan_account_status:
                  type: string
                  enum:
