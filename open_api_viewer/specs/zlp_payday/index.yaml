                  description: Họ và tên
                  example: "Trần Minh Tiến"
                document_id:
                  type: string
                  description: Số GTTT
                  example: "xxxxxxxxxxxx"
                loan_insurance:
                  type: string
                  description: "% Bảo hiểm khoản vay"
                  example: "7"
                approved_term:
                  type: string
                  description: Kỳ hạn khoản vay được phê duyệt
                  example: "3"
                approved_amount:
                  type: string
                  description: Số tiền phê duyệt (VNĐ)
                  example: "5000000"
                due_date:
                  type: string
                  format: date
                  description: Ngày đến hạn thanh toán gần nhất (yyyy-mm-dd)
                  example: "2026-09-27"
                disburse_amount:
                  type: string
                  description: Số tiền giải ngân (approved_amount + phí bảo hiểm)
                  example: "5350000"
                interest_rate:
                  type: string
                  description: Lãi suất
                  example: "43"
                principle_balance:
                  type: string
                  description: Dư nợ gốc còn lại của khoản vay
                  example: "5000000"
                interest_balance:
                  type: string
                  description: Dư nợ lãi phát sinh theo từng kỳ
                  example: "102494"
                penalty_principal_balance:
                  type: string
                  description: Lãi phạt gốc quá hạn (nếu có)
                  example: "0"
                penalty_interest_balance:
                  type: string
                  description: Lãi phạt lãi quá hạn (nếu có)
                  example: "0"
                total_payment_amount:
                  type: string
                  description: Tổng số tiền cần thanh toán trong kỳ (gồm gốc, lãi, phạt nếu có)
                  example: "5102494"
                day_arrears:
                  type: string
                  description: Số ngày quá hạn (nếu có)
                  example: "0"
                loan_account_status:
                  type: string
                  enum:
                    - LOAN_UNKNOWN
                    - LOAN_INIT
                    - LOAN_REVIEWING
                    - LOAN_REJECT
                    - LOAN_APPROVE
                    - LOAN_EXPIRED
                    - LOAN_CANCEL
                    - LOAN_SIGNED
                    - LOAN_ACTIVE
                    - LOAN_CLOSE
                  description: Trạng thái tài khoản vay
                  example: LOAN_ACTIVE
                contract_url:
                  type: string
                  description: URL hợp đồng đã ký song phương (signed)
                  example: "https://storage.googleapis.com/..."
                disburse_date:
                  type: string
                  format: date
                  description: Ngày giải ngân khoản vay (yyyy-mm-dd)
                  example: "2026-09-03"
                paid_amount:
                  type: string
                  description: Số tiền KH đã thanh toán
                  example: "0"

    # ── Contract ──
    GetEsignRequest:
      type: object
      required:
        - loan_id
      properties:
        loan_id:
          type: string
          description: Mã khoản vay từ API /loan-register
          example: "u8123123Sjsdb"

    GetEsignResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                url:
                  type: string
                  description: URL hợp đồng định dạng HTML
                url_pdf:
                  type: string
                  description: |
                    URL hợp đồng định dạng PDF → ZLP hiển thị file PDF này trong frame
                    cho KH đọc và quyết định ký hay không.
                expired_time:
                  type: string
                  format: date
                  description: Ngày hợp đồng hết hạn (yyyy-mm-dd)
                  example: "2026-09-10"

    ContractCancelRequest:
      type: object
      required:
        - loan_id
      properties:
        loan_id:
          type: string
          description: Mã khoản vay từ /get-status hoặc /loan-register
          example: "u8123123Sjsdb"

    ContractCancelResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              nullable: true
              description: |
                `null`. Bản spec ZLP Payday **gạch bỏ** field `status` khỏi response của API này.

    GetOtpRequest:
      type: object
      required:
        - loan_id
      properties:
        loan_id:
          type: string
          description: Mã khoản vay từ /get-status hoặc /loan-register
          example: "u8123123Sjsdb"

    GetOtpResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                blocked:
                  type: boolean
                  description: OTP đang bị chặn (cần chờ 15 phút)
                  example: false
                contract_is_rejected:
                  type: boolean
                  description: Hợp đồng bị từ chối — KH KHÔNG thể tiếp tục luồng ký
                  example: false
                otp_count:
                  type: integer
                  description: Đếm số lần gửi OTP
                  example: 1
                otp_period:
                  type: integer
                  description: Khoảng thời gian OTP. Nếu period < 3 thì trả về 1
                  example: 1

    VerifyEsignRequest:
      type: object
      required:
        - loan_id
        - otp
      properties:
        loan_id:
          type: string
          description: Mã khoản vay từ /get-status hoặc /loan-register
          example: "u8123123Sjsdb"
        otp:
          type: string
          description: OTP gửi qua SĐT của KH

    VerifyEsignResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                is_correct_otp:
                  type: boolean
                  description: true nếu verify OTP thành công
                  example: true
                verify_count:
                  type: integer
                  description: Số lần gọi /verify-esign
                  example: 1

    # ── Disbursement ──
    DisburseUpdateRequest:
      type: object
      required:
        - loan_id
        - partner_disburse_status
      properties:
        loan_id:
          type: string
          description: Mã khoản vay Cake trả sang ZLP (API /loan-register)
          example: "u8123123Sjsdb"
        partner_disburse_status:
          type: integer
          description: "Trạng thái giải ngân phía ZLP: 1=Success, 2=Failure"
          enum: [ 1, 2 ]
          example: 1

    # ── Repayment ──
    RepaymentRequestBody:
      type: object
      required:
        - loan_id
        - partner_reference_id
        - payment_amount
      properties:
        loan_id:
          type: string
          description: Mã khoản vay Cake trả sang ZLP
          example: "u8123123Sjsdb"
        partner_reference_id:
          type: string
          description: Reference ID của mỗi giao dịch (ZLP tạo mới mỗi request)
          example: "bf133c7c-8e10-45a2-b9d2-4d04a352917a"
        payment_amount:
          type: integer
          format: int32
          description: Số tiền KH thanh toán từ phía ZLP (VNĐ)
          example: 5102494

    RepaymentRequestResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                order_id:
                  type: string
                  description: ID dùng để gọi API /repayment-confirm
                  example: "ord-abc123"

    RepaymentConfirmRequest:
      type: object
      required:
        - loan_id
        - partner_reference_id
        - payment_amount
        - order_id
      properties:
        loan_id:
          type: string
          description: Mã khoản vay Cake trả sang ZLP
          example: "u8123123Sjsdb"
        partner_reference_id:
          type: string
          description: Reference ID của mỗi giao dịch
          example: "bf133c7c-8e10-45a2-b9d2-4d04a352917a"
        payment_amount:
          type: integer
          format: int32
          description: Số tiền KH thanh toán từ phía ZLP (VNĐ)
          example: 5102494
        order_id:
          type: string
          description: ID trả ra từ API /repayment-request
          example: "ord-abc123"

    # ── Partner-side schemas (Cake → ZLP) ──
    PartnerUpdateStatusRequest:
      type: object
      required:
        - request_id
        - status
      properties:
        request_id:
          type: string
          description: Request ID từ API /client-create
          example: "req-abc123"
        status:
          type: string
          enum:
            - LOAN_APPROVE
            - LOAN_REJECT
            - LOAN_EXPIRED
            - LOAN_SIGNED
            - LOAN_CANCEL
            - LOAN_ACTIVE
            - LOAN_CLOSE
          description: |
            Trạng thái hồ sơ khoản vay tại Cake:
            - LOAN_APPROVE: Hồ sơ đăng ký khoản vay đã được phê duyệt
            - LOAN_REJECT: Hồ sơ đăng ký khoản vay bị từ chối
            - LOAN_EXPIRED: Hồ sơ đăng ký khoản vay bị hết hạn (7 ngày)
            - LOAN_SIGNED: Hồ sơ đã ký hợp đồng vay
            - LOAN_CANCEL: Hồ sơ đăng ký khoản vay bị hủy
            - LOAN_ACTIVE: Hồ sơ đã giải ngân thành công
            - LOAN_CLOSE: Khoản vay đã tất toán
          example: LOAN_APPROVE

    PartnerUpdateStatusResponse:
      type: object
      required:
        - return_message
        - return_code
      properties:
        return_message:
          type: string
          description: Return code description
          example: "SUCCESS"
        return_code:
          type: integer
          description: "1 = SUCCESS, 2 = FAIL. Đây chỉ là trạng thái của API"
          enum: [ 1, 2 ]
          example: 1
        sub_return_code:
          type: integer
          nullable: true
          description: |
            Chi tiết lỗi khi `return_code = 2`:
            - `-400` Invalid params → Partner check lại params
            - `-401` Authentication failed → Partner check lại signature
            - `-404` Request ID not found → Partner check lại params
            - `-503` System maintenance → Cake gọi lại API callback
          example: null

    PartnerDisburseRequest:
      type: object
      required:
        - fnc
        - partnerId
        - bankTransId
        - requestTime
        - signature
        - data
      properties:
        fnc:
          type: string
          maxLength: 30
          description: "Tên hàm — truyền `BankCashIn`. Bộ hàm bankconnector: Register, Unregister,
            CheckAccount, BankCashIn, QueryStatus"
          example: "BankCashIn"
        partnerId:
          type: string
          maxLength: 30
          description: "{partnerId} = ZPCAKE — định danh do ZaloPay cấp cho Cake"
          example: "ZPCAKE"
        bankTransId:
          type: string
          maxLength: 50
          description: UUID Cake tạo mới mỗi request
          example: "6f2d1b3a-9c44-4c8e-b1f7-0a2d9c5e7b31"
        requestTime:
          type: string
          maxLength: 19
          description: Thời gian gọi API. Format `yyyy-MM-dd HH:mm:ss`
          example: "2026-09-04 10:15:00"
        signature:
          type: string
          description: |
            Digital signature (DS): `signedData = fnc + partnerId + bankTransId + requestTime + data`,
            DS của Cake, mã hoá RSA 2048 bằng private key của Cake.
        data:
          type: string
          description: |
            Chi tiết giao dịch — **string json** (không phải object) theo cấu trúc:
            ```json
            {
              "phoneNumber": "0xxxxxxxxx",
              "amount": "5350000",
              "extraInfo": {
                "businessLine": "CASHLOAN",
                "productLine": "ZLPPD01",
                "contractNumber": "u8123123Sjsdb"
              }
            }
            ```
            - `phoneNumber` (String, max 15, **M**): Số điện thoại KH
            - `accountNumber` (String, max 20, O): **không cần truyền**
            - `amount` (String, max 15, **M**): Số tiền deposit, dạng number, bội số 10.000 VNĐ
              và ≥ hạn mức tối thiểu theo hợp đồng
            - `extraInfo` (String json, **M**): map key-value, gồm
              - `extraInfo.businessLine` (O) = `CASHLOAN` — **truyền `CASHLOAN` cho cả 2 sản phẩm**
                (cashloan và payday)
              - `extraInfo.productLine` (O) = `ZLPPD01`
              - `extraInfo.contractNumber` (O) = loan code của Cake
          example: '{"phoneNumber":"0xxxxxxxxx","amount":"5350000","extraInfo":{"businessLine":"CASHLOAN","productLine":"ZLPPD01","contractNumber":"u8123123Sjsdb"}}'

    PartnerDisburseResponse:
      type: object
      required:
        - resultCode
        - message
        - responseTime
        - signature
        - data
      properties:
        resultCode:
          type: string
          maxLength: 10
          description: |
            Transaction result code — xem bảng error code bankconnector.
            **`00` = ĐÃ giải ngân; mọi mã khác = CHƯA giải ngân.**
          example: "00"
        message:
          type: string
          maxLength: 100
          description: Chi tiết của resultCode
          example: "SUCCESS"
        responseTime:
          type: string
          maxLength: 19
          description: Thời gian giao dịch. Format `yyyy-MM-dd HH:mm:ss`
          example: "2026-09-04 10:15:02"
        signature:
          type: string
          description: |
            Digital signature (DS): `signedData = resultCode + message + responseTime + data`,
            DS của ZaloPay, mã hoá RSA 2048 bằng private key của ZaloPay.
        data:
          type: string
          description: |
            **string json** gồm:
            - `transId` (String, max 30, **M**): Transaction ID do ZaloPay sinh
            - `bankTransId` (String, max 30, **M**): Transaction ID do Cake sinh (lấy từ request)
            - `extraInfo` (String json, O): thông tin bổ sung dạng map key-value
          example: '{"transId":"250903000123","bankTransId":"6f2d1b3a-9c44-4c8e-b1f7-0a2d9c5e7b31","extraInfo":""}'

    PartnerDisburseStatusRequest:
      type: object
      required:
        - fnc
        - partnerId
        - bankTransId
        - requestTime
        - signature
        - data
      properties:
        fnc:
          type: string
          maxLength: 30
          description: Loại giao dịch — truyền `QueryStatus`
          example: "QueryStatus"
        partnerId:
          type: string
          maxLength: 30
          description: "{partnerId} = ZPCAKE"
          example: "ZPCAKE"
        bankTransId:
          type: string
          maxLength: 50
          description: UUID Cake tạo mới mỗi request
          example: "c81e5a90-4b7d-4f21-9e33-1a6c0b2d8f47"
        requestTime:
          type: string
          maxLength: 19
          description: Thời gian gọi API. Format `yyyy-MM-dd HH:mm:ss`
          example: "2026-07-21 15:23:59"
        signature:
          type: string
          description: |
            Digital signature (DS): `signedData = fnc + partnerId + bankTransId + requestTime + data`,
            DS của Cake, mã hoá RSA 2048 bằng private key của Cake.
          example: "UpFK24EJUTZTNHZuPy+Sfe6dRmfujrhL3Dl...HBXsM3cA=="
        data:
          type: string
          description: |
            `QueryStatusRequest` — **string json escape** (nested/stringified), không phải object.
            Parse chuỗi này mới ra 4 field bên dưới:
            ```json
            {
              "phoneNumber": "0xxxxxxxxx",
              "amount": "100000",
              "orgBankTransId": "7d24613b-88f9-4c2d-af55-23fc8b837051",
              "extraInfo": ""
            }
            ```
            - `phoneNumber` (String, max 15, **M**): Số điện thoại KH
            - `amount` (String, max 15, O): Số tiền deposit, dạng number, bội số 10.000 VNĐ
              và ≥ hạn mức tối thiểu theo hợp đồng
            - `orgBankTransId` (String, **M**): `bankTransId` gốc của API top-up
            - `extraInfo` (String json, **M**): thông tin bổ sung dạng map key-value.
              Log mẫu truyền chuỗi rỗng `""`.
          example: '{"phoneNumber":"0xxxxxxxxx","amount":"100000","orgBankTransId":"7d24613b-88f9-4c2d-af55-23fc8b837051","extraInfo":""}'

    PartnerDisburseStatusResponse:
      type: object
      required:
        - resultCode
        - message
        - responseTime
        - signature
        - data
      description: |
        Envelope giống API top-up (`resultCode` / `message` / `responseTime` / `signature` / `data`).
        5 field `QueryStatusResponse` mà bản spec ZLP §2.2.5 liệt kê nằm **trong** `data` —
        đúng ghi chú *"The original transaction result will be returned to the data field"*.
      properties:
        resultCode:
          type: string
          maxLength: 10
          description: Kết quả của **chính lời gọi truy vấn** (theo bảng error code của ZLP)
          example: "1"
        message:
          type: string
          maxLength: 100
          description: Chi tiết của resultCode
          example: "Success"
        responseTime:
          type: string
          maxLength: 19
          description: Thời gian phản hồi. Format `yyyy-MM-dd HH:mm:ss`
          example: "2026-07-21 15:24:01"
        signature:
          type: string
          description: |
            Digital signature (DS): `signedData = resultCode + message + responseTime + data`,
            mã hoá RSA 2048 bằng private key của ZaloPay.
        data:
          type: string
          description: |
            `QueryStatusResponse` — **string json**, mang kết quả của **giao dịch top-up gốc**:
            - `returnCode` (String, max 10, **M**): **Origin transaction result code** — mã kết quả
              của giao dịch top-up gốc, theo bảng error code bankconnector (`00` = SUCCESS).
              Khác `resultCode` ở envelope.
            - `message` (String, max 100, **M**): Chi tiết của returnCode
            - `transId` (String, max 30, **M**): Transaction ID do ZaloPay sinh
            - `orgBankTransId` (String, max 30, **M**): `bankTransId` gốc của API top-up
            - `extraInfo` (String json, O): thông tin bổ sung dạng map key-value
          example: '{"returnCode":"1","message":"Success","transId":"250903000123","orgBankTransId":"7d24613b-88f9-4c2d-af55-23fc8b837051","extraInfo":""}'

# ─────────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────────
paths:
  # ════════════════════
  # ONBOARDING
  # ════════════════════
  /data-config:
    post:
      tags: [ Onboarding ]
      summary: "Lấy danh sách cấu hình cho form onboarding"
      description: |
        Get data config để hiển thị value list cho KH chọn trên form ở luồng onboarding:
        tỉnh/thành, quận/huyện, phường/xã, giới tính, hôn nhân, nghề nghiệp, chức vụ,
        mối quan hệ, mục đích vay, kỳ hạn đề nghị.
        Không cần request body.
      operationId: dataConfig
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Không cần body
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataConfigResponse"

  /check-profile:
    post:
      tags: [ Onboarding ]
      summary: "Kiểm tra hồ sơ, check trùng CIF"
      description: |
        Pre-check điều kiện trước khi KH đăng ký khoản vay, đồng thời check trùng CIF.

        **Điều kiện tiếp tục:** response `code = 1` AND `reject_code = null`
        → hiển thị form đăng ký khoản vay cho KH, sau đó gọi /client-create.
      operationId: checkProfile
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckProfileRequest"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckProfileResponse"

  /client-create:
    post:
      tags: [ Onboarding ]
      summary: "Khởi tạo hồ sơ KH trên CAKE"
      description: |
        Khởi tạo hồ sơ với new user trên CAKE.

        **Điều kiện tiếp tục:** response `request_id != null` → gọi /client-update.
      operationId: clientCreate
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientCreateRequest"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientCreateResponse"

  /client-update:
    post:
      tags: [ Onboarding ]
      summary: "Cập nhật hồ sơ, hình ảnh (eKYC)"
      description: |
        Gửi ảnh selfie + ảnh GTTT mặt trước/mặt sau + dữ liệu NFC.
        Nếu KH đã eKYC NFC thành công tại Cake thì chỉ cần gửi ảnh selfie (face-auth).

        **Điều kiện tiếp tục:** response `status = EKYC_SUCCESS` → gọi /loan-register.
        Nếu `EKYC_PENDING` → poll /get-status.
      operationId: clientUpdate
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdateRequest"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientUpdateResponse"

  /loan-register:
    post:
      tags: [ Onboarding ]
      summary: "Đăng ký khoản vay"
      description: |
        Gửi thông tin đăng ký khoản vay. Cake xử lý approval nội bộ.

        **Điều kiện tiếp tục:** `status = LOAN_APPROVE` → gọi /get-esign để lấy hợp đồng.
        Nếu `LOAN_REVIEWING` → poll /get-status hoặc đợi callback /partner-update-status.
      operationId: loanRegister
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanRegisterRequest"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanRegisterResponse"

  /get-status:
    post:
      tags: [ Onboarding ]
      summary: "Kiểm tra trạng thái hồ sơ khách hàng"
      description: |
        Truy vấn trạng thái hồ sơ eKYC của KH ở từng bước onboarding.
      operationId: getStatus
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetStatusRequest"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetStatusResponse"

  /get-loan-detail:
    post:
      tags: [ Repayment ]
      summary: "Truy vấn thông tin chi tiết khoản vay"
      description: |
        Get thông tin detail của khoản vay.

        **Lưu ý:** nếu response code = `400001` (failed) → gọi /get-status để cập nhật
        thông tin mới nhất, sau đó truy vấn lại.
      operationId: getLoanDetail
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetLoanDetailRequest"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetLoanDetailResponse"

  # ════════════════════
  # CONTRACT
  # ════════════════════
  /get-esign:
    post:
      tags: [ Contract ]
      summary: "Lấy thông tin hợp đồng tín dụng"
      description: |
        Get thông tin hợp đồng tín dụng (HTML + PDF) để hiển thị cho KH đọc và quyết định ký.
        Chỉ gọi khi `status = LOS_APPROVED` / `LOAN_APPROVE`.

        **Lưu ý:** phải gọi API này trước khi gọi /get-otp.
      operationId: getEsign
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetEsignRequest"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetEsignResponse"

  /contract-cancel:
    post:
      tags: [ Contract ]
      summary: "Gửi request huỷ hợp đồng"
      description: |
        KH quyết định huỷ hợp đồng → ZLP gọi API này.
      operationId: contractCancel
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractCancelRequest"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractCancelResponse"

  /get-otp:
    post:
      tags: [ Contract ]
      summary: "Request gửi OTP về SĐT của KH để ký hợp đồng"
      description: |
        Cake gửi OTP về số điện thoại của KH để KH nhập ở bước ký hợp đồng.

        **Quy tắc get-OTP:**
        - Tối đa **6 lần**/hợp đồng → sau lần thứ 6 hệ thống **huỷ hợp đồng**
        - **3 lần liên tiếp** (điều kiện: chưa gọi /verify-esign) → **block 15 phút**
      operationId: getOtp
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetOtpRequest"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetOtpResponse"

  /verify-esign:
    post:
      tags: [ Contract ]
      summary: "Verify OTP ký hợp đồng"
      description: |
        Verify OTP mà KH nhập vào là correct hay không.
        Nếu đúng → hợp đồng được ký, Cake chuyển sang luồng Active Loan / giải ngân.

        **Quy tắc verify-esign:**
        - Tối đa **6 lần sai**/hợp đồng → **huỷ hợp đồng**
        - **3 lần sai liên tiếp** (ZLP gọi qua CAKE) → **block 15 phút**
        - Tối đa **3 lần** verify với **01 mã OTP** → phải get-OTP mới; nếu không get mới
          mà vẫn gọi verify-esign thì trả lỗi `900000`
      operationId: verifyEsign
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEsignRequest"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyEsignResponse"

  # ════════════════════
  # DISBURSEMENT
  # ════════════════════
  /disburse-update:
    post:
      tags: [ Disbursement ]
      summary: "ZLP cập nhật trạng thái deposit vào ví ewallet"
      description: |
        Sau khi ZLP deposit vào ví ZLP ewallet của KH thành công, ZLP gọi API này để yêu cầu
        Cake disburse tiền vào TTĐB của ZLP tại Cake.

        **Lưu ý:** nếu Cake đã gửi /partner-disburse-request và ZLP đã deposit cho KH nhưng gọi
        /disburse-update thất bại, Cake sẽ gọi lại /partner-disburse-request. Khi đó ZLP
        **KHÔNG deposit lại** mà chỉ gọi lại /disburse-update.
      operationId: disburseUpdate
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisburseUpdateRequest"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"

  # ════════════════════
  # REPAYMENT
  # ════════════════════
  /repayment-request:
    post:
      tags: [ Repayment ]
      summary: "Gửi request thanh toán khoản vay"
      description: |
        ZLP dùng `loan_id` + tạo mới `partner_reference_id` để gửi request thanh toán.
        Cake trả về `order_id` để gọi /repayment-confirm.
      operationId: repaymentRequest
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepaymentRequestBody"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepaymentRequestResponse"

  /repayment-confirm:
    post:
      tags: [ Repayment ]
      summary: "Gửi order_id để confirm thanh toán"
      description: |
        Gửi `order_id` (từ /repayment-request) để confirm repayment.
        Cake xử lý gạch nợ nội bộ và trả kết quả (`SUCCESS` / `FAILED` / `HOLD`).
      operationId: repaymentConfirm
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/PartnerHeader"
        - $ref: "#/components/parameters/SignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepaymentConfirmRequest"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"

  # ════════════════════
  # PARTNER APIs (Cake gọi ZLP)
  # ════════════════════
  /partner-update-status:
    post:
      tags: [ Partner Callbacks ]
      summary: "Cake cập nhật trạng thái hồ sơ/khoản vay sang ZLP"
      description: |
        **Chiều: Cake → ZLP** (bản spec ZLP gọi API này là `status-update`)

        Path phía ZLP: `POST /cash-loan/cake/contract/callback`

        Cake chủ động gọi API này trên hệ thống ZLP để thông báo thay đổi trạng thái khoản vay.
        ZLP expose endpoint này.

        **Header:** `Content-Type`, `x-client-key`, `x-sign` (khác quy ước `partner-*` chuẩn
        của Cake — theo hợp đồng ZLP).

        **Response:** `return_message`, `return_code` (1 = SUCCESS, 2 = FAIL), `sub_return_code`.
      operationId: partnerUpdateStatus
      servers:
        - url: https://{zlp_host}
          description: ZLP host (ZLP cấp) — path đầy đủ `/cash-loan/cake/contract/callback`
          variables:
            zlp_host:
              default: zlp-host
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/ClientKeyHeader"
        - $ref: "#/components/parameters/XSignHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerUpdateStatusRequest"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerUpdateStatusResponse"

  /partner-disburse-request:
    post:
      tags: [ Partner Callbacks ]
      summary: "Cake yêu cầu ZLP top-up vào ví ewallet của KH"
      description: |
        **Chiều: Cake → ZLP** (bản spec ZLP gọi API này là `top-up`)

        Path phía ZLP (ZaloPay bankconnector):
        - Non-prod: `POST https://sbzpbankconnector.zalopay.vn/banks/v1/zpcake`
        - Prod: `POST https://bankconnector.zalopay.vn/banks/v1/zpcake`

        Sau khi KH ký hợp đồng thành công, Cake gọi API do ZLP cung cấp để yêu cầu ZLP
        deposit tiền vào ví ZLP ewallet của KH. Sau khi deposit xong ZLP gọi lại
        /disburse-update để Cake disburse vào TTĐB của ZLP tại Cake.

        **Header:** chỉ `Content-Type`. Ký bằng field `signature` trong body.

        **Hợp đồng field theo chuẩn bankconnector của ZLP** (`fnc`, `partnerId`, `bankTransId`,
        `data` dạng string-json) — không theo chuẩn `partner-*` của Cake.
      operationId: partnerDisburseRequest
      servers:
        - url: https://bankconnector.zalopay.vn/banks/v1/zpcake
          description: Production
        - url: https://sbzpbankconnector.zalopay.vn/banks/v1/zpcake
          description: Non-prod
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerDisburseRequest"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerDisburseResponse"

  /partner-disburse-status:
    post:
      tags: [ Partner Callbacks ]
      summary: "QueryStatus — Cake truy vấn trạng thái giao dịch top-up"
      description: |
        **Chiều: Cake → ZLP** (bản spec ZLP §2.2.5 gọi API này là `QueryStatus`)

        Cùng path với top-up (ZaloPay bankconnector), phân biệt bằng `fnc`:
        - Non-prod: `POST https://sbzpbankconnector.zalopay.vn/banks/v1/zpcake`
        - Prod: `POST https://bankconnector.zalopay.vn/banks/v1/zpcake`

        **Header:** chỉ `Content-Type`. Ký bằng field `signature` trong body.

        **Hợp đồng field theo chuẩn bankconnector của ZLP** (`fnc`, `partnerId`, `bankTransId`,
        `data` string-json) — không theo chuẩn `partner-disburse-status` của Cake
        (`success`/`code`/`message` + `data.partner_disburse_status`).
      operationId: partnerDisburseStatus
      servers:
        - url: https://bankconnector.zalopay.vn/banks/v1/zpcake
          description: Production
        - url: https://sbzpbankconnector.zalopay.vn/banks/v1/zpcake
          description: Non-prod
      parameters:
        - $ref: "#/components/parameters/ContentTypeHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerDisburseStatusRequest"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerDisburseStatusResponse"

# ─────────────────────────────────────────────
# TAGS
# ─────────────────────────────────────────────
tags:
  - name: Onboarding
    description: |
      Luồng đăng ký khoản vay:
      check-profile → data-config → client-create → client-update → loan-register → get-status
  - name: Contract
    description: |
      Luồng ký hợp đồng:
      get-esign → get-otp → verify-esign
      Hoặc: contract-cancel
  - name: Disbursement
    description: |
      Luồng giải ngân: Cake gọi partner-disburse-request (top-up) → ZLP deposit vào ví ewallet
      của KH → ZLP gọi disburse-update.
      Truy vấn trạng thái giao dịch top-up: partner-disburse-status (QueryStatus)
  - name: Repayment
    description: |
      Luồng thanh toán khoản vay: get-loan-detail → repayment-request → repayment-confirm
  - name: Partner Callbacks
    description: |
      API Cake gọi sang ZLP. ZLP expose các endpoint này, hợp đồng field do ZLP định nghĩa
      (khác quy ước `partner-*` chuẩn của Cake).

# ─────────────────────────────────────────────
# SEQUENCE DIAGRAMS - API FLOWS (x-extension)
# ─────────────────────────────────────────────
x-mermaid-flows:

  onboarding: |
    sequenceDiagram
      autonumber
      actor KH as ZaloPay customer
      participant Z as ZaloPay
      participant C as Cake

      KH->>Z: Mở màn hình đăng ký khoản vay trên app ZaloPay
      Note over Z,C: BƯỚC 1 - PRE-CHECK
      Z->>C: check-profile(full_name, phone_number, document_id, dob, extra_data)
      C-->>Z: reject_code, reject_message
      alt reject_code != null
        Z-->>KH: Hiển thị thông báo từ chối
      else code = 1 AND reject_code = null
        Z->>C: data-config()
        C-->>Z: value list cho form (city/dist/ward, gender, occupation...)
        KH->>Z: Nhập thông tin khoản vay và submit
        Note over Z,C: BƯỚC 2 - TẠO HỒ SƠ KH
        Z->>C: client-create(thông tin KH, metadata)
        C-->>Z: request_id
        Note over Z,C: BƯỚC 3 - eKYC (selfie + 2 mặt GTTT + NFC)
        Z->>C: client-update(request_id, selfie_image, front/back_nid_image, nfc_data)
        C-->>Z: status (EKYC_PENDING / EKYC_SUCCESS / EKYC_REJECT)
        Note over Z,C: BƯỚC 4 - ĐĂNG KÝ KHOẢN VAY
        Z->>C: loan-register(request_id, phone_number, document_id)
        C-->>Z: loan_id, status
        alt status = LOAN_REVIEWING
          Z->>C: get-status (poll)
          C-->>Z: status
          C->>Z: partner-update-status(request_id, status=LOAN_APPROVE)
          Z-->>C: return_code = 1
        end
        Note over Z: status = LOAN_APPROVE → chuyển sang luồng Contract
      end

  contract_signing: |
    sequenceDiagram
      autonumber
      actor KH as ZaloPay customer
      participant Z as ZaloPay
      participant C as Cake

      Note over Z,C: Điều kiện vào - loan_id có status = LOAN_APPROVE
      Z->>C: get-esign(loan_id)
      C-->>Z: url (HTML), url_pdf, expired_time
      Z-->>KH: Hiển thị hợp đồng PDF trong frame để KH đọc

      alt KH quyết định huỷ hợp đồng
        KH->>Z: Huỷ hợp đồng
        Z->>C: contract-cancel(loan_id)
        C-->>Z: success (data = null)
      else KH quyết định ký hợp đồng
        KH->>Z: Ký hợp đồng
        Z->>C: get-otp(loan_id)
        C-->>Z: blocked, contract_is_rejected, otp_count, otp_period
        Note over C,KH: Cake gửi OTP về SĐT của KH
        KH->>Z: Nhập OTP
        Z->>C: verify-esign(loan_id, otp)
        alt is_correct_otp = true
          C-->>Z: is_correct_otp = true, verify_count
          Z-->>KH: Thành công - đợi giải ngân trong vài phút
          Note over C: Cake chuyển sang luồng Active Loan / giải ngân
        else OTP sai
          C-->>Z: lỗi 300005 / 300006 / 300007
        end
      end

  disburse: |
    sequenceDiagram
      autonumber
      actor KH as ZaloPay customer
      participant Z as ZaloPay
      participant C as Cake

      Note over Z,C: Điều kiện vào - KH đã ký hợp đồng thành công
      C->>Z: partner-disburse-request / top-up (fnc=BankCashIn, amount, contractNumber)
      Z-->>C: resultCode, transId, bankTransId
      Z->>KH: Deposit tiền vào ví ZLP ewallet của KH
      alt Deposit thành công
        Z->>C: disburse-update(loan_id, partner_disburse_status=1)
        C-->>Z: success - Cake disburse vào TTĐB của ZLP, loan → LOAN_ACTIVE
      else Deposit thất bại
        Z->>C: disburse-update(loan_id, partner_disburse_status=2)
        C-->>Z: success - Cake huỷ khoản vay
      end

      Note over Z,C: Truy vấn trạng thái giao dịch top-up
      C->>Z: partner-disburse-status (fnc=QueryStatus, orgBankTransId)
      Z-->>C: resultCode + data(returnCode, transId, orgBankTransId)

      Note over Z,C: Trường hợp disburse-update thất bại
      C->>Z: partner-disburse-request (retry)
      Note over Z: KHÔNG deposit lại - chỉ gọi lại disburse-update
      Z->>C: disburse-update(loan_id, partner_disburse_status=1)

  repayment: |
    sequenceDiagram
      autonumber
      actor KH as ZaloPay customer
      participant Z as ZaloPay
      participant C as Cake

      Note over Z,C: Điều kiện vào - loan_id có status = LOAN_ACTIVE
      KH->>Z: Xem chi tiết khoản vay
      Z->>C: get-loan-detail(loan_id)
      C-->>Z: dư nợ, due_date, total_payment_amount, loan_account_status
      Z-->>KH: Hiển thị thông tin khoản vay

      KH->>Z: Chọn thanh toán
      Z->>C: repayment-request(loan_id, partner_reference_id, payment_amount)
      C-->>Z: order_id
      Z->>C: repayment-confirm(loan_id, partner_reference_id, payment_amount, order_id)
      Note over C: Cake xử lý gạch nợ nội bộ
      C-->>Z: kết quả (SUCCESS / FAILED / HOLD)
      Z-->>KH: Hiển thị kết quả thanh toán
