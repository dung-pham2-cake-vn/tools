info:
  title: ZaloPay Payday - Native Lending APIs
  description: |
    > **⚠️ Lưu ý bản quyền:** Tài liệu này thuộc bản quyền của **Cake by VPBank**.
    > Mọi hình thức sao chép, chỉnh sửa, hoặc phát tán phải được sự đồng ý bằng văn bản của Cake by VPBank.

    ## Mô tả
    API tích hợp giữa **ZaloPay (ZLP)** và hệ thống **Cake Digital Bank** cho sản phẩm **ZaloPay Payday**
    (vay ngắn ngày, giải ngân vào ví ZaloPay ewallet của KH).

    Tài liệu được chuyển đổi từ file `ZLP Payday - API spec` (bản Excel/PDF). Tên field giữ nguyên
    theo bản spec đã đàm phán với ZLP (`loan_id`, `partner_reference_id`, `dob`...), **không** đổi sang
    tên chuẩn của base Native (`loan_code`, `date_of_birth`).

    Sản phẩm dùng chung khoá/hợp đồng ký với **ZLP Cashloan** (`PARTNER_KEY`, `PUBLIC_KEY` — xem
    `zlp_cashloan/index.yaml`), chỉ khác `CAKE_API_URL` và bộ API (payday **không có luồng
    Termination**).

    **Danh sách API:**

    | Endpoint | PIC | Bước |
    |----------|-----|------|
    | `/check-profile` | CAKE | Onboarding |
    | `/data-config` | CAKE | Onboarding |
    | `/client-create` | CAKE | Onboarding |
    | `/client-update` | CAKE | Onboarding |
    | `/loan-register` | CAKE | Onboarding |
    | `/get-status` | CAKE | Onboarding |
    | `/partner-update-status` | ZLP | Onboarding (callback) |
    | `/get-esign` | CAKE | Sign Contract |
    | `/contract-cancel` | CAKE | Sign Contract |
    | `/get-otp` | CAKE | Sign Contract |
    | `/verify-esign` | CAKE | Sign Contract |
    | `/partner-disburse-request` | ZLP | Disbursement (top-up) |
    | `/disburse-update` | CAKE | Disbursement |
    | `/get-loan-detail` | CAKE | Repayment |
    | `/repayment-request` | CAKE | Repayment |
    | `/repayment-confirm` | CAKE | Repayment |
    | `/partner-disburse-status` | ZLP | Disbursement (query, `fnc = QueryStatus`) |

    **Ba API chiều Cake → ZLP** (ZLP expose, ZLP tự định nghĩa hợp đồng):
    - `status-update` → tài liệu này đặt tên theo chuẩn Cake là **`/partner-update-status`**;
      path phía ZLP: `POST /cash-loan/cake/contract/callback`.
      Header: `Content-Type`, `x-client-key`, `x-sign`. Response: `return_message`, `return_code`,
      `sub_return_code` (**không** dùng `PartnerCallbackResponse` chuẩn của Cake).
    - `top-up` → tài liệu này đặt tên theo chuẩn Cake là **`/partner-disburse-request`**;
      path phía ZLP: `POST /banks/v1/zpcake` trên ZaloPay bankconnector (`fnc = BankCashIn`).
      Hợp đồng field theo chuẩn bankconnector của ZLP (`partnerId`, `bankTransId`, `data` dạng
      string-json), **không** theo chuẩn `partner-*` của Cake.
    - `QueryStatus` (spec ZLP §2.2.5) → tài liệu này đặt tên theo chuẩn Cake là
      **`/partner-disburse-status`**; cùng path bankconnector với top-up, phân biệt bằng
      `fnc = QueryStatus`.

    ⚠️ Ba endpoint trên lệch khỏi quy ước `partner-*` của Cake (§4 CLAUDE.md) vì ZLP là bên expose
    và đã cố định hợp đồng. Giữ nguyên theo bản spec ZLP, không đồng bộ về base.

