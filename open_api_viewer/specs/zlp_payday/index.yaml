                  example: "req-abc123"

    ClientUpdateRequest:
      type: object
      required:
        - request_id
        - phone_number
        - document_id
        - selfie_image
        - nfc_data
      properties:
        request_id:
          type: string
          description: Request ID từ API /client-create
          example: "req-abc123"
        phone_number:
          type: string
          description: Số điện thoại KH (bắt đầu bằng số 0)
          example: "0xxxxxxxxx"
        document_id:
          type: string
          description: Số CMND/CCCD (ZLP gửi sang)
          example: "xxxxxxxxxxxx"
        selfie_image:
          type: string
          format: byte
          description: Ảnh selfie (base64, size ≤ 1MB, ảnh dọc)
        front_nid_image:
          type: string
          format: byte
          nullable: true
          description: |
            Ảnh GTTT mặt trước (base64, size ≤ 1MB, ảnh ngang).
            **Required** nếu KH chưa eKYC NFC thành công tại Cake.
        back_nid_image:
          type: string
          format: byte
          nullable: true
          description: |
            Ảnh GTTT mặt sau (base64, size ≤ 1MB, ảnh ngang).
            **Required** nếu KH chưa eKYC NFC thành công tại Cake.
        nfc_data:
          type: object
          description: Thông tin NFC data của KH
          required:
            - sod
            - dg1
            - dg2
            - dg13
            - dg14
            - dg15
          properties:
            sod:
              type: string
              description: NFC sod value
            dg1:
              type: string
              description: NFC data group 1
            dg2:
              type: string
              description: NFC data group 2
            dg13:
              type: string
              description: NFC data group 13
            dg14:
              type: string
              description: NFC data group 14
            dg15:
              type: string
              description: NFC data group 15
            com:
              type: string
              nullable: true
              description: NFC com data (optional)

    ClientUpdateResponse:
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              description: |
                Bản spec ZLP Payday **gạch bỏ** `document_id`, `user_id`, `full_name`,
                `phone_number`, `email`, `is_new_user` — response chỉ còn `status`.
              properties:
                status:
                  type: string
                  description: Trạng thái hồ sơ eKYC
                  enum:
                    - EKYC_UNKNOWN
                    - EKYC_INIT
                    - EKYC_PENDING
                    - EKYC_REJECT
                    - EKYC_SUCCESS
                  example: EKYC_SUCCESS

