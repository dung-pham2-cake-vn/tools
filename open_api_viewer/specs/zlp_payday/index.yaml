    ### Error code table — bankconnector ZLP (`resultCode` / `returnCode`)
    Theo `Zalopay-IB_Mobile_Banking_Integration` v1.5 §2.2.6.

    | Code | Status | Description |
    |------|--------|-------------|
    | `00` | SUCCESS | SUCCESS |
    | `01` | PENDING | Duplicate transaction (bankTransId đã tồn tại). Giao dịch pending, chờ đối soát với ZaloPay |
    | `02` | FAILED | Couldn't decrypt the encrypted data |
    | `03` | FAILED | Invalid IP |
    | `04` | FAILED | E-wallet account does not exist |
    | `05` | FAILED | Account number is in the wrong format |
    | `06` | FAILED | Phone number is in the wrong format |
    | `07` | FAILED | Fullname is in the wrong format |
    | `08` | FAILED | Account / phone number is linked with e-wallet |
    | `09` | FAILED | No client defined yet |
    | `10` | FAILED | Account/phone number đã liên kết nhưng chưa đủ điều kiện thực hiện giao dịch. KH cần vào app ZaloPay nâng cấp tài khoản |
    | `11` | FAILED | Exceeded the wallet's top-up limit |
    | `12` | FAILED | Transaction not found |
    | `97` | FAILED | Parameter is incorrect |
    | `98` | PENDING | Có lỗi khi xử lý. Giao dịch pending, chờ đối soát với ZaloPay |
    | `99` | FAILED | Incorrect signature |
    | `100` | PENDING | System error. Giao dịch pending, chờ đối soát với ZaloPay |

    > **`resultCode` = `00` → ĐÃ giải ngân** vào ví ZaloPay của KH.
    > **Mọi mã còn lại → CHƯA giải ngân.**

    ### API `/partner-update-status` (ZLP trả về cho Cake)
    | Code | Description | Action |
    |------|-------------|--------|
    | `-400` | Invalid params | Partner should check the params |
    | `-401` | Authentication failed | Partner should check signature |
    | `-404` | Request ID not found | Partner should check the params |
    | `-503` | System maintenance | Partner should call the API callback again |

    ## Định nghĩa trạng thái

    ### Trạng thái hồ sơ ZLP truy vấn qua API `/get-status`
    | Process | Status Code | Description |
    |---------|-------------|-------------|
    | // | `EKYC_UNKNOWN` | Hồ sơ KH có trạng thái không xác định |
    | REGISTER | `EKYC_INIT` | Hồ sơ EKYC của KH đã được khởi tạo |
    | REGISTER | `EKYC_PENDING` | Hồ sơ EKYC của KH đang chờ phê duyệt |
    | REGISTER | `EKYC_REJECT` | Hồ sơ EKYC của KH bị từ chối |
    | REGISTER | `EKYC_SUCCESS` | Hồ sơ KH đã EKYC thành công |

    ### Trạng thái khoản vay ZLP truy vấn qua API `/get-loan-detail`
    | Process | Status Code | Description |
    |---------|-------------|-------------|
    | // | `LOAN_UNKNOWN` | Trạng thái không xác định |
    | LOAN | `LOAN_INIT` | Hồ sơ đăng ký khoản vay đã được khởi tạo |
    | LOAN | `LOAN_REVIEWING` | Hồ sơ đăng ký khoản vay đang chờ phê duyệt |
    | LOAN | `LOAN_REJECT` | Hồ sơ đăng ký khoản vay bị từ chối |
    | LOAN | `LOAN_APPROVE` | Hồ sơ đăng ký khoản vay đã được phê duyệt |
    | LOAN | `LOAN_EXPIRED` | Hồ sơ đăng ký khoản vay hết hạn (7 ngày) |
    | LOAN | `LOAN_CANCEL` | KH hủy hợp đồng khoản vay |
    | LOAN | `LOAN_SIGNED` | KH ký hợp đồng vay thành công |
    | LOAN | `LOAN_ACTIVE` | Khoản vay đã được giải ngân thành công |
    | LOAN | `LOAN_CLOSE` | Khoản vay đã tất toán |

    ### Trạng thái Cake callback qua `/partner-update-status`
    `LOAN_APPROVE`, `LOAN_REJECT`, `LOAN_EXPIRED`, `LOAN_SIGNED`, `LOAN_CANCEL`, `LOAN_ACTIVE`, `LOAN_CLOSE`

    ### Trạng thái thanh toán trả về ở `/repayment-confirm`
    | Process | Status Code | Description |
    |---------|-------------|-------------|
    | REPAYMENT | `SUCCESS` | Yêu cầu thanh toán xử lý thành công |
    | REPAYMENT | `FAILED` | Yêu cầu thanh toán xử lý không thành công, vui lòng thực hiện lại yêu cầu |
    | REPAYMENT | `HOLD` | Yêu cầu thanh toán xử lý không xác định, cần đối soát thủ công T+1 |

