      type: object
      required:
        - request_id
        - phone_number
        - document_id
      properties:
        request_id:
          type: string
          description: Request ID từ API /client-create
          example: "req-abc123"
        phone_number:
          type: string
          description: Số điện thoại KH (bắt đầu bằng số 0)
          example: "0xxxxxxxxx"
        document_id:
          type: string
          description: Số CMND/CCCD (ZLP gửi sang)
